name: lint

# The cheap, fast gate on every push and pull request: undefined names, unused
# variables, other pyflakes/pycodestyle findings, and the public-clone hygiene
# scan. The full CPU/GPU suite runs on `validation.yml` (weekly, sharded) and on
# VESSL; the bounded pytest gate runs on `pr-tests.yml`.
#
# Both jobs are ONE call to a script. They used to be inline shell, and on
# 2026-09-18 a red hygiene grep on a pull request could not be reproduced
# locally because the only copy of the command was this file. What CI runs has
# to be runnable locally: `scripts/ci/local.sh` runs both of these and the rest
# of the sub-three-minute gates in the same order.

on:
  push:
    branches:
      - main
  pull_request:

# Superseded runs on the same PR/branch are cancelled: a force-push or a
# stacked-leg rebase used to leave the previous run queued, and on a busy day
# (2026-09-15: six branches × 21 jobs against the plan's concurrent-job limit)
# that held every PR for an hour. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      # The scope, the selector and the ignore list live in the script.
      # tests/contracts/test_pr_body_contract.py pins the path list there.
      - name: Lint the pinned scope
        run: bash scripts/ci/lint.sh

  agent-docs-hygiene:
    # docs/agent/ pages are sanitized public exports of internal (gitignored)
    # agent guidance, and shipped code is read by the same public-clone reader.
    # A public clone does not contain docs/agent-memory/, docs/research_notes/,
    # CLAUDE.md or .claude/ — so neither may point a reader at them.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Forbid gitignored-path references in docs/agent/, rfx/ and examples/
        run: bash scripts/ci/docs_hygiene.sh
