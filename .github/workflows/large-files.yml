name: large-files
# The same check as .githooks/pre-commit, for pushes and pull requests made without the hook.
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .githooks
      - name: Files that belong on NFS
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            head=$PR_HEAD
            set -- "$PR_BASE"
          else
            head=$AFTER
            set -- "$BEFORE"
            if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
              set --
              # Related history: as before, the default branch. Unrelated history: every other branch that does not
              # contain head (a branch pushed together with head, or just after it, is no proof the remote had it).
              if git merge-base "origin/$DEFAULT" "$head" >/dev/null 2>&1; then set -- "origin/$DEFAULT"; else
              for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/); do
                case "$ref" in
                  refs/remotes/origin/HEAD|"refs/remotes/origin/$PUSH_BRANCH") continue ;;
                esac
                git merge-base --is-ancestor "$head" "$ref" && continue
                set -- "$@" "$ref"
              done; fi
            fi
          fi
          sh .githooks/check-large-files.sh --new "$head" "$@"
