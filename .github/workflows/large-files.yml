name: large-files
# The same check as .githooks/pre-commit, for pushes and pull requests made without the hook.
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .githooks
      - name: Files that belong on NFS
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            head=$PR_HEAD
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
          else
            head=$AFTER
            base=$BEFORE
            if [ "$base" = 0000000000000000000000000000000000000000 ]; then
              base=$(git merge-base "origin/$DEFAULT" "$head" 2>/dev/null || git hash-object -t tree /dev/null)
            fi
          fi
          sh .githooks/check-large-files.sh "$base" "$head"
