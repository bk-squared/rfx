name: pr-body

# Every merged change is read by a SEPARATE agent instance, and every PR
# belongs to exactly one owner lane. Both facts were prose-only until now.
# Audit 2026-09-18: of the 90 PRs merged since 2026-09-11, 35 carried no review
# trace at all, and none of the 17 open PRs carried the line. Agents from
# several pods push under one GitHub account, so the PR body is the only
# provenance a reader has. This job turns the two lines into a gate that binds
# every author, Codex included.
#
# Mark this job a REQUIRED check in branch protection. Until it is required, a
# red pr-body-contract does not stop a merge, and the gate is advisory only --
# which is the state the prose rule was already in.
#
# The contract and its failure message live in scripts/ci/check_pr_body.py;
# tests/contracts/test_pr_body_contract.py pins the accepted forms.

# `labeled`/`unlabeled` cover a lane label changed BY HAND. They do not cover
# `.github/workflows/labeler.yml`: an event triggered by GITHUB_TOKEN creates no
# workflow run, so a label that job applies fires nothing here. That is why the
# label set is read from the API at check time rather than taken from the event
# payload -- see the step below.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

# Superseded runs on the same PR are cancelled: editing a body twice in a
# minute used to queue two runs, and this gate is re-triggered by every edit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-body-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the live lane labels, and this PR's own
        # Two different questions. LANE_LABELS is which lanes EXIST, so a lane
        # added after the script was written does not fail a PR; `grep` exits 1
        # on no match, which would fail the step -- hence `|| true`, and an
        # empty value makes the script fall back to its own list.
        #
        # PR_LABELS_JSON is which lanes THIS PR carries, and it is read from the
        # API rather than from `github.event.pull_request.labels`. The payload is
        # wrong twice over: on `opened` it is empty because
        # .github/workflows/labeler.yml has not run yet, and when that job does
        # run its label change fires no event here at all, because an event
        # triggered by GITHUB_TOKEN creates no workflow run. Only a live read
        # sees what the PR actually carries.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh label list --limit 100 --json name --jq '.[].name' | grep '^lane:' || true)
          {
            echo "LANE_LABELS<<EOF"
            echo "$labels"
            echo "EOF"
          } >> "$GITHUB_ENV"
          pr_labels=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')
          {
            echo "PR_LABELS_JSON<<EOF"
            echo "$pr_labels"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Check the PR body
        # The body is passed through the environment, never interpolated into
        # the shell: a body is attacker-controlled text and `${{ }}` inside a
        # `run:` block is a script injection.
        # PR_LABELS_JSON reaches the script through GITHUB_ENV, set by the step
        # above. It cross-checks the `Lane:` line against the labels the paths
        # earned; it never satisfies the line on its own.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/ci/check_pr_body.py
