name: public-docs-source

on:
  push:
    branches:
      - main
    paths:
      - "docs/public/**"
      - "README.md"
      - "examples/quickstart/hello_world.py"
      - "scripts/sync_intro_snippet.py"
      - "scripts/sync_showcase_snippet.py"
      - "scripts/showcase/patch_sensitivity.py"
      - "scripts/build_public_docs_bundle.py"
      - "scripts/requirements-public-docs.txt"
      - "tests/unit/docs/**"
      - "docs/guides/*support_matrix.json"
      - "docs/agent/**"
      - "docs/guides/public_docs_architecture.md"
      - "scripts/check_public_docs_sync.py"
      - "scripts/check_public_docs_manifest.py"
      - "scripts/export_public_docs_to_gitops.py"
      - ".github/workflows/public-docs-source.yml"
      - "rfx/**"
      - "pyproject.toml"
      - "scripts/check_api_reference.py"
      - "docs/guides/api_symbol_inventory.json"
      - "docs/pdoc_templates/**"
  pull_request:
    paths:
      - "docs/public/**"
      - "README.md"
      - "examples/quickstart/hello_world.py"
      - "scripts/sync_intro_snippet.py"
      - "scripts/sync_showcase_snippet.py"
      - "scripts/showcase/patch_sensitivity.py"
      - "scripts/build_public_docs_bundle.py"
      - "scripts/requirements-public-docs.txt"
      - "tests/unit/docs/**"
      - "docs/guides/*support_matrix.json"
      - "docs/agent/**"
      - "docs/guides/public_docs_architecture.md"
      - "scripts/check_public_docs_sync.py"
      - "scripts/check_public_docs_manifest.py"
      - "scripts/export_public_docs_to_gitops.py"
      - ".github/workflows/public-docs-source.yml"
      - "rfx/**"
      - "pyproject.toml"
      - "scripts/check_api_reference.py"
      - "docs/guides/api_symbol_inventory.json"
      - "docs/pdoc_templates/**"

# Superseded runs on the same PR/branch are cancelled: a force-push or a
# stacked-leg rebase used to leave the previous run queued, and on a busy day
# (2026-09-15: six branches × 21 jobs against the plan's concurrent-job limit)
# that held every PR for an hour. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  public-docs-source:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check public-doc scripts
        run: python -m py_compile scripts/check_public_docs_sync.py scripts/check_public_docs_manifest.py scripts/export_public_docs_to_gitops.py scripts/build_public_docs_bundle.py scripts/sync_showcase_snippet.py

      - name: Verify the generated introductory code
        run: python scripts/sync_intro_snippet.py --check

      - name: Verify the showcase objective excerpt against its script
        run: python scripts/sync_showcase_snippet.py --check

      - name: Verify site map resolves
        run: python scripts/check_public_docs_manifest.py

  # W4.7: regenerate the pdoc API reference at HEAD and fail when the public
  # surface drifted from the committed symbol inventory (an API change must
  # not ship without regenerating the reference).
  api-reference:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + pdoc
        # pdoc pinned to the major it was measured against (16.0.0): docs/pdoc_templates/
        # extends pdoc's own default/module.html.jinja2 and overrides two of its macros
        # (issue #1019), so a major bump can change that contract underneath us. The
        # anchor gate below is the tripwire if it ever does.
        run: pip install -r scripts/requirements-public-docs.txt -e ".[dev]"

      - name: Check publication boundaries
        run: pytest -q tests/unit/docs/test_public_docs_bundle.py

      - name: Generate the pinned API and LLM documentation bundle
        run: python scripts/build_public_docs_bundle.py --output-dir docs/_build/public-docs

      - name: Verify source identity and artifact checksums
        run: python scripts/build_public_docs_bundle.py --verify docs/_build/public-docs

      - name: Gate — symbol inventory drift + required symbols in rendered HTML
        run: python scripts/check_api_reference.py --html-dir docs/_build/public-docs/files/api/generated
