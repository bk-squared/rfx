# Path -> owner lane. This file is the source of which lane a change belongs to.
#
# Ten `lane:*` labels were hand-applied to 32 issues on 2026-09-18 and the
# mapping lived only in a pinned legend issue. A lane is really a set of PATHS,
# and a path -> label file is the standard tool, so the mapping lives here and
# `.github/workflows/labeler.yml` applies it to every pull request.
#
# Read with `actions/labeler@v5` syntax. Globs are minimatch: `**` spans path
# segments, `*` does not. `sync-labels: false` in the workflow means labels are
# only ADDED: a lane label the author applied by hand survives later pushes, and
# a lane earned by an earlier commit stays for the branch's life.
#
# Two lane labels on one PR is information, not an error: a change that touches
# the waveguide extractor and the MSL extractor really does belong to both.
# The PR body's `Lane:` line then names the primary one, and
# `scripts/ci/check_pr_body.py` requires that line as soon as a PR carries more
# than one lane label.
#
# Globs are deduplicated on purpose -- `rfx/**/*waveguide*` covers the four
# files an explicit list would name, and a glob that only repeats another one
# hides the day the narrow path moves. `tests/contracts/test_governance_intake_contract.py`
# fails if any glob below matches nothing tracked, because a dead glob is
# configuration that silently owns nothing.
#
# NOT every path is owned, by design. `rfx/` core (grid, simulation, api,
# materials), `scripts/diagnostics/` (except a few files named below),
# `validation/research/` and most of `tests/unit/` carry no lane; a PR confined
# to them gets no label and must carry the `Lane:` line itself. `changelog.d/`
# is deliberately unowned: every PR adds a fragment there, so owning it would
# put a second label on every pull request. `lane:plan` is deliberately absent
# too -- it marks trackers and deferred decisions that nobody implements from,
# so no path can imply it.

"lane:waveguide-port":
  - changed-files:
      - any-glob-to-any-file:
          - "rfx/**/*waveguide*"
          - "tests/**/*waveguide*"
          - "scripts/**/*waveguide*"

"lane:msl-port":
  - changed-files:
      - any-glob-to-any-file:
          - "rfx/**/msl*"
          - "rfx/microstrip.py"
          - "tests/**/*msl*"
          - "scripts/**/*msl*"

"lane:coax-mixed-port":
  - changed-files:
      - any-glob-to-any-file:
          - "rfx/**/coax*"
          - "rfx/sparams/mixed.py"
          - "rfx/**/*wire*"
          - "rfx/lumped.py"
          # Lumped and wire port S and records live in the measurement layer.
          - "rfx/measurement/port*.py"
          - "tests/**/*coax*"
          # NOT `tests/**/*mixed*`: that also owns tests/unit/grid/
          # test_mixed_precision.py, which is f32/f64 arithmetic and has nothing
          # to do with a mixed-mode port. The contract test pins that file as a
          # must-NOT-match.
          - "tests/**/*mixed_port*"
          - "tests/**/*mixed_refplane*"
          - "tests/**/*wire*"
          - "tests/**/*lumped*"
          - "scripts/**/*coax*"

"lane:absorber":
  - changed-files:
      - any-glob-to-any-file:
          - "rfx/boundaries/**"
          - "rfx/preflight/absorber.py"
          - "rfx/model/pad_fill.py"
          - "rfx/geometry/smoothing.py"
          # Plane-wave source, far field and RCS (absorber's list, lead 2026-10-12).
          # Shared on purpose: tests/contracts/ files also earn lane:ci-infra,
          # the distributed NTFF runner and its tests lane:distributed, the
          # non-uniform far-field tests lane:nu-mesh.
          - "rfx/sources/tfsf*.py"
          - "rfx/farfield.py"
          - "rfx/ntff_*.py"
          - "rfx/preflight/ntff.py"
          - "rfx/rcs.py"
          - "rfx/runners/_distributed_ntff.py"
          - "tests/unit/boundaries/**"
          - "tests/**/*pml*"
          - "tests/**/*smoothing*"
          - "tests/**/*tfsf*"
          - "tests/**/*ntff*"
          - "tests/**/*farfield*"
          - "tests/**/*rcs*"
          # The run()/forward() one-pipeline contract (owner absorber, PI 2026-10-12).
          - "tests/contracts/*run_forward*"

"lane:nu-mesh":
  - changed-files:
      - any-glob-to-any-file:
          - "rfx/**/nonuniform*"
          - "rfx/mesh_planner.py"
          - "rfx/mesh_edges.py"
          - "rfx/preflight/mesh.py"
          - "rfx/amr.py"
          # rfx/model/ (realized-model layer): the graded grid and the material modules
          - "rfx/model/graded_grid.py"
          - "rfx/model/graded_profile.py"
          - "rfx/model/materials.py"
          - "rfx/model/overrides.py"
          - "rfx/model/electric_metrics.py"
          - "rfx/model/pole_stability.py"
          - "rfx/model/tensor_operands.py"
          - "tests/unit/nonuniform/**"
          - "tests/**/*nonuniform*"
          - "tests/**/*_nu_*"

"lane:distributed":
  - changed-files:
      - any-glob-to-any-file:
          - "rfx/runners/*distributed*"
          - "tests/**/*distributed*"
          - "tests/**/*shard*"

"lane:crossval":
  - changed-files:
      - any-glob-to-any-file:
          - "validation/crossval/**"
          - "tests/crossval/**"

"lane:ci-infra":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/ci/**"
          - "scripts/dev/**"
          - "scripts/changelog/**"
          - "tests/contracts/**"
          - "conftest.py"
          - ".test_durations"
          - "docker/**"

"lane:examples-docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "examples/**"
          - "validation/tmtt_paper/**"
          - "gallery-deploy/**"
          - "README.md"
          - "ROADMAP.md"

# Speed and memory work: profiling, the ring-down early stop, matmul precision (TF32),
# benchmarks. Owner: the acceleration session (2026-10-01). test_matmul_precision.py is
# also under lane:ci-infra's tests/contracts/**; a PR touching it gets both labels and
# its Lane: line names the primary one.
"lane:performance":
  - changed-files:
      - any-glob-to-any-file:
          - "rfx/profiling.py"
          - "rfx/_precision.py"
          - "rfx/ringdown.py"
          - "rfx/_ringdown_jax.py"
          # Built-in waveforms and soft sources; the default pulse is acceleration's
          # (lead 2026-10-12). The TF/SF plane wave stays under lane:absorber.
          - "rfx/sources/sources.py"
          - "rfx/model/source_admission.py"
          - "rfx/model/source_coefficients.py"
          - "tests/unit/runners/test_profiling.py"
          - "tests/contracts/test_matmul_precision.py"
          - "tests/unit/sparams/test_ringdown_*.py"
          - "tests/**/*benchmark*"
          - "scripts/benchmarks/**"
          - "scripts/benchmark_*.py"
          - "scripts/diagnostics/gpu_throughput_bench.py"

"lane:conductors":
  - changed-files:
      - any-glob-to-any-file:
          # Conductor modules of the model layer (lead 2026-10-13; owner: idm).
          - "rfx/model/conductors.py"
          - "rfx/model/occupancy.py"
          - "rfx/model/thin_conductors.py"
          - "rfx/geometry/conformal.py"
          - "rfx/realized_*.py"
