name: rfx-sheen-lpf-openems-reference
description: "The Sheen low-pass filter -- regenerate its openEMS reference WITH provenance. On RT/Duroid (eps_r 2.2, h 0.794 mm) two 2.413 mm wide 50 ohm feeds are joined by one wide 20.320 x 2.540 mm low-impedance section; the wide section is a shunt capacitance, so the board passes up to about 5 GHz and then falls away into a deep stopband. That is the classic Sheen 1990 FDTD benchmark (IEEE Trans. MTT 38(7):849-857), and its committed openEMS record carries no provenance at all: no solver version, no build, no run id, no mesh statement beyond one number, and an EMPTY reproduce_gate_record while the script's own gate record still says UNRUN. STAGE A is the reproduce gate and is openEMS's OWN python/Tutorials/MSL_NotchFilter.py, verbatim, solved in the same invocation: the measured notch must land inside 0.80-1.05 x the analytic quarter-wave frequency (3.6872 GHz) AND be at least 20 dB deep. It is a DIFFERENT structure on a different substrate -- it proves the solver and the port model reproduce a published result, nothing about the Sheen board. If it fails, the job exits 1 and no Stage B record is written. STAGE B is the Sheen board on THREE meshes -- resolution factors 1.0, 1/sqrt(2) and 0.5 -- so the record carries its own mesh statement with two refinements. The factor scales the substrate's own z lines too (4, 6, 8 cells across the 794 um board, 198.5 / 132.3 / 99.25 um), because that is the direction that sets the effective permittivity and therefore where the stopband sits. The builder is copied from validation/crossval/07_sheen_lpf.py's run_openems and is proved to be that builder, character for character, by --self-check before any solver starts; the fourteen declared deltas are in the record's meta and in the stage plan. The stop criteria are the ONE thing NOT taken from that script: every real pass runs at openEMS's own library defaults (~1e9 / 1e-5), exactly as Stage A does, because the script's NrTS=30000 cap was a cost choice on one mesh and halving the cell halves the timestep -- a cap that just reached 1e-4 on the coarse board would stop the fine board mid-ring-down, which this job correctly reports as a FAILED gate for a wasted hour. The smoke pass keeps its 200 steps. The cost is that a real pass runs until the energy has decayed 50 dB rather than until a step budget runs out, and that has now been measured: the COARSE rung alone ran 107 minutes on 8 threads (VESSL 369367263243, 369367263269) while Stage A took 44 s, so the three rungs do not fit one six-hour job. Two knobs answer that, and both leave a mark in the record. RUNGS (default coarse,mid,fine) picks which rungs this job solves, so each rung can be its own job as the VESSL rule prefers; the record then carries only those rungs, names them in meta.rungs_in_this_record, and its file is openems_sheen.<rungs>.json. REAL_END_CRITERIA and REAL_NRTS (both empty by default, meaning not passed) loosen the stop criteria; every Stage B block and meta.stop_criteria_note then say what was given and carry the 107-minute measurement that motivated it. Stage A is never overridden -- it is the gate. ACCEPT_TRUNCATION (empty by default) turns a real pass that REACHES its NrTS cap from a fired gate into a recorded one, marked truncated: true with the box energy openEMS reported at the cap; a truncated spectrum is normally not a reference, so leave it empty unless a record of declared length is what is wanted. Either way the record now carries openEMS's own progress trace -- final_timestep, final_energy_db and energy_db_trace -- so how far the ring-down actually got is readable rather than inferred, and a FAILED evidence file carries the arrays the run had already produced. RECORD_LENGTH_WITNESS (also empty by default) solves every requested rung TWICE, at REAL_NRTS and twice that, and records the longer run's arrays beside the shorter run's together with the largest dB difference between them over 2-12 GHz where both curves are above -20 dB. It doubles the Stage B cost and it decides nothing: the case's own test judges the numbers. A step count is not a record length -- dt shrinks with the cell -- so when the rungs are split across jobs each needs its own N = 60000 / factor (coarse 60000, mid 84853, fine 120000) to record the same seconds, and every stage now records dt_s and record_length_s read from the solver's own banner. Every stage's stdout log, smoke and real, is copied next to the record and the record's own path fields are pointed at the copies, because /tmp goes away with the pod. Put the parts back together afterwards with --merge PART.json ... --output FULL.json, which refuses unless every part's Stage A agrees bin for bin, their tutorial source, image and openEMS build match, and their record_length_s agree within 5 %; it carries each rung's witness numbers into meta.record_length_witness. Every real pass carries the sanity gates ported from validation/crossval/20_msl_phase_referee.py: the stdout/stderr scan for unused primitives and off-mesh ports, nonzero excitation energy and non-empty port traces, |S| finite and <= 2, and passivity max(|S11|^2+|S21|^2) <= 1.05 over 2-12 GHz. 12 GHz is where the band stops because the committed record's own energy sum runs 0.78-1.00 there and falls to 0.41 by 20 GHz; the witness bounds the EXCESS above unity only, and the deficit is recorded per bin rather than judged. The deepest minimum in 5-10 GHz, the passband mean over 1-4 GHz and the -3 dB corner are REPORTED and gated on nothing. When a gate fires the record built so far goes to openems_sheen_FAILED.json before the non-zero exit, so a failed cycle still leaves numbers. The job clones the pinned commit itself into /tmp and refuses to measure anything else. Env: EXPECT (the commit, placeholder FILL_BEFORE_SUBMIT refuses). CPU lane, remilab-c0. Submit with scripts/vessl_submit.sh so the run id is recorded -- the record's run_id field is null by design, VESSL does not export the id into the pod."
tags: [rfx, crossval, sheen-lpf, openems, reference]
resources:
  cluster: remilab-c0
  cpu: 8
  memory: 16Gi
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  # OMP_NUM_THREADS=1: openEMS's own numThreads (passed explicitly as
  # --threads 8 below, matching resources.cpu=8) does the parallelism --
  # three independently-chosen numbers is how the coax lane oversubscribed.
  OMP_NUM_THREADS: "1"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  # REQUIRED. The commit this job measures. The job clones the branch itself
  # and checks this commit out; a clone whose HEAD does not start with this
  # string exits 3 rather than measuring the wrong tree. The placeholder
  # refuses too -- an unpinned run produces a record with no provenance.
  EXPECT: "FILL_BEFORE_SUBMIT"
  # The image tag this job runs, recorded into the record's meta beside the
  # openEMS build commit the image stamps into RFX_OPENEMS_COMMIT. Keep it equal
  # to `image:` above; the run block prints both.
  RFX_OPENEMS_IMAGE: "ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8"
  # Which mesh rungs THIS job solves, comma separated, from coarse,mid,fine.
  # One rung per job is the normal way to run this: with openEMS's own
  # EndCriteria the coarse rung alone ran 107 minutes on 8 threads (VESSL
  # 369367263243, 369367263269). Stage A (44 s) runs in every job -- it is the
  # reproduce gate. The record's file name carries the rungs; --merge joins them.
  RUNGS: "coarse,mid,fine"
  # Stop-criteria overrides for the REAL pass, Stage B only. EMPTY means not
  # passed at all, so openEMS's own ~1e9 / 1e-5 apply -- that is the declared
  # design (delta 9), and a record made without these says so. Set
  # REAL_END_CRITERIA to 1e-4 to stop at the repository's own ring-down level
  # (-40 dB of the post-source peak) when a rung cannot afford 1e-5.
  REAL_END_CRITERIA: ""
  REAL_NRTS: ""
  # Non-empty turns a real pass that REACHES its NrTS cap from a fired gate into
  # a recorded one (truncated: true, with the box energy openEMS reported at the
  # cap). EMPTY is the default and the declared design: a truncated spectrum is
  # normally not a reference. Measured 2026-09-22 (VESSL 369367263382): with
  # --real-end-criteria 1e-4 --real-nrts 60000 the coarse rung hit the cap in
  # about 3 minutes and the gate fired as designed. Stage A is never affected.
  ACCEPT_TRUNCATION: ""
  # Non-empty solves EVERY requested rung TWICE, at REAL_NRTS and at twice that,
  # and records the longer run's arrays and how far the two curves are apart
  # under stage_b_<rung>.witness_2n. It DOUBLES the Stage B cost. It needs
  # REAL_NRTS and ACCEPT_TRUNCATION; the maker refuses without them.
  # NOTE ON REAL_NRTS WHEN RUNS ARE SPLIT BY RUNG: a step count is not a record
  # length. dt shrinks with the cell, so to record the same seconds each rung
  # needs its own N = 60000 / factor -- coarse 60000, mid 84853, fine 120000 --
  # and --merge refuses parts whose record_length_s differ by more than 5 %.
  RECORD_LENGTH_WITNESS: ""
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== The Sheen low-pass filter: openEMS reference, with provenance ==="
  date

  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" --version
  # The image stamps the openEMS build it compiled. A record that cannot name the
  # solver build it came from is not a reference, so an unstamped image stops here
  # rather than producing one (the maker refuses too, for the same reason).
  if [ -z "${RFX_OPENEMS_COMMIT:-}" ]; then
    echo "FATAL: RFX_OPENEMS_COMMIT is empty -- this image does not stamp its openEMS build, so the record could not name the solver that produced it. Refusing to measure."
    exit 3
  fi
  echo "RFX_OPENEMS_COMMIT=$RFX_OPENEMS_COMMIT"
  echo "RFX_OPENEMS_IMAGE=${RFX_OPENEMS_IMAGE:-unset}"
  # Import probes first: if the image's bindings are not importable, fail here
  # and not forty minutes into a stage.
  "$PY" -c "from openEMS.openEMS import openEMS; print('openEMS from image: OK')"
  "$PY" -c "from CSXCAD.CSXCAD import ContinuousStructure; from openEMS.ports import MSLPort; print('CSXCAD + MSLPort: OK')"

  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }

  if [ "$EXPECT" = "FILL_BEFORE_SUBMIT" ]; then
    echo "FATAL: EXPECT still holds the FILL_BEFORE_SUBMIT placeholder -- pin the commit before submitting"
    exit 3
  fi

  SRC=/tmp/rfx-sheen-lpf-ref
  rm -rf "$SRC"
  # Clone the DEFAULT branch and fetch the pinned commit by its sha. Naming the
  # topic branch here would make the job die once that branch is merged and
  # deleted, which is exactly when someone wants to re-run the reference.
  git clone -q https://github.com/bk-squared/rfx.git "$SRC"
  git config --global --add safe.directory "$SRC" || true
  git -C "$SRC" fetch -q origin "$EXPECT"
  git -C "$SRC" checkout -q "$EXPECT"
  # Provenance capture must fail loudly: no fallback, no placeholder. A run that
  # dies here costs a relaunch; one that finishes with no commit costs the
  # evidence chain.
  sha=$(git -C "$SRC" rev-parse HEAD)
  export RFX_COMMIT="$sha"
  short=$(git -C "$SRC" rev-parse --short HEAD)
  case "$sha" in
    "$EXPECT"*) echo "provenance: $sha (matches EXPECT=$EXPECT)" ;;
    *) echo "WRONG TREE: clone HEAD is $sha, EXPECT is $EXPECT -- refusing to measure"; exit 3 ;;
  esac
  cd "$SRC"
  git status --short || true

  if ! "$PY" -c "import numpy, h5py" >/dev/null 2>&1; then
    "$PY" -m pip install -q "numpy<2" "h5py>=3.8"
  fi
  "$PY" -c "import numpy; print('numpy', numpy.__version__)"

  # What this job solves, and how it stops. An empty override is NOT passed:
  # the maker's default is the declared design, and an empty string on the
  # command line would be a parse error rather than a default.
  RUNGS_ARG=${RUNGS:-coarse,mid,fine}
  RUNG_TAG=$(echo "$RUNGS_ARG" | tr ',' '-')
  STOP_ARGS=""
  if [ -n "${REAL_END_CRITERIA:-}" ]; then
    STOP_ARGS="$STOP_ARGS --real-end-criteria $REAL_END_CRITERIA"
  fi
  if [ -n "${REAL_NRTS:-}" ]; then
    STOP_ARGS="$STOP_ARGS --real-nrts $REAL_NRTS"
  fi
  if [ -n "${ACCEPT_TRUNCATION:-}" ]; then
    STOP_ARGS="$STOP_ARGS --accept-truncation"
  fi
  if [ -n "${RECORD_LENGTH_WITNESS:-}" ]; then
    STOP_ARGS="$STOP_ARGS --record-length-witness"
  fi
  echo "rungs: $RUNGS_ARG   stop-criteria args:${STOP_ARGS:- (none -- openEMS defaults)}"

  primary=/root/workspace/byungkwan-workspace/research/rfx
  out="$primary/.omx/sheen-lpf-openems/$(date -u +%Y%m%dT%H%M%SZ)-$short"
  mkdir -p "$out"
  echo "$sha" > "$out/commit.txt"
  echo "artifacts: $out"

  # A killed, evicted or timed-out job still leaves its exit code and the
  # one-line summary. `rc` is unset until the solve runs, hence the default.
  trap 'st=$?; rc_now=${rc:-$st}; echo "$rc_now" > "$out/exit_code"; { echo "sheen_lpf_openems_reference_rc=$rc_now"; echo "commit=$sha"; echo "image=${RFX_OPENEMS_IMAGE:-unset}"; echo "openems_build=$RFX_OPENEMS_COMMIT"; echo "rungs=$RUNGS_ARG"; echo "record=$out/openems_sheen.$RUNG_TAG.json"; echo "failed_record=$out/openems_sheen.${RUNG_TAG}_FAILED.json"; ls -la "$out"; } > "$out/summary.txt" 2>&1; cat "$out/summary.txt"' EXIT INT TERM

  DRV=tests/crossval/sheen_lpf/reference/make_openems_reference.py
  test -f "$DRV" || { echo "STALE CLONE: the reference maker is missing at $DRV"; exit 3; }
  GATE=tests/crossval/_openems_tutorial_gate.py
  test -f "$GATE" || { echo "STALE CLONE: the shared tutorial gate is missing at $GATE"; exit 3; }

  # Pure-numpy checks first, seconds each: a constant, a drifted builder or a
  # layout bug must not burn a stage. `tee` returns ITS OWN status, so a failing
  # check would sail past `set -eu` and into the solve -- capture each rc the same
  # way the long step below does, in a subshell that writes it to a file.
  ( set +e; "$PY" -u "$DRV" --self-check; echo $? > "$out/self_check.rc" ) | tee "$out/self_check.log"
  sc_rc=$(cat "$out/self_check.rc")
  if [ "$sc_rc" != "0" ]; then
    echo "FATAL: --self-check exited $sc_rc -- see $out/self_check.log. Not starting the solver."
    exit 3
  fi
  ( set +e; "$PY" -u "$DRV" --dry-run --stage both --rungs "$RUNGS_ARG" $STOP_ARGS; echo $? > "$out/dry_run.rc" ) | tee "$out/stage_plan.log"
  dr_rc=$(cat "$out/dry_run.rc")
  if [ "$dr_rc" != "0" ]; then
    echo "FATAL: --dry-run exited $dr_rc -- see $out/stage_plan.log. Not starting the solver."
    exit 3
  fi

  # POSIX rc capture across a pipe. ${PIPESTATUS[0]} is a bashism and the VESSL
  # runner shell is dash/busybox-ash, so the left side of the pipe runs in a
  # subshell that writes its own rc to a file; the file is read back after.
  ( set +e
    timeout 21600 "$PY" -u "$DRV" --stage both \
      --rungs "$RUNGS_ARG" $STOP_ARGS \
      --output "$out/openems_sheen.$RUNG_TAG.json" \
      --sim-root /tmp/sheen_lpf_openems --threads 8 2>&1
    echo $? > "$out/exit_code"
  ) | tee "$out/run.log"
  rc=$(cat "$out/exit_code")
  echo "sheen_lpf_openems_reference_rc=$rc"

  # Settling positive control, as a CHECK rather than a printout. openEMS's
  # max-timesteps warning must appear in EVERY smoke pass's captured log (NrTS=200,
  # EndCriteria=0.0 -- by construction it can never converge) and in NO real pass's
  # (which must reach EndCriteria on its own, at openEMS's own ~1e9 / 1e-5
  # defaults -- Stage B does not carry the retired script's 30000-step cap, which
  # is exactly the failure this control would otherwise report). Same binary, same
  # stream; only the smoke/real split differs. If that pattern does not hold, the
  # truncation gate was not actually watching anything, and every settling
  # statement in the record is unsupported -- so the job exits 4. It does so AFTER
  # the record is written, below: evidence first, verdict second.
  # The solver's stdout is the only place the timestep, the energy trace and
  # openEMS's own warnings exist, and /tmp goes away with the pod. Copy every
  # stage's log (smoke and real; they are a few kB each) next to the record, and
  # point the record's own path fields at the copies -- a path into a pod that no
  # longer exists is not provenance. Run 369367263389: the energy-trace pattern
  # matched nothing in the real log and there was no log left to read.
  echo "===== persisting the solver logs ====="
  for d in /tmp/sheen_lpf_openems/*/; do
    [ -d "$d" ] || continue
    stage=$(basename "$d")
    src="${d}_openems_stdout.log"
    if [ -f "$src" ]; then
      case "$stage" in
        *_smoke) dest="$out/${stage%_smoke}_smoke_openems_stdout.log" ;;
        *)       dest="$out/${stage}_real_openems_stdout.log" ;;
      esac
      cp "$src" "$dest" && echo "  $src -> $dest ($(wc -c < "$dest") bytes)"
    else
      echo "  (no log at $src)"
    fi
  done
  ls -la "$out"/*_openems_stdout.log 2>/dev/null || echo "  (no solver logs were persisted)"

  # Point the record's stdout_log_path / smoke_stdout_log_path at the copies.
  # One line, no heredoc (the VESSL re-indent breaks those); it rewrites only
  # those two fields and leaves the record alone if anything is missing.
  for rec in "$out/openems_sheen.$RUNG_TAG.json" "$out/openems_sheen.${RUNG_TAG}_FAILED.json"; do
    [ -f "$rec" ] || continue
    "$PY" -c 'import json,os,sys; p,d=sys.argv[1],sys.argv[2]; a=json.load(open(p)); st=(a.get("meta") or {}).get("stages") or {}; pick=lambda n,suf: os.path.join(d,n+suf+"_openems_stdout.log"); blocks=[(n,s) for n,s in st.items() if isinstance(s,dict)]; blocks+=[((s.get("witness_2n") or {}).get("stage") or n+"_2n", s["witness_2n"]) for n,s in st.items() if isinstance(s,dict) and isinstance(s.get("witness_2n"),dict)]; [s.update({k:pick(n,suf) for k,suf in (("stdout_log_path","_real"),("smoke_stdout_log_path","_smoke")) if os.path.isfile(pick(n,suf))}) for n,s in blocks]; json.dump(a,open(p,"w"),indent=1); print("log paths rewritten in",p,"for",[n for n,_ in blocks])' "$rec" "$out" || echo "  (could not rewrite log paths in $rec)"
  done

  echo "===== settling positive control (openEMS's own max-timesteps warning) ====="
  PHRASE="reached before the end-criteria of"
  settling_rc=0
  # WHICH RULE APPLIES TO A REAL PASS DEPENDS ON WHAT THIS JOB ASKED FOR.
  # Without ACCEPT_TRUNCATION a real pass must reach its end criterion, so the
  # warning in a real log is a red. WITH it the record's length is DECLARED and
  # a real pass is meant to stop at the cap, so the warning is what proves the
  # cap was reached -- and its absence means that pass decayed early, which is
  # not wrong, only shorter than declared. Runs 369367263406/407 wrote their
  # records and then exited 4 on the old rule, which contradicted the flag they
  # were submitted with. The `_2n` witness passes are real passes and are
  # judged by the same rule. Smoke passes are unaffected either way: 200 steps
  # at EndCriteria 0.0 can never converge, so their warning is what shows the
  # phrase this control greps for is still the phrase openEMS prints.
  if [ -n "${ACCEPT_TRUNCATION:-}" ]; then
    REAL_RULE="must-carry (ACCEPT_TRUNCATION is set: a declared record length stops at the cap by design)"
    REAL_RULE_TAG="must-carry"
  else
    REAL_RULE="must-not-carry (no ACCEPT_TRUNCATION: a real pass has to reach its end criterion)"
    REAL_RULE_TAG="must-not-carry"
  fi
  echo "  rule: smoke passes must-carry; real passes $REAL_RULE"
  smoke_logs=$(find /tmp/sheen_lpf_openems -name "_openems_stdout.log" -path "*_smoke/*" 2>/dev/null || true)
  real_logs=$(find /tmp/sheen_lpf_openems -name "_openems_stdout.log" -not -path "*_smoke/*" 2>/dev/null || true)
  if [ -z "$smoke_logs" ]; then
    echo "SETTLING CONTROL: no smoke-pass log found under /tmp/sheen_lpf_openems -- the control cannot speak"
    settling_rc=4
  fi
  for f in $smoke_logs; do
    if grep -q "$PHRASE" "$f"; then
      echo "  ok   smoke   $f carries the max-timesteps warning"
    else
      echo "  RED  smoke   $f does NOT carry the max-timesteps warning -- a 200-step pass that reported convergence means the phrase this gate greps for has changed"
      settling_rc=4
    fi
  done
  for f in $real_logs; do
    if [ "$REAL_RULE_TAG" = "must-carry" ]; then
      if grep -q "$PHRASE" "$f"; then
        echo "  ok   real    $f was stopped by its declared cap, which is what --accept-truncation asked for"
      else
        case "$f" in
          */stage_a/*)
            echo "  note real    $f reached its end criterion -- EXPECTED: Stage A is the reproduce gate, it runs the tutorial at openEMS's own defaults and --accept-truncation never reaches it." ;;
          *)
            echo "  note real    $f reached its end criterion BEFORE the cap -- that record is SHORTER than declared, not wrong. Read its record_length_steps_basis and record_length_s." ;;
        esac
      fi
    else
      if grep -q "$PHRASE" "$f"; then
        echo "  RED  real    $f carries the max-timesteps warning -- that real pass was truncated"
        settling_rc=4
      else
        echo "  ok   real    $f reached its end criteria"
      fi
    fi
  done
  echo "settling_positive_control_rc=$settling_rc (real-pass rule: $REAL_RULE_TAG, smoke-pass rule: must-carry)"
  echo "$settling_rc" > "$out/settling_control.rc"
  echo "$REAL_RULE_TAG" > "$out/settling_control.real_rule"

  echo "===== record summary ====="
  if [ -f "$out/openems_sheen.${RUNG_TAG}_FAILED.json" ]; then
    echo "A GATE FIRED. Its evidence is $out/openems_sheen.${RUNG_TAG}_FAILED.json -- the arrays measured before the gate, the energy-sum numbers and failed_gate."
    "$PY" -c 'import json,sys; a=json.load(open(sys.argv[1])); print("failed_gate:", a.get("failed_gate")); [print("%-16s energy sum band max=%.4f min=%.4f | grid max=%.4f min=%.4f" % (k, a[k].get("max_energy_sum_band",float("nan")), a[k].get("min_energy_sum_band",float("nan")), a[k].get("max_energy_sum_full",float("nan")), a[k].get("min_energy_sum_full",float("nan")))) for k in ("stage_a","stage_b_coarse","stage_b_mid","stage_b_fine") if a.get(k)]' "$out/openems_sheen.${RUNG_TAG}_FAILED.json" || true
  fi
  if [ -f "$out/openems_sheen.$RUNG_TAG.json" ]; then
    "$PY" -c 'import json,sys; nan=float("nan"); a=json.load(open(sys.argv[1])); g=a["meta"].get("stage_a_gate") or {}; ms=a["meta"]["stages"]; m=lambda k: ((ms.get(k) or {}).get("mesh_realized") or {}); d=lambda k,f: (a[k].get(f) or {}); print("stage_a reproduce gate passed=%s measured=%s Hz dev=%s %%" % (g.get("passed"), g.get("measured_f_notch_hz"), g.get("deviation_pct"))); [print("%-16s %s | %s substrate cells, %s cells | energy sum: band max=%.4f min=%.4f | grid max=%.4f min=%.4f | 0-1GHz=%.4f | 1-2GHz=%.4f | above band max=%.4f min=%.4f" % (k, ("TUTORIAL notch=%.4f GHz depth=%.2f dB" % (d(k,"notch").get("refined_f_ghz",nan), d(k,"notch").get("depth_db",nan))) if k=="stage_a" else ("deepest min 5-10 GHz=%.4f GHz depth=%.2f dB | passband mean=%.3f dB | -3 dB corner=%s GHz | Re(Z0) median=%.2f ohm" % (d(k,"null").get("refined_f_ghz",nan), d(k,"null").get("depth_db",nan), d(k,"passband").get("mean_db",nan), d(k,"cutoff_3db").get("f_ghz"), a[k].get("re_z0_median_ohm",nan))), m(k).get("substrate_z_cells_realized"), m(k).get("n_cells"), a[k].get("max_energy_sum_band",nan), a[k].get("min_energy_sum_band",nan), a[k].get("max_energy_sum_full",nan), a[k].get("min_energy_sum_full",nan), d(k,"max_energy_sum_below_band").get("0_1_ghz",nan), d(k,"max_energy_sum_below_band").get("1_2_ghz",nan), a[k].get("max_energy_sum_above_band",nan), a[k].get("min_energy_sum_above_band",nan))) for k in ("stage_a","stage_b_coarse","stage_b_mid","stage_b_fine") if a.get(k)]' "$out/openems_sheen.$RUNG_TAG.json" || true
  elif [ ! -f "$out/openems_sheen.${RUNG_TAG}_FAILED.json" ]; then
    echo "(no record written at all -- the run did not reach a stage)"
  fi

  ls -la "$out"
  echo "artifacts persisted to (mounted, survives teardown): $out"
  echo "run_id is NOT in the record: VESSL does not export it into the pod, the submitter writes it"

  # Evidence first: the record and the summary above are already written. Only now
  # does the settling control get to change the verdict.
  if [ "$rc" = "0" ] && [ "$settling_rc" != "0" ]; then
    echo "SETTLING POSITIVE CONTROL FAILED: the stages ran and the record was written, but the control above did not hold, so no settling statement in it is supported."
    rc=4
  fi

  echo "=== verdict ==="
  case "$rc" in
    0) echo "PASS: the reproduce gate passed and the requested rungs ($RUNGS_ARG) were written. Join the per-rung parts with --merge before the case reads them. Read the stage plan's PML / measurement-plane / feed-edge lines before quoting a Stage B number, and read the energy-sum deficit before quoting a magnitude." ;;
    1) echo "GATE FAILED: the reproduce gate or a sanity gate failed -- the log names which. No number from this run is usable." ;;
    2) echo "openEMS NOT IMPORTABLE despite the image probes passing -- investigate the bindings" ;;
    3) echo "CONFIG ERROR: a missing solver stamp, a failed self-check or dry run, a drifted builder, or a layout bug in the maker -- not a physics finding" ;;
    4) echo "SETTLING POSITIVE CONTROL FAILED: read $out/settling_control.rc and the per-log lines above. The record exists; its settling statements do not stand up." ;;
    124) echo "TIMEOUT: the 21600 s budget was exhausted -- report the wall clock, do NOT shorten the record to fit" ;;
    *) echo "ERROR: unexpected exit code $rc" ;;
  esac
  exit "$rc"
