name: rfx-coax-two-port-referee-mesh-refinement
description: "#489 active dev track leg 1: mesh-refinement convergence witness for the coax two-port openEMS referee's own measured/analytic beta ratio (~1.12x on the committed dx=0.37474mm mesh). Runs the SAME referee script (validation/crossval/21_coax_two_port_referee.py) at --dx-scale 0.666667 (1.5x refinement, annulus 3.79 -> ~5.68 cells) -- see MESH_REFINEMENT_PREDECLARATION in that script for the pre-declared ONE-SIDED gate (refutes only ratio > 1.11) and the runtime arithmetic (~2.41h estimated from run-3's own 2796s baseline, corrected N3 review fix -- spatial cell ratio 2.0723 x timestep ratio 1.5, NOT refinement_factor^4). SHA-PINNED TARBALL FETCH (mechanism changed 2026-08-04 after runs 369367251836/369367251837 both died at apt-get-install-git on an unreachable Ubuntu mirror -- this image ships neither git nor a working apt path to it reliably; the original branch-clone+git-checkout pattern, mirroring #530/#515's scripts/vessl_msl_ad_band_mean_owner_measurement.yaml, is preserved in spirit but fetches https://github.com/bk-squared/rfx/archive/$RFX_EXPECT_SHA.tar.gz via curl/wget/python3 instead of git -- the tarball URL IS the pin) -- this job fetches RFX_EXPECT_SHA fresh; it does NOT use the mounted primary checkout, which stays on main until this branch merges. Comparator-leg only -- brackets, does not judge rfx's own compute_coaxial_two_port numbers."
tags: [rfx, coax-two-port, i489, external-referee, mesh-refinement]
resources:
  cluster: remilab-c0
  cpu: 16
  memory: 48Gi
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  # OMP_NUM_THREADS=1: openEMS's own --threads/numThreads (passed explicitly
  # below, matching resources.cpu=16) does the parallelism -- same rationale
  # as scripts/vessl_coax_two_port_referee.yaml.
  OMP_NUM_THREADS: "1"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  # RFX_BRANCH is INFORMATIONAL ONLY (review nit): the fetch below is a
  # tarball keyed purely by RFX_EXPECT_SHA (the actual pin) -- this var is
  # not used to select what gets fetched, only echoed for a human reader's
  # provenance context (which branch's history this SHA came from).
  RFX_BRANCH: "feat/489-active-dev-legs-1-3"
  RFX_EXPECT_SHA: "865974280e7c779b9273bb7e8d115d950e93b42e"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  # image ships git + openEMS already (docker/openems-lane/Dockerfile); dash shell (no bashisms).
  echo "=== rfx #489 leg 1: coax two-port referee mesh-refinement witness ==="
  date

  # MECHANISM CHANGE (2026-08-04, two prior submissions failed the SAME
  # way at this exact step: VESSL runs 369367251836 and 369367251837, both
  # dead within ~3 minutes at "apt-get update" -- "W: Failed to fetch
  # http://archive.ubuntu.com/... Connection failed" then "E: Unable to
  # correct problems, you have held broken packages" installing git. This
  # image genuinely has no git preinstalled (vessl-jobs.md's own
  # documented gotcha), and the Ubuntu archive mirror was unreachable from
  # this cluster both times -- zero real work ran either attempt. Rather
  # than retry the identical apt+git mechanism a third time, fetch the
  # pinned commit as a GitHub tarball instead: needs only curl/wget/
  # python3 (all present in this image already), no apt-get, no git. The
  # tarball URL is itself keyed by RFX_EXPECT_SHA, so it IS the pin --
  # curl -f fails loud (nonzero exit, caught by set -eu) on a bad SHA or a
  # network error, same as the old checkout-mismatch guard did.
  echo "=== fetch RFX_EXPECT_SHA as a tarball (apt+git mechanism dropped after 2 network failures: runs 369367251836, 369367251837) ==="
  # N5 (review fix): the tarball URL is itself keyed by RFX_EXPECT_SHA, so an
  # unfilled placeholder would 404 anyway -- but that is an OPAQUE curl
  # failure, not a diagnosable message. Keep an explicit escape-hatch guard
  # (same intent as the old branch-clone pattern's FILL_AFTER_PUSH check) and
  # make it a HARD, LOUD abort rather than relying on an incidental 404.
  if [ "$RFX_EXPECT_SHA" = "FILL_AFTER_PUSH" ]; then
    echo "FATAL: RFX_EXPECT_SHA still contains the FILL_AFTER_PUSH placeholder -- fill in the real commit SHA before submitting this job"
    exit 3
  fi
  RFX_TARBALL_URL="https://github.com/bk-squared/rfx/archive/${RFX_EXPECT_SHA}.tar.gz"
  RFX_TARBALL_PATH="/tmp/rfx-${RFX_EXPECT_SHA}.tar.gz"
  if command -v curl >/dev/null 2>&1; then
    curl -fsSL -o "$RFX_TARBALL_PATH" "$RFX_TARBALL_URL"
  elif command -v wget >/dev/null 2>&1; then
    wget -q -O "$RFX_TARBALL_PATH" "$RFX_TARBALL_URL"
  else
    python3 -c "import urllib.request; urllib.request.urlretrieve('$RFX_TARBALL_URL', '$RFX_TARBALL_PATH')"
  fi
  test -s "$RFX_TARBALL_PATH" || { echo "FATAL: tarball fetch produced an empty/missing file"; exit 3; }

  CLONE_DIR=/tmp/rfx-clone
  rm -rf "$CLONE_DIR"
  mkdir -p "$CLONE_DIR"
  tar xzf "$RFX_TARBALL_PATH" -C "$CLONE_DIR" --strip-components=1
  cd "$CLONE_DIR" || exit 1
  ACTUAL_SHA="$RFX_EXPECT_SHA"
  echo "fetched branch (tarball snapshot) : $RFX_BRANCH"
  echo "pinned SHA (== fetch URL)         : $ACTUAL_SHA"
  ls validation/crossval/21_coax_two_port_referee.py >/dev/null || {
    echo "FATAL: expected file missing after tarball extraction -- extraction or pin is broken"
    exit 3
  }

  # -- SOLVER ENVIRONMENT NOW COMES FROM THE IMAGE (image: swap, 5b423bdfe0c8):
  # this lane used to sed in a Korean apt mirror (mirror.kakao.com,
  # ForceIPv4, 5 retries -- the R1/R2/R3 fixes above chronicle three
  # mechanism changes chasing a time-varying archive.ubuntu.com outage)
  # and source-build openEMS-Project on every run (~30-60 min, on top of
  # the 4 provisioning attempts that outage killed on 2026-08-04). That
  # whole block -- the mirror sed, both apt-get calls, the openEMS-Project
  # git clone, the PROVISION_SMOKE early-exit, and the fparser/CSXCAD/
  # openEMS cmake+make+install steps -- is gone. The image
  # (docker/openems-lane/Dockerfile, built by
  # .github/workflows/build-openems-image.yml, published to
  # ghcr.io/bk-squared/rfx-openems) already contains openEMS-Project
  # (pinned to the Dockerfile's OPENEMS_COMMIT) built and its python
  # bindings installed against the image's conda python, via plain
  # archive.ubuntu.com on a GitHub Actions runner with healthy network --
  # no mirror workaround needed there. This lane's own RFX_EXPECT_SHA
  # tarball fetch above is UNCHANGED (that fetches rfx, not openEMS).
  # ONE-LINE REVERT: `git show <this-commit>^:scripts/vessl_coax_two_port_referee_mesh_refinement.yaml
  # > scripts/vessl_coax_two_port_referee_mesh_refinement.yaml` restores
  # the apt+build block, PROVISION_SMOKE, and the
  # pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime image line in one shot.
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" --version
  echo "RFX_OPENEMS_COMMIT=${RFX_OPENEMS_COMMIT:-unset(pre-stamp image)}"
  "$PY" -c "from openEMS.openEMS import openEMS; print('openEMS from image: OK')"

  cd "$CLONE_DIR" || exit 1
  OUT_DIR="/root/workspace/byungkwan-workspace/research/rfx/.omx/coax-two-port-referee-mesh-refinement/$(date -u +%Y%m%dT%H%M%SZ)-${ACTUAL_SHA}"
  mkdir -p "$OUT_DIR"

  # -- The predeclared 1.5x refinement (dx_scale=2/3): --nrts/--end-criteria
  # match the promoted run-3's own Stage B settings (only the mesh density
  # changes; the predeclaration's runtime arithmetic assumes this). Timeout
  # generous over the ~2.41h estimate (MESH_REFINEMENT_PREDECLARATION,
  # estimated_runtime_h -- N3 review fix, corrected from a first-draft
  # 3.93h that used the wrong refinement_factor^4 scaling) for build +
  # smoke-run overhead on top of the two real Stage B drives. --
  # SETTLING-FLAG DISCLOSURE fix (review, 2026-08-05, run 369367251845):
  # that run's raw per-drive openEMS stdout (_openems_stdout.log, written
  # by _run_openems_capturing_stdout under --sim-root) did NOT survive --
  # the script's own --sim-root CLI default (/tmp/openems_coax_two_port_
  # referee) is the VESSL pod's EPHEMERAL container filesystem, never
  # part of the mounted volume, so the file was never written anywhere
  # persistent in the first place (not lost after being written). Passing
  # --sim-root under the mounted $OUT_DIR here makes every future run's
  # raw per-drive/per-stage stdout (the auditable source of the
  # end_criteria_not_reached flag and any mesh/port-parse warnings)
  # persist automatically, alongside run.log and the result JSON.
  SIM_ROOT="$OUT_DIR/sim_root"
  mkdir -p "$SIM_ROOT"
  set +e
  timeout 25200 "$PY" validation/crossval/21_coax_two_port_referee.py \
    --output "$OUT_DIR/openems_coax_two_port_mesh_refinement.json" \
    --sim-root "$SIM_ROOT" \
    --threads 16 \
    --dx-scale 0.6666666666666666 \
    > "$OUT_DIR/run.log" 2>&1
  rc=$?
  set -e
  echo "$rc" > "$OUT_DIR/exit_code"
  tail -n 100 "$OUT_DIR/run.log" || true
  echo "coax_two_port_referee_mesh_refinement_rc=$rc"
  echo "artifacts persisted to (mounted, survives job teardown): $OUT_DIR"

  echo "=== verdict ==="
  case "$rc" in
    0) echo "PASS: reproduce-gate + Stage B self-checks both passed at the refined mesh -- see JSON's stage_b.beta_ratio_measured_over_analytic_mean against MESH_REFINEMENT_PREDECLARATION.acceptance_band_ratio" ;;
    1) echo "SELF-CHECK FAILED at the refined mesh -- inspect $OUT_DIR/run.log AND stage_b_partial in the JSON (if present) before concluding anything about the mesh-refinement question" ;;
    2) echo "UNEXPECTED: script reports openEMS missing despite the image's import check above succeeding" ;;
    3) echo "CONFIG ERROR: an internal layout/geometry assertion failed at this dx_scale -- script bug or a clearance violated at the finer mesh, NOT itself the mesh-refinement physics answer" ;;
    *) echo "ERROR: unexpected exit code $rc" ;;
  esac
  exit "$rc"
