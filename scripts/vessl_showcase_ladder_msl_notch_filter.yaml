name: rfx-showcase-ladder-msl-notch-filter
description: "Issue 1332: the verdict behind the MSL open-stub notch filter forward curves, at the showcase commit. The case's gpu-marked mesh-ladder test runs unchanged (pytest tests/crossval/msl_notch_filter -m gpu), as scripts/vessl_msl_notch_ladder.yaml runs it, pointed at the pinned commit in RFX_GPU_SUITE_REF and exported with git archive. Added here: pytest-timeout on the test and a trap that writes summary.txt. The figure, the pytest log and its exit code go to research/rfx/.omx/showcase/ladder_msl_notch_filter/<UTC>-<sha>/. Submit with scripts/vessl_submit.sh (it writes run_id.txt)."
tags: [rfx, showcase, issue-1332, crossval, ladder]
resources:
  cluster: remilab-c0
  preset: gpu-24gb
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  MPLBACKEND: "Agg"
  RFX_GPU_SUITE_REF: "b46a8220775b67f8720fb13c3e256c01cf7d6883"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  # POSIX sh only: no arrays, no [[ ]], no pipefail, no heredocs.
  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }
  primary=/root/workspace/byungkwan-workspace/research/rfx
  cd "$primary"
  git config --global --add safe.directory "$primary"
  test "$RFX_GPU_SUITE_REF" != "FILL_BEFORE_SUBMIT"
  git fetch -q origin
  sha=$(git rev-parse "$RFX_GPU_SUITE_REF^{commit}")
  short=$(echo "$sha" | cut -c1-8)
  echo "suite ref: $RFX_GPU_SUITE_REF = $sha"
  src="/tmp/rfx-showcase-ladder-$short"
  rm -rf "$src" && mkdir -p "$src"
  git archive --format=tar "$sha" | tar -xf - -C "$src"
  out="$primary/.omx/showcase/ladder_msl_notch_filter/$(date -u +%Y%m%dT%H%M%SZ)-$short"
  mkdir -p "$out"
  echo "$sha" > "$out/commit.txt"
  trap 'st=$?; { echo "exit=$st"; echo "commit=$sha"; for f in "$out"/*.rc; do [ -f "$f" ] && echo "$(basename "$f")=$(cat "$f")"; done; grep -E "passed|failed|xfailed|skipped|error" "$out/ladder.log" | tail -3; ls -la "$out"; } > "$out/summary.txt" 2>&1; cat "$out/summary.txt"' EXIT INT TERM
  python -m pip install -q "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7" pytest pytest-timeout
  python -m pip install -q "jax[cuda12]==0.6.2"
  python -c "import jax; assert jax.__version__ == '0.6.2', jax.__version__"
  export RFX_REPO_ROOT="$src"
  export PYTHONPATH="$RFX_REPO_ROOT:${PYTHONPATH:-}"
  cd "$src"
  python -c "import jax, rfx; print('probe ok | jax', jax.__version__, '| devices', jax.devices(), '| rfx', rfx.__version__)" > "$out/probe.txt" 2>&1
  cat "$out/probe.txt"
  nvidia-smi > "$out/nvidia_smi.txt" 2>&1 || true
  export RFX_CROSSVAL_FIG_DIR="$out"
  echo "=== collect ==="
  python -m pytest tests/crossval/msl_notch_filter -m gpu --collect-only -q -p no:cacheprovider > "$out/collect.txt" 2>&1
  cat "$out/collect.txt"
  grep -q "^1/.* tests collected" "$out/collect.txt"
  echo "=== run ==="
  # pytest's status comes out of the brace group; $? after "| tee" is tee's.
  set +e
  { timeout 10800 python -m pytest tests/crossval/msl_notch_filter -m gpu -s -q -ra -p no:cacheprovider --timeout=10000 --timeout-method=thread 2>&1; echo "$?" > "$out/ladder.rc"; } | tee "$out/ladder.log"
  set -e
  rc=$(cat "$out/ladder.rc")
  echo "ladder_rc=$rc"
  echo "artifacts: $out"
  exit "$rc"
