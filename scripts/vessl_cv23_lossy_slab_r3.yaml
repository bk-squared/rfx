name: rfx-cv23-lossy-slab-r3
description: "cv23 lossy slab, ROUND 3 (final) -- pre-declared in docs/design_notes/20260902_cv23_lossy_slab_predeclaration.md section 13 before this run. Resolution, not tolerance: tand3 at dx/2 (predicted mean |dR| 0.0031 vs 0.0102), tand0p1 / tand1 at dx; Meep primaries tand0p1 at 80 px/cm (0.0078 vs 0.010, one rung under, stated), tand1 / tand3 at 40; the exact Yee-lattice solution carried as a reported witness (|rfx - lattice| <= 3e-4). Full clean set: three primaries, 9 rfx falsifiers at the same recipes (each must exit 1), Meep primaries + both wrong-scaling falsifiers, the 10/20/40/80 ladders, the three thickness legs (thin1 re-run, thin_half predicted mirrored 0.0156, centre-shift +0.5 px predicted 0.00025), the rfx dx ladder as evidence, ladder summary, gate test (must be green). No window moves. Exit 0 iff baseline 0 / falsifiers 1 / gate 0 / Meep legs 0. Submit: vessl run create -f scripts/vessl_cv23_lossy_slab_r3.yaml"
tags: [rfx, crossval, cv23, lossy, conductivity, meep, gap-lane-2, round-3]
resources:
  cluster: remilab-c0
  cpu: 16
  memory: 24Gi
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: cpu
  RFX_CHECKOUT_NFS: /root/workspace/claude-workspace/rfx/checkouts/gap2-lossy-slab
  RFX_RUNS_ROOT: /root/workspace/claude-workspace/rfx/runs
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eux
  echo "=== rfx cv23 lossy slab ROUND 3 (final; section 13 recipes) ==="
  date
  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  OUT="$RFX_RUNS_ROOT/cv23-lossy-r3-$STAMP"
  mkdir -p "$OUT"
  echo "$OUT" > "$RFX_RUNS_ROOT/cv23-lossy-r3-LATEST"
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT

  # -- 1. stage the checkout (NFS is read-only for the pod) --
  test -d "$RFX_CHECKOUT_NFS" || { echo "ERROR: checkout missing at $RFX_CHECKOUT_NFS"; exit 3; }
  WORK=/tmp/rfx-cv23
  rm -rf "$WORK"; mkdir -p "$WORK"
  cp -a "$RFX_CHECKOUT_NFS/." "$WORK/"
  cd "$WORK"
  git config --global --add safe.directory "$WORK" || true
  # Provenance (cv22 review finding 6): the NFS checkout is an rsync without
  # .git; the orchestrator writes the source commit to .staged_commit at
  # staging time and the case script reads it first.
  if [ -s "$WORK/.staged_commit" ]; then
    cat "$WORK/.staged_commit" > "$OUT/commit.txt"
  else
    git rev-parse HEAD > "$OUT/commit.txt" 2>/dev/null || echo unknown > "$OUT/commit.txt"
  fi
  echo "commit: $(cat "$OUT/commit.txt")"
  RES="$WORK/validation/crossval/_23_lossy_results"
  mkdir -p "$RES"

  # -- 2. rfx environment --
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" -m pip install -q "jax[cpu]==0.6.2" "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7" "pytest>=7"
  export RFX_REPO_ROOT="$WORK"
  export PYTHONPATH="$WORK"
  "$PY" -c "import jax, rfx; print('rfx probe ok', jax.__version__)"

  # -- 3. Meep environment (conda-forge pymeep, separate env) --
  CONDA=/opt/conda/bin/conda
  if [ ! -x "$CONDA" ]; then
    curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o /tmp/miniconda.sh
    sh /tmp/miniconda.sh -b -p /opt/miniconda-cv23
    CONDA=/opt/miniconda-cv23/bin/conda
  fi
  "$CONDA" create -y -q -n cv23meep --override-channels -c conda-forge python=3.11 pymeep numpy scipy
  MEEP_PY="$(dirname "$CONDA")/../envs/cv23meep/bin/python"
  test -x "$MEEP_PY" || MEEP_PY="$("$CONDA" run -n cv23meep which python)"
  "$MEEP_PY" -c "import meep, numpy; print('meep', meep.__version__, 'numpy', numpy.__version__)"
  MEEP="$MEEP_PY scripts/crossval/meep_cv23_lossy_slab.py"

  run_meep() {  # name, then args
    NAME=$1; shift
    set +e
    $MEEP "$@" --out-dir "$RES" > "$OUT/meep_$NAME.log" 2>&1
    rc=$?
    set -e
    echo "$rc" > "$OUT/meep_$NAME.rc"; tail -n 6 "$OUT/meep_$NAME.log" || true
    echo "meep_${NAME}_rc=$rc"
  }
  run_rfx() {  # name, then args
    NAME=$1; shift
    set +e
    "$PY" validation/crossval/23_lossy_slab_fresnel.py "$@" --out-dir "$RES" > "$OUT/rfx_$NAME.log" 2>&1
    rc=$?
    set -e
    echo "$rc" > "$OUT/rfx_$NAME.rc"; grep -E "^\[|  record|  E2:|  E2 gates|  E4|FDTD|artifact|PASSED|FAIL|SKIP" "$OUT/rfx_$NAME.log" | tail -n 18 || true
    echo "rfx_${NAME}_rc=$rc"
  }

  # -- 4. Meep PRIMARY legs at the per-arm declared resolution (section 13: tand0p1 80 px/cm,
  #       tand1 / tand3 40 px/cm -- the leg's default), and the two wrong-scaling falsifiers on
  #       tand1 at its primary resolution (pre-check recorded failed) --
  for ARM in tand0p1 tand1 tand3; do
    run_meep $ARM --arm "$ARM"
  done
  run_meep tand1__falsifier_sigma_2pi --arm tand1 --falsifier sigma_2pi
  run_meep tand1__falsifier_sigma_no_eps --arm tand1 --falsifier sigma_no_eps

  # -- 5. Meep ladder (10/20/40 px/cm on all three arms) + the section-12 discriminators:
  #       80 px/cm for tand0p1 (thickness-excess prediction 0.0078) and tand3 (lattice 0.0002),
  #       and tand0p1 at 40 px/cm with the block one Meep cell thinner (prediction 0.0003) --
  for ARM in tand0p1 tand1 tand3; do
    for R in 10 20 40; do
      run_meep ${ARM}__res$R --arm "$ARM" --resolution $R --tag res$R
    done
  done
  run_meep tand0p1__res80 --arm tand0p1 --resolution 80 --tag res80
  run_meep tand3__res80 --arm tand3 --resolution 80 --tag res80
  # section 13.2: the three thickness legs (thin1 = the r2 mirrored result, re-run as evidence;
  # thin_half predicted mirrored 0.0156; the centre shift +0.5 px predicted 0.00025, the decisive one)
  run_meep tand0p1__res40_thin1 --arm tand0p1 --resolution 40 --thickness-offset-cells -1 --tag res40_thin1
  run_meep tand0p1__res40_thin_half --arm tand0p1 --resolution 40 --thickness-offset-cells -0.5 --tag res40_thin_half
  run_meep tand0p1__res40_shift_half --arm tand0p1 --resolution 40 --center-offset-cells 0.5 --tag res40_shift_half
  ls -la "$RES"

  # -- 6. rfx baseline at the per-arm recipes (section 13: tand3 at dx/2; expect 0), the nine
  #       falsifiers at the same recipes (each must exit 1), then the dx ladder re-run as committed
  #       evidence (diagnostic arms: rc 0/1/2 admissible; they read the per-arm Meep primary) --
  run_rfx baseline
  base_rc=$(cat "$OUT/rfx_baseline.rc")
  ladder_fail=0
  for ARM in tand3 tand1 tand0p1; do
    for K in 2 4; do
      run_rfx ${ARM}_dx$K --arms "$ARM" --dx-div $K --tag ${ARM}_dx$K --no-plots
      rc=$(cat "$OUT/rfx_${ARM}_dx$K.rc")
      case "$rc" in 0|1|2) ;; *) echo "ERROR: dx ladder arm ${ARM}_dx$K exited $rc"; ladder_fail=1;; esac
    done
  done
  fals_fail=0
  for F in tand0p1_sigma_x1p5 tand0p1_sigma_zero tand1_sigma_x1p5 tand1_sigma_zero tand3_sigma_x1p5 tand3_sigma_zero tand0p1_sigma_neg meep_tand1_sigma_2pi meep_tand1_sigma_no_eps; do
    run_rfx falsifier_$F --falsifier "$F" --no-plots
    rc=$(cat "$OUT/rfx_falsifier_$F.rc")
    [ "$rc" -eq 1 ] || { echo "ERROR: falsifier $F exited $rc, expected 1"; fals_fail=1; }
  done

  # -- 7. ladder summary incl. the 80 px/cm rung (no FDTD); the full gate test (MUST be green:
  #       baseline replay at the per-arm recipes, lattice witness, E4 at the per-arm Meep
  #       resolutions, every falsifier, the discriminator readings) --
  "$PY" validation/crossval/23_lossy_slab_fresnel.py --meep-ladder-summary --out-dir "$RES" | tee "$OUT/meep_ladder_summary.log"
  set +e
  "$PY" -m pytest -q tests/test_cv23_lossy_slab_gates.py tests/test_cv23_lossy_eps_mapping.py -rs -s \
    > "$OUT/pytest_gates.log" 2>&1
  gate_rc=$?
  "$PY" -m pytest -q tests/test_cv23_lossy_slab_gates.py -k r2 -rs -s > "$OUT/pytest_r2.log" 2>&1
  r2_rc=$?
  set -e
  echo "$gate_rc" > "$OUT/pytest_gates.rc"; echo "$r2_rc" > "$OUT/pytest_r2.rc"
  grep -E "cv23-summary|r2-summary|passed|failed|SKIPPED|Error" "$OUT/pytest_gates.log" | tail -n 60 || true
  echo "gate_test_rc=$gate_rc r2_structural_rc=$r2_rc"

  # -- 8. hand back, readable --
  cp -r --no-preserve=ownership,mode "$RES" "$OUT/_23_lossy_results"
  cp "$OUT/rfx_baseline.log" "$OUT/_23_lossy_results/r3_rfx_baseline.log" || true
  cp "$OUT/commit.txt" "$OUT/_23_lossy_results/r3_commit.txt" || true
  chmod -R a+rX "$OUT"
  echo "=== verdict ==="
  echo "baseline_rc=$base_rc falsifiers_all_exit_1=$([ "$fals_fail" -eq 0 ] && echo yes || echo NO) dx_ladder_ok=$([ "$ladder_fail" -eq 0 ] && echo yes || echo NO) gate_test_rc=$gate_rc r2_structural_rc=$r2_rc"
  echo "artifacts: $OUT/_23_lossy_results  (commit into validation/crossval/_23_lossy_results/ and fill artifact_paths)"
  for f in "$OUT"/meep_*.rc; do
    rc=$(cat "$f"); case "$rc" in 0) ;; *) echo "NOTE: $(basename "$f") = $rc";; esac
  done
  fail=0
  [ "$base_rc" -eq 0 ] || { echo "ERROR: baseline exit $base_rc"; fail=1; }
  [ "$fals_fail" -eq 0 ] || fail=1
  [ "$ladder_fail" -eq 0 ] || fail=1
  [ "$gate_rc" -eq 0 ] || { echo "ERROR: gate test exit $gate_rc"; fail=1; }
  for T in tand0p1__res80 tand3__res80 tand0p1__res40_thin1 tand0p1__res40_thin_half tand0p1__res40_shift_half; do
    [ "$(cat "$OUT/meep_$T.rc")" -eq 0 ] || { echo "ERROR: Meep discriminator leg $T failed"; fail=1; }
  done
  for ARM in tand0p1 tand1 tand3; do
    [ "$(cat "$OUT/meep_$ARM.rc")" -eq 0 ] || { echo "ERROR: Meep primary leg $ARM failed"; fail=1; }
  done
  exit "$fail"
