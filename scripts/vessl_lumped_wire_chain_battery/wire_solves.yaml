name: rfx-lw-battery-wire-solves
description: "Lumped/wire chain battery: every wire-port DUT at every rung, each with its doubled-record witness. CPU only."
tags: [rfx, chain-closure, lumped-wire-battery]
resources:
  cluster: remilab-c0
  preset: cpu-32-mem-64
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
  MPLBACKEND: "Agg"
  RFX_SHA: "f6114cf2ec53954e8d47154226f7f42e9ea17953"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }
  SRC=/root/workspace/byungkwan-workspace/research/rfx-wt-lumped-battery
  git config --global --add safe.directory "$SRC"
  git config --global --add safe.directory "$(git -C "$SRC" rev-parse --absolute-git-dir)"
  SHA=$(git -C "$SRC" rev-parse HEAD)
  test "$SHA" = "$RFX_SHA" || { echo "FATAL: worktree moved: $SHA"; exit 3; }
  test -z "$(git -C "$SRC" status --porcelain)" || { echo "FATAL: dirty worktree"; exit 3; }
  RUNS=/root/workspace/claude-workspace/rfx/runs
  OUT=$RUNS/lw-wire-solves-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT/stages"
  echo "$SHA" > "$OUT/commit.txt"
  echo "$OUT" > "$RUNS/lw-wire-solves.latest"
  LOG="$OUT/run.log"
  trap 'rc=$?; echo "$rc" > "$OUT/job.rc"; cp -f /root/work/lw-wire-solves/out.log "$LOG" 2>/dev/null || true; chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  WORK=/root/work/lw-wire-solves
  rm -rf "$WORK"; mkdir -p "$WORK"
  # tar rather than `cp -a`, excluding the caches: a pytest run in the
  # source worktree rewrites .pyc files while the copy is in flight, and
  # cp then exits non-zero ("replaced while being copied"), which under
  # `set -e` kills the job before a single solve. Measured on run
  # 369367262712, which died three seconds in for exactly that reason.
  ( cd "$SRC" && tar -cf - --exclude=__pycache__ --exclude=.pytest_cache . ) \
    | ( cd "$WORK" && tar -xf - )
  cd "$WORK"
  "$PY" -m pip uninstall -y -q jax-cuda12-plugin jax-cuda12-pjrt 2>/dev/null || true
  "$PY" -m pip install -q "jax[cpu]==0.6.2" "numpy>=2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7" pytest pytest-split optax
  export PYTHONPATH="$WORK"
  git config --global --add safe.directory "*"
  "$PY" -c "import rfx, os; print('rfx from', os.path.dirname(rfx.__file__))"
  { timeout 20000 "$PY" scripts/diagnostics/lumped_wire_chain_battery_measure.py --stage solve --kind wire --all-duts --all-rungs --out "$OUT/stages" --run-id "$OUT" ; echo "rc=$?"; } 2>&1 | tee "$WORK/out.log" | tail -60
  echo BATTERY_STAGE_DONE
