name: rfx-nu-cost-ablation-g1b
description: "NU cost-reduction lane G1b: re-declared kernel ablation on RTX 4090 (validation/research/nu_cost/w8_nu_kernel_ablation.py --suite g1b -- part A cpml8 300^3/400^3: nu-z, nu-z-scalar-inv, nu-z-combo, nu-z-foldinv (epsilon gate), nu-z-inv3d, each vs nu-z; part B CPML-layer ladder 0/4/8/16 at 300^3: bare-slow (fused path forced off) and nu-uniform, plus bare fused at 0 layers; in-process identity/epsilon checks before timing; plan section 'G1b -- pre-declared'). Launch from OUTSIDE any git worktree: vessl run create -f scripts/vessl_nu_cost_ablation_g1b.yaml --project byungkwan. Code staged by rsync to claude-workspace/rfx/checkouts/nu-cost (.staged-commit records the sha). Harvest: ~/Documents/vessl-run-logs/harvest.sh RUN_ID rfx-nu-cost-ablation-g1b"
tags: [rfx, nu-cost, gpu-throughput, ablation, gpu]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -euo pipefail
  SRC=/root/workspace/claude-workspace/rfx/checkouts/nu-cost
  STAMP="$(date -u +%Y%m%dT%H%M%SZ)-$(cat "$SRC/.staged-commit" 2>/dev/null | cut -c1-8 || echo unknown)"
  OUT=/root/workspace/claude-workspace/rfx/runs/nu-cost-ablation-g1b/$STAMP
  mkdir -p "$OUT"
  cd "$SRC"
  echo "=== NU cost lane: G1b re-declared kernel ablation (W8, --suite g1b) ==="
  date
  python -m pip install -q "scipy>=1.11"
  export PYTHONPATH="$SRC:${PYTHONPATH:-}"
  echo "staged commit: $(cat "$SRC/.staged-commit" 2>/dev/null || echo unknown)"
  python -c "import jax, rfx; print('backend', jax.default_backend(), jax.devices(), '| rfx', rfx.__file__)"
  nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv || true
  # The rsync-staged checkout is not writable by the container, so run a
  # COPY of the instrument from $OUT and let it write its JSON there. The
  # copy carries the staged sha via .staged-commit next to it.
  cp validation/research/nu_cost/w8_nu_kernel_ablation.py "$OUT/w8_nu_kernel_ablation.py"
  cat "$SRC/.staged-commit" > "$OUT/.staged-commit" 2>/dev/null || true
  python "$OUT/w8_nu_kernel_ablation.py" --suite g1b --out "$OUT/w8_nu_kernel_ablation_g1b_results.json" 2>&1 | tee "$OUT/w8_nu_kernel_ablation_g1b.log"
  cat "$SRC/.staged-commit" > "$OUT/staged-commit" 2>/dev/null || true
  echo "artifacts: $OUT"
  echo "=== DONE ==="
  date
