name: rfx-931-post-cv05
description: "cv05 patch antenna, the group's migrated case: ground and patch are declared PEC sheets on the substrate floor and top node planes, the six-cell fine substrate block is preserved, the port spans realized wall to realized wall. Runs the build-only realization assertion first, then all three parts with the image's openEMS, then rebuilds the ring-down fixture (which now re-measures its realized-extent census). POST-change arm of the #931 lattice ownership contract, group X-A. Reads the branch worktree /root/workspace/byungkwan-workspace/research/rfx-931-XA-crossval-a (feat/931-crossval-a) IN PLACE over the NFS mount, so the checkout the job runs is the one on the branch. Pairs with the pre-change baseline job rfx-931-base-cv05. Submit: vessl run create -f cv05.yaml"
tags: [rfx, issue-931, post, cv05, crossval-a]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== rfx #931 POST-change: cv05 (branch feat/931-crossval-a) ==="
  date
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  WORK=/root/workspace/byungkwan-workspace/research/rfx-931-XA-crossval-a
  test -d "$WORK" || { echo "ERROR: branch worktree missing at $WORK"; exit 3; }
  RUNS=/root/workspace/claude-workspace/rfx/runs
  OUT=$RUNS/issue931-post-cv05-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > "$RUNS/issue931-post-cv05.latest"
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  # git may be absent from the image and an NFS worktree is "dubious ownership"
  # to a modern git; neither is fatal to the run, so every git call is guarded.
  # HAVE_GIT decides whether the artifact-diff control below can be trusted.
  HAVE_GIT=0
  if command -v git >/dev/null 2>&1; then
    git config --global --add safe.directory '*' >/dev/null 2>&1 || true
    if git -C "$WORK" rev-parse --git-dir >/dev/null 2>&1; then HAVE_GIT=1; fi
  fi
  echo "HAVE_GIT=$HAVE_GIT" | tee "$OUT/have_git.txt"
  if [ "$HAVE_GIT" -eq 1 ]; then
    git -C "$WORK" log --oneline -1 | tee "$OUT/commit.txt"
    git -C "$WORK" status --porcelain | tee "$OUT/worktree_status_before.txt"
  else
    echo "git unavailable in image; commit identity not recorded" | tee "$OUT/commit.txt"
  fi
  cd "$WORK"
  touch "$OUT/.tstamp"
  "$PY" -c "from openEMS.openEMS import openEMS; print('openEMS from image: OK')"
  echo "RFX_OPENEMS_COMMIT=${RFX_OPENEMS_COMMIT:-unset}"
  "$PY" -m pip uninstall -y -q jax-cuda12-plugin jax-cuda12-pjrt 2>/dev/null || true
  "$PY" -m pip install -q "jax[cpu]==0.6.2" "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7"
  export RFX_REPO_ROOT="$WORK"
  export PYTHONPATH="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, os; print('probe ok | jax', jax.__version__, '| backend', jax.default_backend(), '| rfx', getattr(rfx, '__version__', '?'), '| from', os.path.dirname(rfx.__file__))"
  echo "=== step cv05_realization (build-time, no solve) ==="
  set +e
  timeout 900 env RFX_CV05_BUILD_ONLY=1 \
      RFX_CV05_REALIZED_JSON="$OUT/cv05_realized_stack.json" \
      "$PY" -u validation/crossval/05_patch_antenna.py > "$OUT/cv05_realization.log" 2>&1
  rc0=$?
  set -e
  echo "$rc0" > "$OUT/cv05_realization.rc"
  tail -n 20 "$OUT/cv05_realization.log" || true
  if [ "$rc0" -ne 0 ]; then
    echo "REFUSING TO SOLVE: the realized stack is not the declared stack."
    rc=$rc0
    echo "$rc" > "$OUT/cv05_run.rc"
  else
  echo "=== step cv05_run ==="
  set +e
  timeout 10800 env RFX_CROSSVAL05_JSON="$OUT/cv05_run.json" "$PY" -u validation/crossval/05_patch_antenna.py > "$OUT/cv05_run.log" 2>&1
  rc=$?
  set -e
  echo "$rc" > "$OUT/cv05_run.rc"
  tail -n 40 "$OUT/cv05_run.log" || true
  echo "cv05_run_rc=$rc"
  echo "=== step cv05_census (geometry only, no FDTD) ==="
  set +e
  timeout 1800 "$PY" -u scripts/diagnostics/build_cv05_ringdown_spectra.py \
      --census-only --output "$OUT/cv05_realized_x_cell_census.json" \
      > "$OUT/cv05_census.log" 2>&1
  rcc=$?
  set -e
  echo "$rcc" > "$OUT/cv05_census.rc"
  tail -n 20 "$OUT/cv05_census.log" || true
  echo "=== step cv05_fixture_build (writes the fixture INTO the branch worktree) ==="
  set +e
  timeout 7200 "$PY" -u scripts/diagnostics/build_cv05_ringdown_spectra.py \
      > "$OUT/cv05_fixture_build.log" 2>&1
  rc2=$?
  set -e
  echo "$rc2" > "$OUT/cv05_fixture_build.rc"
  tail -n 40 "$OUT/cv05_fixture_build.log" || true
  echo "cv05_fixture_build_rc=$rc2"
  cp -p "$WORK/tests/fixtures/patch_mode_identification/cv05_ringdown_spectra.json" \
     "$OUT/cv05_ringdown_spectra.json" 2>/dev/null || true
  echo "=== diff of the ring-down fixture against the committed one ==="
  if [ "$HAVE_GIT" -eq 1 ]; then
    git -C "$WORK" diff --stat -- tests/fixtures/patch_mode_identification/ \
       | tee "$OUT/cv05_fixture_diff.txt" || true
  fi
  fi

  echo "=== worktree files this run touched ==="
  if [ "$HAVE_GIT" -eq 1 ]; then
    git -C "$WORK" status --porcelain | tee "$OUT/worktree_status_after.txt"
  fi
  mkdir -p "$OUT/produced"
  find "$WORK/validation" "$WORK/tests/fixtures" -type f -newer "$OUT/.tstamp" \
      -not -path "*/.git/*" -not -path "*/__pycache__/*" -not -name "*.pyc" \
      > "$OUT/produced_files.txt" 2>/dev/null || true
  while IFS= read -r f; do
    rel=${f#$WORK/}
    d=$(dirname "$rel")
    mkdir -p "$OUT/produced/$d"
    cp -p "$f" "$OUT/produced/$rel" 2>/dev/null || true
  done < "$OUT/produced_files.txt"
  echo "harvested $(wc -l < "$OUT/produced_files.txt") file(s)"
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "POST_CASE=cv05 RC=$rc"
  exit "$rc"
