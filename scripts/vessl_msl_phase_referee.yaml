name: rfx-msl-phase-referee
description: "#490 lane 2: source-built openEMS referee for MSL de-embedded phase (comparator leg only -- brackets, does not judge rfx's own compute_msl_s_matrix numbers). This lane mounts and tests the PRIMARY checkout (/root/workspace/byungkwan-workspace/research/rfx), NOT a git clone (vessl_external_referee_lane.md) -- the referee script AND the committed rfx-side fixture (tests/fixtures/msl_phase_referee/msl_thru_rfx_dx50.json) must be MERGED TO MAIN before submitting, or this run will execute whatever is on main, not your branch. On-demand, not a fixed cadence; standing lane per docs/agent-memory/task_recipes/vessl_external_referee_lane.md -- submit whenever the MSL phase geometry or extractor changes, or when #490 lane 2 review needs fresh evidence: vessl run create -f scripts/vessl_msl_phase_referee.yaml"
tags: [rfx, msl-phase, i490, external-referee]
resources:
  cluster: remilab-c0
  cpu: 16
  memory: 24Gi
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  # OMP_NUM_THREADS=1: openEMS's own --threads/numThreads (passed explicitly
  # below, matching resources.cpu=16) does the parallelism (coax lane's own
  # L3 review fix -- align cpu / OMP_NUM_THREADS / numThreads instead of
  # three independently-chosen numbers).
  OMP_NUM_THREADS: "1"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eux
  # pytorch runtime image: dash shell (no bashisms) and git via apt below.
  echo "=== rfx #490 lane 2: openEMS MSL phase referee ==="
  date

  # -- SOLVER ENVIRONMENT NOW COMES FROM THE IMAGE (image: swap, 5b423bdfe0c8):
  # this lane used to apt-get install build deps and source-build
  # openEMS-Project on every run (~30-60 min). That block is gone -- the
  # image (docker/openems-lane/Dockerfile, built by
  # .github/workflows/build-openems-image.yml, published to
  # ghcr.io/bk-squared/rfx-openems) already contains openEMS-Project
  # (pinned to the Dockerfile's OPENEMS_COMMIT) built and its python
  # bindings installed against the image's conda python. Motivation:
  # 2026-08-04, archive.ubuntu.com was unreachable from this cluster and
  # killed 4 provisioning attempts across this lane and its siblings
  # before any physics ran.
  # ONE-LINE REVERT: `git show <this-commit>^:scripts/vessl_msl_phase_referee.yaml
  # > scripts/vessl_msl_phase_referee.yaml` restores the apt+build block
  # and the pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime image line in
  # one shot.
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" --version
  "$PY" -c "from openEMS.openEMS import openEMS; print('openEMS from image: OK')"

  # -- provenance (this script never imports rfx, but the referee's Stage B
  # geometry constants were cross-checked against the LIVE rfx checkout at
  # authoring time -- record which commit that was, per vessl_external_
  # referee_lane.md's "both lanes test the LIVE primary checkout" discipline,
  # AND that the committed rfx-side fixture is present -- Stage B cannot
  # run without it). --
  cd /root/workspace/byungkwan-workspace/research/rfx
  git config --global --add safe.directory /root/workspace/byungkwan-workspace/research/rfx || true
  echo "=== provenance ==="
  git rev-parse HEAD || true
  git status --short || true
  test -f tests/fixtures/msl_phase_referee/msl_thru_rfx_dx50.json && echo "rfx fixture: present" || echo "rfx fixture: MISSING (Stage B will exit 3)"

  out=".omx/msl-phase-referee/$(date -u +%Y%m%dT%H%M%SZ)"
  mkdir -p "$out"

  # -- Stage A + Stage B, sequential inside the script itself (Stage B is
  # skipped by the script if Stage A's reproduce-gate fails). Exit-code
  # convention (docs/agent-memory/task_recipes/vessl_external_referee_
  # lane.md, extended by the script's own module docstring): 0 self-checks
  # passed, 1 a physics/self-check gate failed, 2 openEMS missing (should
  # not fire here -- the build above just proved it isn't), 3 an internal
  # config/layout bug or a drift against the committed rfx fixture.
  # --threads matches resources.cpu above. --
  set +e
  timeout 5400 "$PY" validation/crossval/20_msl_phase_referee.py \
    --output "$out/openems_msl_phase_referee.json" \
    --threads 16 \
    > "$out/run.log" 2>&1
  rc=$?
  set -e
  echo "$rc" > "$out/exit_code"
  tail -n 60 "$out/run.log" || true
  echo "msl_phase_referee_rc=$rc"

  # n10 fix (2026-08-04 review), path updated on promotion (same day, #490
  # reviewer judgment): copy the run log to the TRACKED prefix this
  # script's own header-test fill-contract requires
  # (validation/crossval/_20_msl_phase_referee_logs/ -- tests/
  # test_msl_phase_referee_header.py's REPRODUCE_GATE_RECORD contract
  # test rejects .omx/ and docs/research_notes/vessl_logs/, both
  # gitignored, per the coax lane's own PR #548 lesson). This only
  # places the file on disk at the tracked path inside the mounted
  # checkout -- `git add` + commit (with the VESSL run ID in the
  # filename, matching validation/research/coax_two_port/logs/'s own
  # naming) is still a human step after reviewing the run, same as the
  # coax lane's own workflow.
  mkdir -p validation/crossval/_20_msl_phase_referee_logs
  cp "$out/run.log" "validation/crossval/_20_msl_phase_referee_logs/$(date -u +%Y%m%dT%H%M%SZ)_run.log" || true

  echo "=== verdict ==="
  case "$rc" in
    0) echo "PASS: reproduce-gate + Stage B self-consistency both passed (comparator-leg only -- see JSON for the actual cross-solver bracket/dispersion report, no verdict on rfx-vs-openEMS absolute agreement)" ;;
    1) echo "SELF-CHECK FAILED: reproduce-gate or a Stage B sanity/self-consistency witness failed -- inspect $out/run.log before trusting any number in the JSON" ;;
    2) echo "UNEXPECTED: script reports openEMS missing despite the source build above succeeding -- investigate the build/import path" ;;
    3) echo "CONFIG ERROR: an internal layout/geometry assertion or a drift against the committed rfx fixture -- this is a script bug, NOT a physics finding; fix the script or regenerate the fixture before resubmitting" ;;
    *) echo "ERROR: unexpected exit code $rc" ;;
  esac
  exit "$rc"
