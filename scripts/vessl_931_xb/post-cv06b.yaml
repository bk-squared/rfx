name: rfx-931-post-cv06b
description: "cv06b post-#931 re-solve: the trace and stub are SHEETS on the substrate-top node plane. Same three steps as the pre-change baseline (rfx-931-base-cv06b, run 369367259002) so the two are comparable: estimator replay, the shipped case script, and the three build falsifiers. Checkout: worktree /root/workspace/byungkwan-workspace/research/rfx-931-XB-crossval-b on feat/931-crossval-b. Submit: vessl run create -f post-cv06b.yaml"
tags: [rfx, issue-931, post, cv06b, msl, gpu]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== rfx #931 post-change: cv06b (feat/931-crossval-b) ==="
  date
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  WORK=/root/workspace/byungkwan-workspace/research/rfx-931-XB-crossval-b
  test -d "$WORK" || { echo "ERROR: worktree missing at $WORK"; exit 3; }
  RUNS=/root/workspace/claude-workspace/rfx/runs
  OUT=$RUNS/issue931-post-cv06b-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > "$RUNS/issue931-post-cv06b.latest"
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  cd "$WORK"
  git log --oneline -1 | tee "$OUT/commit.txt" || true
  touch "$OUT/.tstamp"
  nvidia-smi || true
  "$PY" -m pip install -q "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7"
  export RFX_REPO_ROOT="$WORK"
  export PYTHONPATH="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, os; print('probe ok | jax', jax.__version__, '| backend', jax.default_backend(), '| rfx', getattr(rfx, '__version__', '?'), '| from', os.path.dirname(rfx.__file__))"
  echo "=== step cv06b_estimator_replay ==="
  set +e
  timeout 3600 "$PY" -u scripts/diagnostics/cv06b_estimator_falsifiers.py --out-json "$OUT/cv06b_estimator_falsifiers.json" > "$OUT/cv06b_estimator_replay.log" 2>&1
  rc2=$?
  set -e
  echo "$rc2" > "$OUT/cv06b_estimator_replay.rc"
  tail -n 40 "$OUT/cv06b_estimator_replay.log" || true
  echo "cv06b_estimator_replay_rc=$rc2"
  echo "=== step cv06b_run ==="
  set +e
  timeout 7200 "$PY" -u validation/crossval/06b_msl_notch_filter_uniform.py > "$OUT/cv06b_run.log" 2>&1
  rc=$?
  set -e
  echo "$rc" > "$OUT/cv06b_run.rc"
  tail -n 60 "$OUT/cv06b_run.log" || true
  echo "cv06b_run_rc=$rc"
  echo "=== step cv06b_build_falsifiers ==="
  set +e
  timeout 10800 "$PY" -u scripts/diagnostics/cv06b_build_falsifiers.py --out-dir "$OUT" > "$OUT/cv06b_build_falsifiers.log" 2>&1
  rc3=$?
  set -e
  echo "$rc3" > "$OUT/cv06b_build_falsifiers.rc"
  tail -n 40 "$OUT/cv06b_build_falsifiers.log" || true
  echo "cv06b_build_falsifiers_rc=$rc3"

  echo "=== harvest: files the run wrote into the worktree ==="
  mkdir -p "$OUT/produced"
  find "$WORK" -type f -newer "$OUT/.tstamp" \
      -not -path "*/.git/*" -not -path "*/__pycache__/*" -not -name "*.pyc" \
      > "$OUT/produced_files.txt" 2>/dev/null || true
  while IFS= read -r f; do
    rel=${f#$WORK/}
    d=$(dirname "$rel")
    mkdir -p "$OUT/produced/$d"
    cp -p "$f" "$OUT/produced/$rel" 2>/dev/null || true
  done < "$OUT/produced_files.txt"
  echo "harvested $(wc -l < "$OUT/produced_files.txt") file(s)"
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "POST_CASE=cv06b RC=$rc"
  exit "$rc"
