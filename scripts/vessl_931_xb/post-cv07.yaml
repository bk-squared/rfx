name: rfx-931-post-cv07
description: "cv07 post-#931 re-solve: the three metal footprints are SHEETS on the laminate face, dx stays 200 um. Same two steps as the pre-change baseline (rfx-931-base-cv07, run 369367259003): the rfx leg that writes _07_sheen_results/rfx.json, then compare against the committed openEMS leg. Checkout: worktree /root/workspace/byungkwan-workspace/research/rfx-931-XB-crossval-b on feat/931-crossval-b. Submit: vessl run create -f post-cv07.yaml"
tags: [rfx, issue-931, post, cv07, openems, msl]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== rfx #931 post-change: cv07 (feat/931-crossval-b) ==="
  date
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  WORK=/root/workspace/byungkwan-workspace/research/rfx-931-XB-crossval-b
  test -d "$WORK" || { echo "ERROR: worktree missing at $WORK"; exit 3; }
  RUNS=/root/workspace/claude-workspace/rfx/runs
  OUT=$RUNS/issue931-post-cv07-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > "$RUNS/issue931-post-cv07.latest"
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  cd "$WORK"
  git log --oneline -1 | tee "$OUT/commit.txt" || true
  touch "$OUT/.tstamp"
  "$PY" -c "from openEMS.openEMS import openEMS; print('openEMS from image: OK')"
  "$PY" -m pip uninstall -y -q jax-cuda12-plugin jax-cuda12-pjrt 2>/dev/null || true
  "$PY" -m pip install -q "jax[cpu]==0.6.2" "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7"
  export RFX_REPO_ROOT="$WORK"
  export PYTHONPATH="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, os; print('probe ok | jax', jax.__version__, '| backend', jax.default_backend(), '| rfx', getattr(rfx, '__version__', '?'), '| from', os.path.dirname(rfx.__file__))"
  echo "=== step cv07_rfx ==="
  set +e
  timeout 3600 "$PY" -u validation/crossval/07_sheen_lpf.py rfx > "$OUT/cv07_rfx.log" 2>&1
  rc=$?
  set -e
  echo "$rc" > "$OUT/cv07_rfx.rc"
  tail -n 60 "$OUT/cv07_rfx.log" || true
  echo "cv07_rfx_rc=$rc"
  echo "=== step cv07_compare ==="
  set +e
  timeout 1800 "$PY" -u validation/crossval/07_sheen_lpf.py compare > "$OUT/cv07_compare.log" 2>&1
  rc2=$?
  set -e
  echo "$rc2" > "$OUT/cv07_compare.rc"
  tail -n 60 "$OUT/cv07_compare.log" || true
  echo "cv07_compare_rc=$rc2"

  echo "=== harvest: files the run wrote into the worktree ==="
  mkdir -p "$OUT/produced"
  find "$WORK" -type f -newer "$OUT/.tstamp" \
      -not -path "*/.git/*" -not -path "*/__pycache__/*" -not -name "*.pyc" \
      > "$OUT/produced_files.txt" 2>/dev/null || true
  while IFS= read -r f; do
    rel=${f#$WORK/}
    d=$(dirname "$rel")
    mkdir -p "$OUT/produced/$d"
    cp -p "$f" "$OUT/produced/$rel" 2>/dev/null || true
  done < "$OUT/produced_files.txt"
  echo "harvested $(wc -l < "$OUT/produced_files.txt") file(s)"
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "POST_CASE=cv07 RC=$rc"
  exit "$rc"
