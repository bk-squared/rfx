name: rfx-931-post-cv11
description: "cv11 post-#931 re-solve: the port-aperture trim is deleted (the rfx-side default #889 now supplies cfg.f_cutoff = 6.512162 GHz) and the PEC short's realized walls are asserted before the solve. Same single step as the pre-change baseline (rfx-931-base-cv11, run 369367259004). Checkout: worktree /root/workspace/byungkwan-workspace/research/rfx-931-XB-crossval-b on feat/931-crossval-b. Submit: vessl run create -f post-cv11.yaml"
tags: [rfx, issue-931, post, cv11, waveguide]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== rfx #931 post-change: cv11 (feat/931-crossval-b) ==="
  date
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  WORK=/root/workspace/byungkwan-workspace/research/rfx-931-XB-crossval-b
  test -d "$WORK" || { echo "ERROR: worktree missing at $WORK"; exit 3; }
  RUNS=/root/workspace/claude-workspace/rfx/runs
  OUT=$RUNS/issue931-post-cv11-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > "$RUNS/issue931-post-cv11.latest"
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  cd "$WORK"
  git log --oneline -1 | tee "$OUT/commit.txt" || true
  touch "$OUT/.tstamp"
  "$PY" -m pip uninstall -y -q jax-cuda12-plugin jax-cuda12-pjrt 2>/dev/null || true
  "$PY" -m pip install -q "jax[cpu]==0.6.2" "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7"
  export RFX_REPO_ROOT="$WORK"
  export PYTHONPATH="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, os; print('probe ok | jax', jax.__version__, '| backend', jax.default_backend(), '| rfx', getattr(rfx, '__version__', '?'), '| from', os.path.dirname(rfx.__file__))"
  echo "=== step cv11 ==="
  set +e
  timeout 5400 "$PY" -u validation/crossval/11_waveguide_port_wr90.py > "$OUT/cv11.log" 2>&1
  rc=$?
  set -e
  echo "$rc" > "$OUT/cv11.rc"
  tail -n 80 "$OUT/cv11.log" || true
  echo "cv11_rc=$rc"

  echo "=== harvest: files the run wrote into the worktree ==="
  mkdir -p "$OUT/produced"
  find "$WORK" -type f -newer "$OUT/.tstamp" \
      -not -path "*/.git/*" -not -path "*/__pycache__/*" -not -name "*.pyc" \
      > "$OUT/produced_files.txt" 2>/dev/null || true
  while IFS= read -r f; do
    rel=${f#$WORK/}
    d=$(dirname "$rel")
    mkdir -p "$OUT/produced/$d"
    cp -p "$f" "$OUT/produced/$rel" 2>/dev/null || true
  done < "$OUT/produced_files.txt"
  echo "harvested $(wc -l < "$OUT/produced_files.txt") file(s)"
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "POST_CASE=cv11 RC=$rc"
  exit "$rc"
