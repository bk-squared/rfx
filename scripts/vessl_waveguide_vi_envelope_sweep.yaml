name: rfx-waveguide-vi-envelope-sweep
description: "The pre-declared validity-envelope sweep of the waveguide normalize=False port (docs/design_notes/waveguide_vi_envelope_sweep_predeclaration.md). Empty matched WR-90 guide plus one y-asymmetric PEC blade leg; scripts/waveguide_vi_envelope_sweep.py over the case lists scripts/waveguide_vi_envelope_cases.py emits, in the execution order of section 10: the two zero-FDTD artifacts, Stage 0 (K=3.0 vs K=4.5), the R5 anchor, the interior R3/R4/R6/R7, the low bracket R2/R1/R0 in two absorber lanes, the C-0/C-A/C-S ceiling leg, then R5-X, F1, F2 and the b/a control. One JSON per case is persisted to the mounted NFS run dir the MOMENT that case finishes, before any optional stage. The repo is fetched fresh at RFX_EXPECT_SHA and the job refuses to start unless rfx/ at that SHA is bit-identical to RFX_MEASURED_SHA, the SHA the envelope sentence names. gpu-rtx4090 because the projected GPU solve is about 75 min against roughly 30 h on the CPU box."
tags: [rfx, waveguide, envelope, vi-lane, measurement, v18]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  # float32 everywhere except the one F2 case, which gets its own process
  # below with RFX_SWEEP_X64=1 (jax_enable_x64 is process-global).
  JAX_ENABLE_X64: "0"
  # The branch head carrying the harness. Fill after the branch is pushed;
  # the job refuses to start on the placeholder.
  RFX_EXPECT_SHA: "FILL_AFTER_PUSH"
  # The SHA the envelope sentence names — the shipped port code under
  # measurement. RFX_EXPECT_SHA must not change a byte of rfx/ against it.
  RFX_MEASURED_SHA: "b59e1d991dd62868bdf8689a1f642eeb8f7c5b89"
  RUN_DIR: "FILL_AFTER_PUSH"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== rfx waveguide VI-envelope sweep (the pre-declared measurement) ==="
  date
  if [ "$RFX_EXPECT_SHA" = "FILL_AFTER_PUSH" ]; then
    echo "FATAL: RFX_EXPECT_SHA still holds the FILL_AFTER_PUSH placeholder"; exit 3
  fi
  if [ "$RUN_DIR" = "FILL_AFTER_PUSH" ]; then
    echo "FATAL: RUN_DIR still holds the FILL_AFTER_PUSH placeholder"; exit 3
  fi
  echo "harness commit:  $RFX_EXPECT_SHA"
  echo "measured commit: $RFX_MEASURED_SHA"
  echo "run dir (mounted NFS): $RUN_DIR"

  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }
  ROOT=/tmp/rfx-vi-envelope
  rm -rf "$ROOT"; mkdir -p "$ROOT"
  cd "$ROOT"
  git init -q
  git config --global --add safe.directory "$ROOT"
  git fetch -q --depth 50 https://github.com/bk-squared/rfx.git "$RFX_EXPECT_SHA"
  git checkout -q FETCH_HEAD
  git fetch -q --depth 50 https://github.com/bk-squared/rfx.git "$RFX_MEASURED_SHA"
  echo "=== provenance ==="
  git rev-parse HEAD

  # ---- GATE 1: the library under measurement is untouched --------------
  # The envelope sentence names RFX_MEASURED_SHA. If the harness branch moved
  # a byte of rfx/, the sentence describes code that was not run.
  if git diff --quiet "$RFX_MEASURED_SHA" HEAD -- rfx/; then
    echo "GATE 1 ok: rfx/ is bit-identical to $RFX_MEASURED_SHA"
  else
    echo "FATAL: rfx/ differs from the measured SHA:"
    git diff --stat "$RFX_MEASURED_SHA" HEAD -- rfx/
    exit 3
  fi

  # ---- GATE 2: every file the sweep needs is in the fetched tree --------
  for f in scripts/waveguide_vi_envelope_sweep.py \
           scripts/waveguide_vi_envelope_cases.py \
           scripts/waveguide_vi_envelope_preflight_artifacts.py \
           tests/_waveguide_chain_battery_fixture.py \
           docs/design_notes/waveguide_vi_envelope_sweep_predeclaration.md; do
    test -f "$f" || { echo "FATAL: $f missing in the fetched tree"; exit 3; }
  done
  echo "GATE 2 ok"

  echo "=== runtime deps ==="
  python -m pip install -q "scipy>=1.11" "h5py>=3.8" || true
  export PYTHONPATH="$ROOT"
  export RFX_WT="$ROOT"
  nvidia-smi || true

  # ---- GATE 3: the code that will be measured is the fetched tree -------
  python -c "import jax, rfx, os, sys; p=os.path.realpath(os.path.dirname(rfx.__file__)); print('probe | jax', jax.__version__, '| backend', jax.default_backend(), '| devices', jax.devices(), '| rfx', getattr(rfx,'__version__','?'), 'from', p, '| x64', jax.config.jax_enable_x64); sys.exit(0 if p.startswith(os.environ['RFX_WT']) else 9)"
  echo "GATE 3 ok"

  mkdir -p "$RUN_DIR/cases" "$RUN_DIR/results" "$RUN_DIR/logs"
  cp scripts/waveguide_vi_envelope_sweep.py scripts/waveguide_vi_envelope_cases.py \
     scripts/waveguide_vi_envelope_preflight_artifacts.py \
     scripts/vessl_waveguide_vi_envelope_sweep.yaml \
     docs/design_notes/waveguide_vi_envelope_sweep_predeclaration.md "$RUN_DIR/" || true
  python -u scripts/waveguide_vi_envelope_cases.py "$RUN_DIR/cases"

  # ---- GATE 4: the two zero-FDTD artifacts, BEFORE any timestepping -----
  # Section 7 / section 10 step 1. The rasterization guard stops everything;
  # the index audit is EXPECTED to fail on the E-plane sum and records it.
  echo "===== zero-FDTD artifacts ====="
  python -u scripts/waveguide_vi_envelope_preflight_artifacts.py \
    --out "$RUN_DIR/preflight_artifacts.json" \
    > "$RUN_DIR/logs/preflight_artifacts.log" 2>&1 || {
      echo "FATAL: zero-FDTD artifacts refused the run"; \
      tail -n 60 "$RUN_DIR/logs/preflight_artifacts.log"; exit 4; }
  tail -n 40 "$RUN_DIR/logs/preflight_artifacts.log"
  echo "GATE 4 ok"

  # ---- the sweep, in the section 10 order ------------------------------
  # Stages run in order and the loop CONTINUES past a failed stage: every case
  # persists its own JSON before the next starts, so a later failure cannot
  # cost an earlier case. Section 1.3 revision 2 makes S0-a, S0-b AND S0-c
  # unconditional, so all three are inside 01_stage0; there is no conditional
  # escalation file. If any Stage-0 case fails its per-bin criterion, K becomes
  # band-dependent and the sweep is re-declared before the headline cases are
  # read — that adjudication is a human step, which is why the loop continues
  # rather than aborting: the later cases are still worth having on disk.
  fails=0
  for stage in 01_stage0 02_anchor_R5 03_interior 04_low_bracket 05_ceiling 06_falsifiers; do
    echo "===== stage $stage ====="
    date
    set +e
    timeout 21600 python -u scripts/waveguide_vi_envelope_sweep.py \
      "$RUN_DIR/cases/$stage.json" "$RUN_DIR/results" \
      > "$RUN_DIR/logs/$stage.log" 2>&1
    rc=$?
    set -e
    echo "$rc" > "$RUN_DIR/logs/$stage.rc"
    echo "stage $stage rc=$rc"
    grep -E "^(PREFLIGHT|DONE|FAILED|SKIP)" "$RUN_DIR/logs/$stage.log" | tail -n 40 || true
    [ "$rc" -eq 0 ] || fails=$((fails + 1))
  done

  # F2 needs jax_enable_x64, which is process-global — its own process, its own
  # case file. A silently downcast float64 control is a no-op.
  echo "===== stage 07_falsifier_f64 (x64 process) ====="
  date
  set +e
  RFX_SWEEP_X64=1 timeout 21600 python -u scripts/waveguide_vi_envelope_sweep.py \
    "$RUN_DIR/cases/07_falsifier_f64.json" "$RUN_DIR/results" \
    > "$RUN_DIR/logs/07_falsifier_f64.log" 2>&1
  rc=$?
  set -e
  echo "$rc" > "$RUN_DIR/logs/07_falsifier_f64.rc"
  echo "stage 07_falsifier_f64 rc=$rc"
  grep -E "^(PREFLIGHT|DONE|FAILED)" "$RUN_DIR/logs/07_falsifier_f64.log" | tail -n 10 || true
  [ "$rc" -eq 0 ] || fails=$((fails + 1))

  echo "===== persisted ====="
  ls -la "$RUN_DIR/results" | tail -n 100
  echo "cases persisted: $(ls -1 "$RUN_DIR/results" | wc -l)"
  echo "artifacts (mounted, survives teardown): $RUN_DIR"
  echo "vi_envelope_failed_stages=$fails"
  echo "REMINDER: back this run's logs up to docs/vessl-logs/ BEFORE deleting it."
  [ "$fails" -eq 0 ]
