name: rfx-gpu-suite
description: "W2.4 maintained GPU harness: full gpu-marked pytest suite on origin/main (or RFX_GPU_SUITE_REF), exported with git archive so the primary checkout is never the thing under test (run per release tag + after GPU-touching merges)"
tags: [rfx, gpu-suite, ci-trust, w24]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -euo pipefail
  primary=/root/workspace/byungkwan-workspace/research/rfx
  cd "$primary"
  git config --global --add safe.directory "$primary" || true
  echo "=== rfx GPU suite (W2.4 maintained harness) ==="
  echo "=== provenance ==="
  # The suite tests the REF it is asked for (default origin/main), never
  # whatever the primary checkout happens to have checked out. Measured
  # 2026-09-15 (run 369367261080): the primary checkout sat 6 commits behind
  # main after the #1038 runner merges, so a "post-merge" GPU run silently
  # tested pre-merge code. The tree is exported with `git archive` into a
  # scratch dir, so the PI's checkout is not touched (no checkout, no worktree
  # metadata, no detached HEAD). Override with RFX_GPU_SUITE_REF=<sha|branch>.
  git fetch -q origin
  ref="${RFX_GPU_SUITE_REF:-origin/main}"
  sha=$(git rev-parse "$ref")
  short=$(git rev-parse --short "$ref")
  echo "suite ref: $ref = $sha"
  echo "primary checkout HEAD: $(git rev-parse HEAD) (informational; the suite runs $ref, not this HEAD)"
  git status --short || true
  src="/tmp/rfx-gpu-suite-$short"
  rm -rf "$src" && mkdir -p "$src"
  git archive --format=tar "$sha" | tar -xf - -C "$src"
  echo "=== install runtime dependencies (exported tree, no editable install) ==="
  # Python 3.11 + JAX 0.10.2 in a uv venv (PI 2026-09-25); see scripts/vessl_validation_lane_a6000.yaml.
  # Everything below runs "$PY", never the image's python 3.10 (JAX 0.4.33, #1252).
  python -m pip install -q "uv==0.12.19"
  uv venv -q --python 3.11.16 /tmp/venv-py311
  PY=/tmp/venv-py311/bin/python
  uv pip install -q --python "$PY" --exclude-newer 2026-09-27T13:37:21Z "jax[cuda12]==0.10.2" "numpy==2.4.6" "scipy==1.17.1" "h5py==3.16.0" "matplotlib==3.11.2" "ml_dtypes==0.6.0" "pyyaml==6.0.3" "optax==0.2.8" "pillow==12.3.0" "pytest==9.1.1" "pytest-split==0.11.0" "pytest-timeout==2.4.0"
  # Assert what was realized, on its own line: a pipe under `set -eu` would hide a failure.
  "$PY" -c "import jax, sys; assert sys.version_info[:2] == (3, 11), sys.version; assert jax.__version__ == '0.10.2', jax.__version__; assert jax.default_backend() == 'gpu', jax.default_backend()"
  export RFX_REPO_ROOT="$src"
  export PYTHONPATH="$RFX_REPO_ROOT"
  cd "$src"
  "$PY" -c "import jax, rfx; print('probe ok | jax', jax.__version__, '| devices', jax.devices(), '| rfx', getattr(rfx, '__version__', '?'), '| from', rfx.__file__)"
  out="$primary/.omx/gpu-suite/$(date -u +%Y%m%dT%H%M%SZ)-$short"
  mkdir -p "$out"
  uv pip freeze --python "$PY" > "$out/pip_freeze.txt"
  echo "=== gpu-marked suite (249 tests at authoring time) ==="
  # NOTE: the 'distributed' pytest marker is declared but currently has ZERO
  # tests — distributed coverage lives in regular test files that set their
  # own XLA --xla_force_host_platform_device_count sentinel and run in the
  # fast suite (test_distributed_nu_composition.py always did; as of #622
  # test_distributed_nu_kernel.py's 2-device family joined it there too, and
  # as of #623 test_distributed.py's 2-/4-device family joined it as well —
  # both used to carry the 'gpu' marker below, which meant their two-device
  # tests ran in NO lane at all: this 1-GPU pod only creates *virtual*
  # devices on the CPU backend, so '-m gpu' here always skipped them, and
  # every CPU lane deselects 'gpu'). Re-add a '-m distributed' step here if
  # the marker gains tests.
  # POSIX-safe rc capture (the VESSL runner shell is busybox-ash:
  # ${PIPESTATUS[0]} is a bashism and died with 'bad substitution' on
  # proof run 369367242339 — pytest itself completed fine).
  set +e
  # 20000 s: this selection took 13221 s of pytest on run 369367264767 (RTX 3090, 2026-09-25) against the old 13800.
  # crossval_ladder cases run in scripts/vessl_crossval_ladder.yaml; a release needs that lane green too.
  # -v names each test as it starts, so a run cut by the outer timeout still says which
  # test it was in; run 369367265464 (a9054338, RTX 4090) printed only ".." in 5.6 h under -q,
  # while the same command at 0c3d3c61 eleven hours later finished (180 passed): the stall is
  # intermittent, which is what the per-test timeout is for (thread method: a stall inside
  # XLA holds the main thread outside Python bytecode, where a SIGALRM handler never runs).
  timeout 20000 "$PY" -m pytest -m "gpu and not crossval_ladder" -v -ra -p no:cacheprovider \
    --durations=40 --timeout=5400 --timeout-method=thread \
    > "$out/gpu_suite.log" 2>&1
  rc=$?
  set -e
  tail -n 60 "$out/gpu_suite.log"
  echo "$rc" > "$out/gpu_suite.rc"
  echo "=== summary ==="
  tail -n 30 "$out/gpu_suite.log" | grep -E "passed|failed|error|skipped" || true
  echo "gpu_suite_rc=$rc"
  echo "artifacts: $out"
  exit "$rc"
