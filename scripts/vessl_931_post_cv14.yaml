name: rfx-931-post-cv14
description: "cv14 rectangular cavity vs the exact Pozar spectrum. Post-#931 CONTROL: cv14's only PEC is the domain boundary, fenced out of the ownership contract (design note 1.8), so all four gates must reproduce. Gate 0 now MEASURES the realized wall planes through realized_wall_planes instead of computing (n-1)*dx from the grid shape. Checkout under test: worktree /root/workspace/byungkwan-workspace/research/rfx-931-XC-crossvalC on branch feat/931-crossval-C, the working tree as it stands at submission (the exact commit is recorded at runtime in $OUT/commit.txt). Submit: vessl run create -f scripts/vessl_931_post_cv14.yaml"
tags: [rfx, issue-931, post, cv14, control]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== rfx #931 POST-change: cv14 (feat/931-crossval-C) ==="
  date
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  SRC=/root/workspace/byungkwan-workspace/research/rfx-931-XC-crossvalC
  test -d "$SRC" || { echo "ERROR: worktree missing at $SRC"; exit 3; }
  RUNS=/root/workspace/claude-workspace/rfx/runs
  OUT=$RUNS/issue931-post-cv14-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > "$RUNS/issue931-post-cv14.latest"
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  { git -C "$SRC" log -1 --format="worktree $SRC @ %H (%D) %s" 2>/dev/null || echo "worktree $SRC (git metadata unavailable)"; } | tee "$OUT/commit.txt"
  WORK=/root/work/rfx931post-cv14
  rm -rf "$WORK"
  mkdir -p "$WORK"
  cp -a "$SRC/." "$WORK/"
  cd "$WORK"
  touch "$OUT/.tstamp"
  "$PY" -m pip uninstall -y -q jax-cuda12-plugin jax-cuda12-pjrt 2>/dev/null || true
  "$PY" -m pip install -q "jax[cpu]==0.6.2" "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7"
  export RFX_REPO_ROOT="$WORK"
  export PYTHONPATH="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, os; print('probe ok | jax', jax.__version__, '| backend', jax.default_backend(), '| rfx', getattr(rfx, '__version__', '?'), '| from', os.path.dirname(rfx.__file__))"
  echo "=== step cv14 ==="
  set +e
  timeout 3600 "$PY" -u validation/crossval/14_rect_cavity_pozar.py  > "$OUT/cv14.log" 2>&1
  rc=$?
  set -e
  echo "$rc" > "$OUT/cv14.rc"
  tail -n 60 "$OUT/cv14.log" || true
  echo "cv14_rc=$rc"

  echo "=== harvest: every file the run wrote into the staged checkout ==="
  mkdir -p "$OUT/produced"
  find "$WORK" -type f -newer "$OUT/.tstamp" \
      -not -path "*/.git/*" -not -path "*/__pycache__/*" -not -name "*.pyc" \
      > "$OUT/produced_files.txt" 2>/dev/null || true
  while IFS= read -r f; do
    rel=${f#$WORK/}
    d=$(dirname "$rel")
    mkdir -p "$OUT/produced/$d"
    cp -p "$f" "$OUT/produced/$rel" 2>/dev/null || true
  done < "$OUT/produced_files.txt"
  echo "harvested $(wc -l < "$OUT/produced_files.txt") file(s)"
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "POST_CASE=cv14 RC=$rc"
  exit "$rc"
