name: rfx-weekly-a6000
description: "Weekly validation lane on a6000: the highmem selection (one multi-GB peak at a time, incl. the ~24 GB oblique-TFSF AD test that no GitHub runner fits) and the gpu-marked suite, at a pinned SHA cloned from the public repository"
tags: [rfx, weekly, validation, a6000]
resources:
  cluster: remilab-c0
  preset: gpu-a6000-1
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  MPLBACKEND: "Agg"
  RFX_WEEKLY_RSS: "1"
  RFX_SHA: "origin/main"
mount:
  /results: volume://remilab-fs/rfx-vessl-tests
run: |-
  set -eu
  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }
  # The job mounts only its own results folder (PI 2026-10-06: no whole-tree mount) and
  # takes the source from the public repository, so it does not touch the NFS clone.
  WORK=/tmp/rfx-weekly-src
  rm -rf "$WORK"
  git clone -q --no-checkout --filter=blob:none https://github.com/bk-squared/rfx.git "$WORK"
  cd "$WORK"
  case "$RFX_SHA" in origin/*) ;; *) git cat-file -e "$RFX_SHA^{commit}" 2>/dev/null || git fetch -q origin "$RFX_SHA";; esac
  SHA=$(git rev-parse --short=8 "$RFX_SHA^{commit}")
  OUT=/results/weekly_a6000_${SHA}_$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  git checkout -q --detach "$SHA"
  echo "checked out $(git rev-parse HEAD): $(git ls-files | wc -l) tracked files"
  # Python 3.11 + JAX 0.10.2 in a uv venv (PI 2026-09-25). On VESSL 369367265580 (A6000) this
  # environment gave the same outcomes as JAX 0.6.2 on the gpu selection. The image's own
  # python is 3.10 with JAX 0.4.33, whose XLA aborts compiling forward(distributed=True) (#1252),
  # so everything below runs "$PY", never the image's `python`.
  # --exclude-newer: resolve the unpinned dependencies (the CUDA wheels among them) as that run did;
  # 13:37:21Z is when its install had finished (its host.txt start time).
  python -m pip install -q "uv==0.12.19"
  uv venv -q --python 3.11.16 /tmp/venv-py311
  PY=/tmp/venv-py311/bin/python
  uv pip install -q --python "$PY" --exclude-newer 2026-09-27T13:37:21Z "jax[cuda12]==0.10.2" "numpy==2.4.6" "scipy==1.17.1" "h5py==3.16.0" "matplotlib==3.11.2" "ml_dtypes==0.6.0" "pyyaml==6.0.3" "optax==0.2.8" "pillow==12.3.0" "pytest==9.1.1" "pytest-split==0.11.0"
  # Assert what was realized, on its own line: a pipe under `set -eu` would hide a failure.
  "$PY" -c "import jax, sys; assert sys.version_info[:2] == (3, 11), sys.version; assert jax.__version__ == '0.10.2', jax.__version__; assert jax.default_backend() == 'gpu', jax.default_backend()"
  uv pip freeze --python "$PY" > "$OUT/pip_freeze.txt"
  export PYTHONPATH="$WORK"
  "$PY" -c "import jax, rfx; print('jax', jax.__version__, jax.devices(), 'rfx', rfx.__version__)"
  echo "=== highmem selection (serial) ==="
  # Timeouts: 2026-09-24 (run 36024266641) took 350 s highmem and 13298 s gpu, 500 s under the
  # old 13800. With ~200 s of setup, 1800 + 18000 fits the workflow's ~348 min poll inside its
  # 360 min job limit (the GitHub-hosted maximum); this YAML sets no VESSL run limit.
  set +e
  timeout 1800 "$PY" -m pytest -v -ra -s -p no:cacheprovider -m "highmem and not gpu" > "$OUT/highmem.log" 2>&1
  RC1=$?
  echo "highmem rc=$RC1"; tail -3 "$OUT/highmem.log"
  echo "=== gpu-marked suite ==="
  # crossval_ladder (the two full-ladder cases, 9691 s of 14830 s on 2026-09-24) runs in scripts/vessl_crossval_ladder.yaml.
  timeout 18000 "$PY" -m pytest -q -ra -s -p no:cacheprovider -m "gpu and not crossval_ladder" > "$OUT/gpu_suite.log" 2>&1
  RC2=$?
  set -e
  echo "gpu suite rc=$RC2"; tail -3 "$OUT/gpu_suite.log"
  grep -E '^(FAILED|ERROR)' "$OUT/highmem.log" "$OUT/gpu_suite.log" | head -40 || true
  printf 'sha=%s highmem_rc=%s gpu_rc=%s\nhighmem_last=%s\ngpu_last=%s\n' "$SHA" "$RC1" "$RC2" "$(tail -1 "$OUT/highmem.log")" "$(tail -1 "$OUT/gpu_suite.log")" > "$OUT/summary.txt"
  cat "$OUT/summary.txt"
  echo "=== done: $OUT ==="
  [ "$RC1" -eq 0 ] && [ "$RC2" -eq 0 ]
