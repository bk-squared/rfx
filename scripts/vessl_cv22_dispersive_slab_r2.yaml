name: rfx-cv22-dispersive-slab-r2
description: "cv22 dispersive slab, ROUND 2 (pre-declared in docs/design_notes/20260902_cv22_dispersive_slab_predeclaration.md section 11.2 before this run). Re-runs the r1 baseline + 8 falsifiers unchanged (readable this time), then the discriminating diagnostics: rfx Lorentz/Debye at dx/2 and dx/4, rfx Lorentz with the time gate opened (nx 1500); Meep Lorentz/Drude at 2x/4x resolution, at decay 1e-6, and with a re-centred source; Meep Debye fixed at 4x resolution (primary, written as meep_debye.json) plus the f_n = 40 GHz cross-check. No window moves. Outputs chmod a+rX. Submit: vessl run create -f scripts/vessl_cv22_dispersive_slab_r2.yaml"
tags: [rfx, crossval, cv22, dispersive, meep, gap-lane-1, round-2]
resources:
  cluster: remilab-c0
  cpu: 16
  memory: 24Gi
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: cpu
  RFX_CHECKOUT_NFS: /root/workspace/claude-workspace/rfx/checkouts/gap1-dispersive-slab
  RFX_RUNS_ROOT: /root/workspace/claude-workspace/rfx/runs
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eux
  echo "=== rfx cv22 dispersive slab ROUND 2 ==="
  date
  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  OUT="$RFX_RUNS_ROOT/cv22-dispersive-r2-$STAMP"
  mkdir -p "$OUT"
  echo "$OUT" > "$RFX_RUNS_ROOT/cv22-dispersive-r2-LATEST"
  # Pod writes as root; the Mac reads as a non-root user. Round 1's cp -a left
  # everything 0600 root. World-readable on ANY exit path.
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT

  # -- 1. stage the checkout (NFS is read-only for the pod) --
  test -d "$RFX_CHECKOUT_NFS" || { echo "ERROR: checkout missing at $RFX_CHECKOUT_NFS"; exit 3; }
  WORK=/tmp/rfx-cv22
  rm -rf "$WORK"; mkdir -p "$WORK"
  cp -a "$RFX_CHECKOUT_NFS/." "$WORK/"
  cd "$WORK"
  git config --global --add safe.directory "$WORK" || true
  git rev-parse HEAD > "$OUT/commit.txt" || echo unknown > "$OUT/commit.txt"
  echo "commit: $(cat "$OUT/commit.txt")"
  RES="$WORK/validation/crossval/_22_dispersive_results"
  mkdir -p "$RES"

  # -- 2. rfx environment --
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" -m pip install -q "jax[cpu]==0.6.2" "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7" "pytest>=7"
  export RFX_REPO_ROOT="$WORK"
  export PYTHONPATH="$WORK"
  "$PY" -c "import jax, rfx; print('rfx probe ok', jax.__version__)"

  # -- 3. Meep environment (conda-forge pymeep, separate env) --
  CONDA=/opt/conda/bin/conda
  if [ ! -x "$CONDA" ]; then
    curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o /tmp/miniconda.sh
    sh /tmp/miniconda.sh -b -p /opt/miniconda-cv22
    CONDA=/opt/miniconda-cv22/bin/conda
  fi
  "$CONDA" create -y -q -n cv22meep --override-channels -c conda-forge python=3.11 pymeep numpy scipy
  MEEP_PY="$(dirname "$CONDA")/../envs/cv22meep/bin/python"
  test -x "$MEEP_PY" || MEEP_PY="$("$CONDA" run -n cv22meep which python)"
  "$MEEP_PY" -c "import meep, numpy; print('meep', meep.__version__, 'numpy', numpy.__version__)"
  MEEP="$MEEP_PY scripts/crossval/meep_cv22_dispersive_slab.py"

  run_meep() {  # name, then args
    NAME=$1; shift
    set +e
    $MEEP "$@" --out-dir "$RES" > "$OUT/meep_$NAME.log" 2>&1
    rc=$?
    set -e
    echo "$rc" > "$OUT/meep_$NAME.rc"; tail -n 5 "$OUT/meep_$NAME.log" || true
    echo "meep_${NAME}_rc=$rc"
  }
  run_rfx() {  # name, then args
    NAME=$1; shift
    set +e
    "$PY" validation/crossval/22_dispersive_slab_fresnel.py "$@" --out-dir "$RES" --no-plots > "$OUT/rfx_$NAME.log" 2>&1
    rc=$?
    set -e
    echo "$rc" > "$OUT/rfx_$NAME.rc"; grep -E "^\[|  E2:|  E2 gates|  E4|FDTD|artifact|PASSED|FAIL|SKIP" "$OUT/rfx_$NAME.log" | tail -n 14 || true
    echo "rfx_${NAME}_rc=$rc"
  }

  # -- 4. Meep legs the baseline reads: Lorentz, Drude (10 px/cm, as r1);
  #       Debye at 4x resolution (section 11.2(c), primary) --
  run_meep lorentz --arm lorentz
  run_meep drude --arm drude
  run_meep debye_res40_primary --arm debye --resolution 40
  # and the two F3 legs (unchanged from r1)
  run_meep lorentz__falsifier_no_2pi --arm lorentz --falsifier no_2pi
  run_meep lorentz__falsifier_gamma_half --arm lorentz --falsifier gamma_half

  # -- 5. Meep diagnostics (section 11.2(b), (b'), (c) cross-check) --
  for ARM in lorentz drude; do
    run_meep ${ARM}__res20 --arm "$ARM" --resolution 20 --tag res20
    run_meep ${ARM}__res40 --arm "$ARM" --resolution 40 --tag res40
    run_meep ${ARM}__decay1e-6 --arm "$ARM" --decay 1e-6 --tag decay1e-6
    run_meep ${ARM}__src7 --arm "$ARM" --fcen-ghz 7 --fwidth-ghz 10 --tag src7
  done
  run_meep debye__fn40 --arm debye --fn-debye-map-hz 40e9 --tag fn40
  ls -la "$RES"

  # -- 6. rfx baseline + the eight falsifiers, unchanged from r1 --
  run_rfx baseline
  base_rc=$(cat "$OUT/rfx_baseline.rc")
  fals_fail=0
  for F in debye_tau_x2 debye_deps_zero lorentz_f0_x1p3 lorentz_deps_zero drude_fp_x1p3 drude_wp_zero meep_lorentz_no_2pi meep_lorentz_gamma_half; do
    run_rfx falsifier_$F --falsifier "$F"
    rc=$(cat "$OUT/rfx_falsifier_$F.rc")
    [ "$rc" -eq 1 ] || { echo "ERROR: falsifier $F exited $rc, expected 1"; fals_fail=1; }
  done

  # -- 7. rfx diagnostics (section 11.2(a), (a')): exit codes are NOT verdicts here --
  run_rfx lorentz_dx2 --arms lorentz --dx-div 2 --tag lorentz_dx2
  run_rfx lorentz_dx4 --arms lorentz --dx-div 4 --tag lorentz_dx4
  run_rfx debye_dx2 --arms debye --dx-div 2 --tag debye_dx2
  run_rfx debye_dx4 --arms debye --dx-div 4 --tag debye_dx4
  run_rfx lorentz_nx1500 --arms lorentz --nx-interior 1500 --tag lorentz_nx1500

  # -- 8. gate test + r2 replay (prints the scaling ratios) --
  set +e
  "$PY" -m pytest -q tests/crossval/test_cv22_dispersive_slab_gates.py tests/crossval/test_cv22_dispersive_eps_mapping.py -rs -s \
    > "$OUT/pytest_gates.log" 2>&1
  gate_rc=$?
  set -e
  echo "$gate_rc" > "$OUT/pytest_gates.rc"
  grep -E "r2-summary|passed|failed|SKIPPED" "$OUT/pytest_gates.log" | tail -n 40 || true
  echo "gate_test_rc=$gate_rc"

  # -- 9. hand back, readable --
  cp -r --no-preserve=ownership,mode "$RES" "$OUT/_22_dispersive_results"
  chmod -R a+rX "$OUT"
  echo "=== verdict ==="
  echo "baseline_rc=$base_rc falsifiers_all_exit_1=$([ "$fals_fail" -eq 0 ] && echo yes || echo NO) gate_test_rc=$gate_rc"
  echo "artifacts: $OUT/_22_dispersive_results"
  # Round 2 exits 0 when every leg RAN (rc 0/1/2 as its own contract allows); the
  # physics verdict is read from the artifacts against the pre-declared predictions.
  fail=0
  for f in "$OUT"/meep_*.rc; do
    rc=$(cat "$f"); case "$rc" in 0) ;; *) echo "WARNING: $(basename "$f") = $rc";; esac
  done
  [ "$(cat "$OUT/meep_debye_res40_primary.rc")" -eq 0 ] || { echo "ERROR: Meep Debye res-40 leg failed (section 11.2(c) acceptance)"; fail=1; }
  [ "$fals_fail" -eq 0 ] || fail=1
  exit "$fail"
