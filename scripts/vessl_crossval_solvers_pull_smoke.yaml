name: rfx-crossval-solvers-pull-smoke
description: "Cheap post-publish gate for ghcr.io/bk-squared/rfx-crossval-solvers (#717 option b): confirms remilab-c0 can pull the two-solver image and that meep AND the openEMS bindings import in ONE interpreter. This is the verification that the ghcr package's one-time private->public visibility flip (a manual step under Packages > settings that GITHUB_TOKEN cannot perform) actually happened -- a still-private package fails here with an auth error, not image-not-found. Run it before the lane, never after: vessl run create -f scripts/vessl_crossval_solvers_pull_smoke.yaml"
tags: [rfx, crossval, image-smoke, i717]
resources:
  cluster: remilab-c0
  cpu: 2
  memory: 4Gi
image: ghcr.io/bk-squared/rfx-crossval-solvers:openems-5b423bdfe0c8-pymeep-1.34.0
run: |-
  set -eu
  # No heredocs (_configs/.claude/rules/vessl-jobs.md): VESSL re-indents this
  # block and a terminator off column 0 kills the job at parse time.
  #
  # Deliberately NO hard-coded expected digest. The sibling
  # scripts/vessl_image_pull_smoke.yaml echoes one, and it has since gone stale
  # against the registry -- a constant in a file that nothing verifies rots
  # silently and then misleads the next reader. The image stamps its own
  # provenance as runtime ENV instead, which cannot drift from what is running.
  echo "pinned image : ghcr.io/bk-squared/rfx-crossval-solvers:openems-5b423bdfe0c8-pymeep-1.34.0"
  echo "parent image : ${RFX_SOLVER_PARENT_IMAGE:-unset}"
  echo "openEMS commit: ${RFX_OPENEMS_COMMIT:-unset}"
  echo "pymeep       : ${RFX_PYMEEP_VERSION:-unset}"
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" --version
  # The whole point of the image, asserted on the cluster rather than only at
  # build time: both solvers in ONE interpreter, on the numpy-1 ABI they are
  # compiled against. test_crossval_comprehensive.py's TestPECCavity needs both
  # in one pytest process.
  "$PY" -c "import numpy; print('numpy', numpy.__version__); assert numpy.__version__.startswith('1.'), 'numpy 2 present; pymeep and the openEMS bindings need numpy 1'"
  "$PY" -c "import meep; print('meep', meep.__version__)"
  "$PY" -c "from openEMS.openEMS import openEMS; from CSXCAD.CSXCAD import ContinuousStructure; print('openEMS/CSXCAD bindings OK')"
  "$PY" -c "import meep; from openEMS.openEMS import openEMS; print('both solvers imported in one interpreter: OK')"
  echo "crossval-solvers image pull smoke: OK"
