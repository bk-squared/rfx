name: rfx-931-post-cv15
description: "cv15 RT5880 patch antenna, POST-#931 re-solve: both conductors declared as SHEETS (zero-thickness PEC Boxes at z_sub_lo / z_sub_hi) and the feed spanning the full substrate from the ground sheet plane. Reproduces the committed leg's command (num_periods 45.0 with NTFF directivity, NOT the argparse default 70.0), then the compare leg. Runs IN the worktree so _15_patch_results/rfx.json lands on the branch for the ingest phase. Checkout under test: worktree /root/workspace/byungkwan-workspace/research/rfx-931-XC-crossvalC on branch feat/931-crossval-C, the working tree as it stands at submission (the exact commit is recorded at runtime in $OUT/commit.txt). Submit: vessl run create -f scripts/vessl_931_post_cv15.yaml"
tags: [rfx, issue-931, post, cv15, openems, patch]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== rfx #931 POST-change: cv15 (feat/931-crossval-C) ==="
  date
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  WORK=/root/workspace/byungkwan-workspace/research/rfx-931-XC-crossvalC
  test -d "$WORK" || { echo "ERROR: worktree missing at $WORK"; exit 3; }
  RUNS=/root/workspace/claude-workspace/rfx/runs
  OUT=$RUNS/issue931-post-cv15-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > "$RUNS/issue931-post-cv15.latest"
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  { git -C "$WORK" log -1 --format="worktree $WORK @ %H (%D) %s" 2>/dev/null || echo "worktree $WORK (git metadata unavailable)"; } | tee "$OUT/commit.txt"
  cd "$WORK"
  touch "$OUT/.tstamp"
  cp -p validation/crossval/_15_patch_results/rfx.json "$OUT/rfx_before.json"
  "$PY" -c "from openEMS.openEMS import openEMS; print('openEMS from image: OK')"
  "$PY" -m pip uninstall -y -q jax-cuda12-plugin jax-cuda12-pjrt 2>/dev/null || true
  "$PY" -m pip install -q "jax[cpu]==0.6.2" "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7"
  export RFX_REPO_ROOT="$WORK"
  export PYTHONPATH="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, os; print('probe ok | jax', jax.__version__, '| backend', jax.default_backend(), '| rfx', getattr(rfx, '__version__', '?'), '| from', os.path.dirname(rfx.__file__))"
  echo "=== step cv15_rfx (sheet ground + sheet patch, full-span feed) ==="
  set +e
  timeout 7200 "$PY" -u validation/crossval/15_patch_antenna_rt5880.py rfx --num-periods 45.0 --gain > "$OUT/cv15_rfx.log" 2>&1
  rc=$?
  set -e
  echo "$rc" > "$OUT/cv15_rfx.rc"
  tail -n 60 "$OUT/cv15_rfx.log" || true
  echo "cv15_rfx_rc=$rc"
  echo "=== step cv15_compare ==="
  set +e
  timeout 1800 "$PY" -u validation/crossval/15_patch_antenna_rt5880.py compare > "$OUT/cv15_compare.log" 2>&1
  rc2=$?
  set -e
  echo "$rc2" > "$OUT/cv15_compare.rc"
  tail -n 60 "$OUT/cv15_compare.log" || true
  echo "cv15_compare_rc=$rc2"
  echo "=== before/after, the four fields the manifest clause needs ==="
  set +e
  "$PY" -u scripts/diagnostics/cv15_before_after_931.py --after "$OUT/rfx_before.json" > "$OUT/cv15_before_after_sanity.txt" 2>&1
  "$PY" -u scripts/diagnostics/cv15_before_after_931.py > "$OUT/cv15_before_after.txt" 2>&1
  set -e
  cat "$OUT/cv15_before_after.txt" || true

  echo "=== harvest: every file the run wrote into the worktree ==="
  mkdir -p "$OUT/produced"
  find "$WORK" -type f -newer "$OUT/.tstamp" \
      -not -path "*/.git/*" -not -path "*/__pycache__/*" -not -name "*.pyc" \
      > "$OUT/produced_files.txt" 2>/dev/null || true
  while IFS= read -r f; do
    rel=${f#$WORK/}
    d=$(dirname "$rel")
    mkdir -p "$OUT/produced/$d"
    cp -p "$f" "$OUT/produced/$rel" 2>/dev/null || true
  done < "$OUT/produced_files.txt"
  echo "harvested $(wc -l < "$OUT/produced_files.txt") file(s)"
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "POST_CASE=cv15 RC=$rc COMPARE_RC=$rc2"
  exit "$rc"
