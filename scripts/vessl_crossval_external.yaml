name: rfx-crossval-external
description: "W2.5(c) on-demand external-crossval lane: cv05 vs a real openEMS source build + cv11 vs committed Meep/Palace references (CPU node, remilab-c0 lab cluster). No fixed cadence -- run per release tag and whenever the cv05/cv11 physics paths change; free on the lab cluster, so submit as needed: vessl run create -f scripts/vessl_crossval_external.yaml"
tags: [rfx, crossval-external, ci-trust, w25]
resources:
  cluster: remilab-c0
  cpu: 32
  memory: 48Gi
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eux
  # pytorch runtime image: dash shell (no bashisms) and git via apt below.
  echo "=== rfx monthly external crossval (W2.5c) ==="
  date

  # -- SOLVER ENVIRONMENT NOW COMES FROM THE IMAGE (image: swap, 5b423bdfe0c8):
  # this lane used to apt-get install build deps and source-build
  # openEMS-Project on every run (~30-60 min). That block is gone -- the
  # image (docker/openems-lane/Dockerfile, built by
  # .github/workflows/build-openems-image.yml, published to
  # ghcr.io/bk-squared/rfx-openems) already contains openEMS-Project
  # (pinned to the Dockerfile's OPENEMS_COMMIT) built and its python
  # bindings installed against the image's conda python. Motivation:
  # 2026-08-04, archive.ubuntu.com was unreachable from this cluster and
  # killed 4 provisioning attempts across this lane's siblings before any
  # physics ran. rfx's OWN deps (jax etc, below) are unaffected -- the
  # image is the solver environment only, not the rfx environment.
  # ONE-LINE REVERT: `git show <this-commit>^:scripts/vessl_crossval_external.yaml
  # > scripts/vessl_crossval_external.yaml` restores the apt+build block
  # and the pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime image line in
  # one shot.
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" --version
  "$PY" -c "from openEMS.openEMS import openEMS; print('openEMS from image: OK')"

  # -- rfx runtime deps (CPU jax) --
  cd /root/workspace/byungkwan-workspace/research/rfx
  git config --global --add safe.directory /root/workspace/byungkwan-workspace/research/rfx || true
  git rev-parse HEAD || true
  "$PY" -m pip install -q "jax[cpu]==0.6.2" "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7"
  export RFX_REPO_ROOT=/root/workspace/byungkwan-workspace/research/rfx
  export PYTHONPATH="$RFX_REPO_ROOT"
  "$PY" -c "import jax, rfx; print('probe ok', jax.__version__)"

  out=".omx/crossval-external/$(date -u +%Y%m%dT%H%M%SZ)"
  mkdir -p "$out"

  # -- cv05: patch antenna vs openEMS (exit 0 full pass / 1 fail / 2 ref-missing) --
  set +e
  timeout 7200 "$PY" validation/crossval/05_patch_antenna.py \
    > "$out/cv05.log" 2>&1
  cv05_rc=$?
  set -e
  echo "$cv05_rc" > "$out/cv05.rc"
  tail -n 15 "$out/cv05.log" || true
  echo "cv05_rc=$cv05_rc"

  # -- cv11: WR-90 vs committed Meep/Palace references --
  set +e
  timeout 3600 "$PY" validation/crossval/11_waveguide_port_wr90.py \
    > "$out/cv11.log" 2>&1
  cv11_rc=$?
  set -e
  echo "$cv11_rc" > "$out/cv11.rc"
  tail -n 15 "$out/cv11.log" || true
  echo "cv11_rc=$cv11_rc"

  echo "=== verdict (per-script exit contracts come from crossval manifest) ==="
  echo "cv05_rc=$cv05_rc cv11_rc=$cv11_rc"
  fail=0
  case "$cv05_rc" in
    0) ;;
    2) echo "WARNING: cv05 reference missing despite source build — inconclusive" ;;
    *) echo "ERROR: cv05 failed with exit $cv05_rc"; fail=1 ;;
  esac
  # cv11's external tables are optional and its manifest contract is 0/1 only;
  # exit 2 would therefore be an undeclared script error, not a valid skip.
  case "$cv11_rc" in
    0) ;;
    *) echo "ERROR: cv11 failed with exit $cv11_rc"; fail=1 ;;
  esac
  exit "$fail"
