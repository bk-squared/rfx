name: rfx-sheen-smoothed-ladder-openems
description: "The Sheen stepped-impedance low-pass filter: has openEMS's own smoothed-mesh answer converged? Two 2.413 mm wide 50 ohm microstrip feeds on 0.794 mm of lossless RT/Duroid (eps_r 2.2) are joined by one wide 20.320 x 2.540 mm low-impedance section whose transverse resonance puts a double transmission zero near 7 and 8 GHz into |S21|. openEMS on rfx's node-snapped uniform lattices reads the 8 GHz zero at 8.195 / 8.224 / 8.186 / 8.206 GHz at h/3, h/5, h/7, h/12 (VESSL 369367263706, 369367263704) -- flat; openEMS on its own smoothed mesh, the frozen reference record, reads 7.994 / 8.020 / 8.038 GHz at 198.5 / 140.4 / 99.25 um -- still rising, by 0.33 then 0.22 percent a rung. The 7 GHz zero agrees between the two meshings to 0.006 percent; the 8 GHz zero and the -3 dB corner split by 2.1 and 1.6 percent. This job continues the smoothed-mesh ladder with the maker's own builder, unchanged, at more resolution factors (1.0 = the record's coarse rung, 198.5 um in plane and 4 substrate cells; the factor scales both). It solves the B2 box of the box probe -- the record's 3 mm transverse clearance with PML_8 on the two y faces in place of MUR -- because that box rings down to its energy criterion (B2 reached -43.5 dB in 8251 steps at factor 1, VESSL 369367263565) where the record's MUR box sits flat at about -31 dB and never does; moving or changing that wall moved the 8 GHz zero by 0.24-0.33 percent at factor 1. Every pass must end on its 1e-4 (-40 dB) energy criterion under a 400000-step ceiling; truncation is REFUSED, so a pass that reaches the ceiling fires the shared runner's gate and leaves no number. Per factor it prints the realized mesh (x/y/z lines, substrate cells, cells), the box energy and step count the pass ended at, the 7 and 8 GHz zeros (the |S21| minimum in 6.5-7.6 and in 7.6-9.5 GHz), the -3 dB corner and the passband mean, then a ladder table with the step-to-step change. CONTROL: a job that solves B2 at factor 1.0 must reproduce its 8.01582 GHz of VESSL 369367263565 within 0.01 percent or the job exits 1. STAGE A IS NOT RUN: the reproduce gate passed in VESSL 369367263406/407/408, which made the frozen record. THIS IS A DIAGNOSTIC: it writes nothing under tests/crossval/sheen_lpf/reference/ and commits no record. Env: EXPECT (the commit, placeholder FILL_BEFORE_SUBMIT refuses), CONFIGS, RESOLUTION_FACTORS, REAL_NRTS, REAL_END_CRITERIA, THREADS. CPU lane, remilab-c0. Submit with scripts/vessl_submit.sh so the run id is recorded."
tags: [rfx, crossval, sheen-lpf, box-probe, mesh-ladder, openems, diagnostic, one-off]
resources:
  cluster: remilab-c0
  cpu: 8
  memory: 16Gi
# The image is pinned by DIGEST, not by the tag 5b423bdfe0c8: one remilab-c0 node
# caches an older build under that tag with no RFX_OPENEMS_COMMIT stamp, and a job
# landing there refuses in its first second (VESSL 369367263390, 703, 705). The
# digest is the registry's current build of the tag (created 2026-09-21T17:45Z,
# RFX_OPENEMS_COMMIT=5b423bdfe0c84064cf9028167bb759007c33b182); run 706 pulled it
# onto that node and passed.
image: ghcr.io/bk-squared/rfx-openems@sha256:ea8df42dbf1bdcbc93479cfe0618c33695dc5266363b4873d392d10f813264ff
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  # OMP_NUM_THREADS=1: openEMS's own numThreads (passed explicitly as
  # --threads below, matching resources.cpu) does the parallelism.
  OMP_NUM_THREADS: "1"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  MPLBACKEND: "Agg"
  # REQUIRED. The commit this job measures. A clone whose HEAD does not start
  # with this string exits 3 rather than measuring the wrong tree; the
  # placeholder refuses too.
  EXPECT: "FILL_BEFORE_SUBMIT"
  # Keep equal to `image:` above; the run block prints both beside the openEMS
  # build commit the image stamps into RFX_OPENEMS_COMMIT.
  RFX_OPENEMS_IMAGE: "ghcr.io/bk-squared/rfx-openems@sha256:ea8df42dbf1bdcbc93479cfe0618c33695dc5266363b4873d392d10f813264ff"
  # B2: the record's 3 mm clearance with PML_8 on the y faces. It ends on its
  # energy criterion; the record's MUR box (B0) never does.
  CONFIGS: "B2"
  # Mesh factors on the maker's own resolution, solved in this order.
  # 1.0, 1/sqrt2 and 1/2 are the frozen record's three rungs (198.5 / 140.4 /
  # 99.25 um); 1/(2 sqrt2) = 70.2 um is the next one. 1.0 carries the control.
  # Dry-run estimate: 10.7 M cells at the last factor, 1.45 h for the plan at
  # three times B2's measured ring-down time.
  RESOLUTION_FACTORS: "1.0,0.7071067811865476,0.5,0.35355339059327373"
  # A CEILING, not a record length: the probe runs with --refuse-truncation, so
  # a pass that reaches it fires the gate. -40 dB is the repository's ring-down
  # level (1e-4 of the peak box energy).
  REAL_NRTS: "400000"
  REAL_END_CRITERIA: "1e-4"
  THREADS: "8"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== The Sheen low-pass filter: openEMS smoothed-mesh ladder ==="
  date

  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" --version
  if [ -z "${RFX_OPENEMS_COMMIT:-}" ]; then
    echo "FATAL: RFX_OPENEMS_COMMIT is empty -- this image does not stamp its openEMS build, so no number could name the solver that produced it. Refusing to measure."
    exit 3
  fi
  echo "RFX_OPENEMS_COMMIT=$RFX_OPENEMS_COMMIT"
  echo "RFX_OPENEMS_IMAGE=${RFX_OPENEMS_IMAGE:-unset}"
  "$PY" -c "from openEMS.openEMS import openEMS; print('openEMS from image: OK')"
  "$PY" -c "from CSXCAD.CSXCAD import ContinuousStructure; from openEMS.ports import MSLPort; print('CSXCAD + MSLPort: OK')"

  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }

  if [ "$EXPECT" = "FILL_BEFORE_SUBMIT" ]; then
    echo "FATAL: EXPECT still holds the FILL_BEFORE_SUBMIT placeholder -- pin the commit before submitting"
    exit 3
  fi

  SRC=/tmp/rfx-sheen-box-probe
  rm -rf "$SRC"
  # Clone the DEFAULT branch and fetch the pinned commit by its sha. Naming the
  # topic branch here would make the job die once that branch is merged and
  # deleted, which is exactly when someone wants to re-run the probe.
  git clone -q https://github.com/bk-squared/rfx.git "$SRC"
  git config --global --add safe.directory "$SRC" || true
  git -C "$SRC" fetch -q origin "$EXPECT"
  git -C "$SRC" checkout -q "$EXPECT"
  sha=$(git -C "$SRC" rev-parse HEAD)
  short=$(git -C "$SRC" rev-parse --short HEAD)
  case "$sha" in
    "$EXPECT"*) echo "provenance: $sha (matches EXPECT=$EXPECT)" ;;
    *) echo "WRONG TREE: clone HEAD is $sha, EXPECT is $EXPECT -- refusing to measure"; exit 3 ;;
  esac
  cd "$SRC"
  export RFX_REPO_ROOT="$SRC"
  git status --short || true

  if ! "$PY" -c "import numpy, h5py" >/dev/null 2>&1; then
    "$PY" -m pip install -q "numpy<2" "h5py>=3.8"
  fi
  "$PY" -c "import numpy; print('numpy', numpy.__version__)"
  "$PY" -c "import matplotlib" >/dev/null 2>&1 || "$PY" -m pip install -q "matplotlib>=3.7"

  primary=/root/workspace/byungkwan-workspace/research/rfx
  FTAG=$(echo "$RESOLUTION_FACTORS" | tr ',.' '-p')
  out="$primary/.omx/sheen-smoothed-ladder-openems/$(date -u +%Y%m%dT%H%M%SZ)-$short-$FTAG"
  mkdir -p "$out"
  echo "$sha" > "$out/commit.txt"
  echo "artifacts: $out"

  trap 'st=$?; rc_now=${rc:-$st}; echo "$rc_now" > "$out/exit_code"; { echo "sheen_smoothed_ladder_openems_rc=$rc_now"; echo "commit=$sha"; echo "image=${RFX_OPENEMS_IMAGE:-unset}"; echo "openems_build=$RFX_OPENEMS_COMMIT"; echo "configs=$CONFIGS"; echo "resolution_factors=$RESOLUTION_FACTORS"; echo "json=$out/sheen_box_probe_openems_ladder.json"; echo "figure=$out/sheen_box_probe_openems_ladder.png"; ls -la "$out"; } > "$out/summary.txt" 2>&1; cat "$out/summary.txt"' EXIT INT TERM

  DRV=scripts/diagnostics/sheen_box_probe/openems_box_probe.py
  test -f "$DRV" || { echo "STALE CLONE: the probe is missing at $DRV"; exit 3; }
  MAKER=tests/crossval/sheen_lpf/reference/make_openems_reference.py
  test -f "$MAKER" || { echo "STALE CLONE: the reference maker is missing at $MAKER"; exit 3; }
  GATE=tests/crossval/_openems_tutorial_gate.py
  test -f "$GATE" || { echo "STALE CLONE: the shared tutorial gate is missing at $GATE"; exit 3; }

  # Pure-numpy first, seconds: the dry run prints the plan, the boundary and
  # the mesh each factor would set, and the cost estimate. POSIX rc capture
  # across a pipe -- ${PIPESTATUS[0]} is a bashism and the VESSL runner shell
  # is not bash, so the left side runs in a subshell that writes its own rc.
  ( set +e; "$PY" -u "$DRV" --dry-run --configs "$CONFIGS" --resolution-factors "$RESOLUTION_FACTORS" --refuse-truncation --real-nrts "$REAL_NRTS" --real-end-criteria "$REAL_END_CRITERIA"; echo $? > "$out/dry_run.rc" ) | tee "$out/dry_run.log"
  dr_rc=$(cat "$out/dry_run.rc")
  if [ "$dr_rc" != "0" ]; then
    echo "FATAL: --dry-run exited $dr_rc -- see $out/dry_run.log. Not starting the solver."
    exit 3
  fi

  echo "=== solve ==="
  ( set +e
    timeout 21600 "$PY" -u "$DRV" --configs "$CONFIGS" \
      --resolution-factors "$RESOLUTION_FACTORS" --refuse-truncation \
      --real-nrts "$REAL_NRTS" --real-end-criteria "$REAL_END_CRITERIA" \
      --sim-root /tmp/sheen_box_probe_openems --threads "$THREADS" \
      --out "$out" 2>&1
    echo $? > "$out/exit_code"
  ) | tee "$out/probe.log"
  rc=$(cat "$out/exit_code")
  echo "sheen_smoothed_ladder_openems_rc=$rc"

  # The solver's stdout is the only place the timestep, the energy trace and
  # openEMS's own warnings exist, and /tmp goes away with the pod.
  echo "===== persisting the solver logs ====="
  for d in /tmp/sheen_box_probe_openems/*/; do
    [ -d "$d" ] || continue
    stage=$(basename "$d")
    src="${d}_openems_stdout.log"
    if [ -f "$src" ]; then
      case "$stage" in
        *_smoke) dest="$out/${stage%_smoke}_smoke_openems_stdout.log" ;;
        *)       dest="$out/${stage}_real_openems_stdout.log" ;;
      esac
      cp "$src" "$dest" && echo "  $src -> $dest ($(wc -c < "$dest") bytes)"
    else
      echo "  (no log at $src)"
    fi
  done
  ls -la "$out"/*_openems_stdout.log 2>/dev/null || echo "  (no solver logs were persisted)"

  # Settling positive control, as a CHECK. openEMS's own max-timesteps warning
  # must appear in EVERY smoke pass's log (200 steps at EndCriteria 0.0 can
  # never converge), which is what shows the phrase the truncation gate greps
  # for is still the phrase openEMS prints -- and in NO real pass's: truncation
  # is refused here, so a real pass must end on its own energy criterion.
  echo "===== settling positive control ====="
  PHRASE="reached before the end-criteria of"
  settling_rc=0
  smoke_logs=$(find /tmp/sheen_box_probe_openems -name "_openems_stdout.log" -path "*_smoke/*" 2>/dev/null || true)
  real_logs=$(find /tmp/sheen_box_probe_openems -name "_openems_stdout.log" -not -path "*_smoke/*" 2>/dev/null || true)
  if [ -z "$smoke_logs" ]; then
    echo "SETTLING CONTROL: no smoke-pass log found -- the control cannot speak"
    settling_rc=4
  fi
  for f in $smoke_logs; do
    if grep -q "$PHRASE" "$f"; then
      echo "  ok   smoke   $f carries the max-timesteps warning"
    else
      echo "  RED  smoke   $f does NOT carry it -- a 200-step pass that reported convergence means the phrase this gate greps for has changed"
      settling_rc=4
    fi
  done
  for f in $real_logs; do
    if grep -q "$PHRASE" "$f"; then
      echo "  RED  real    $f carries the max-timesteps warning -- that pass stopped at its ceiling, not on its energy criterion"
      settling_rc=4
    else
      echo "  ok   real    $f ended on its energy criterion"
    fi
  done
  echo "settling_positive_control_rc=$settling_rc"
  echo "$settling_rc" > "$out/settling_control.rc"

  echo "=== summary ==="
  sed -n '/READING 1/,$p' "$out/probe.log" | head -n 60 || true
  ls -la "$out"

  # Evidence first: the json and the figure are already written. Only now does
  # the settling control get to change the verdict.
  if [ "$rc" = "0" ] && [ "$settling_rc" != "0" ]; then
    echo "SETTLING POSITIVE CONTROL FAILED: the passes ran and the numbers were written, but the control did not hold, so no number in them has a supported end of record."
    rc=4
  fi

  echo "=== verdict ==="
  case "$rc" in
    0) echo "RAN: every requested (config, factor) ended on its energy criterion and its numbers are in $out/sheen_box_probe_openems_ladder.json. If this job carried B2 at factor 1.0, its CONTROL line above passed; if it did not, read it against a job that did." ;;
    1) echo "A PASS WAS REFUSED OR THE CONTROL FAILED: a shared sanity gate fired (a pass that reached its step ceiling, unused primitives, an off-mesh port, no excitation energy, a non-finite |S| or a passivity excess), or B2 at factor 1.0 did not reproduce 8.01582 GHz. The log names which." ;;
    2) echo "openEMS NOT IMPORTABLE despite the image probes passing -- investigate the bindings" ;;
    3) echo "CONFIG ERROR: a missing solver stamp, a wrong tree, an unknown config id or a failed dry run -- not a physics finding" ;;
    4) echo "SETTLING POSITIVE CONTROL FAILED: read $out/settling_control.rc and the per-log lines above. The numbers exist; their record-length statements do not stand up." ;;
    124) echo "TIMEOUT: the 21600 s budget was exhausted -- report the wall clock, do NOT drop a factor or cap the record to fit" ;;
    *) echo "ERROR: unexpected exit code $rc" ;;
  esac
  exit "$rc"
