name: rfx-sheen-box-probe-rfx
description: "The Sheen stepped-impedance low-pass filter: does the transverse domain wall reach the stopband, on the rfx side? Two 2.413 mm wide 50 ohm microstrip feeds on 0.794 mm of lossless RT/Duroid (eps_r 2.2) are joined by one wide 20.320 x 2.540 mm low-impedance section. The section is a shunt capacitance, so |S21| is flat to about 5.5 GHz and then falls into a stopband whose transmission zeros near 7 and 8 GHz come from the transverse resonance of that wide section -- they are set by the field at its two transverse (y) edges, and the case's domain wall sits 3.0 mm, 3.8 substrate thicknesses, beyond each of those edges. rfx's converged ladder puts the deepest 5-10 GHz minimum at 8.29750 GHz (h/7) and 8.29781 GHz (h/12), 3.2 percent above the openEMS record's 8.0379 GHz and Palace's 8.0482 GHz, with the same curve shape stretched up in frequency across the band. ASSUMPTION this job measures, and it is an assumption: that the wall at 3.8 h from the section's edges enters those features at all. This job decides nothing about it. It solves ONE mesh rung (default dx = h/7 = 113.429 um) in five boxes -- A0 the control at Y_CLEAR 3 mm / Z_AIR 3 mm / CPML_LAYERS 8, A1 at Y_CLEAR 6 mm, A2 at Y_CLEAR 12 mm, A3 with the absorber twice as thick at the same clearance, A4 with Z_AIR 6 mm -- and prints, per box, the realized domain and grid, the realized distance from the section's rasterized y edges to the absorber's inner face read from the grid, the deepest 5-10 GHz |S21| minimum with its depth, the -3 dB corner, the passband mean, the ring-down settling and the passivity excess the case's own run_rung measures, the wall time and the cell count. Then the residual of each null against A0's and the max |S21| difference in dB against A0 and against the frozen openEMS stage_b_fine record over 2-12 GHz where both curves are above -20 dB, plus one figure. THE CONTROL IS THE FALSIFIER: A0 at h/7 must reproduce the ladder's 8.29750 GHz, because it is the same code on the same rung; a control that does not reproduce stops the reading. THIS IS A PROBE, NOT A CASE. It runs no reproduce gate, it writes nothing under tests/crossval/sheen_lpf/reference/, it commits no record and it asserts no threshold of its own -- the only assertions are the case's own realized-board, -40 dB ring-down and passivity checks, which still stop a bad box. The probe imports the case module by path and re-derives its y-derived and z-derived globals per box; the script's --dry-run prints every box from the constants with no solver, and its --mutate-skip-patch check shows that a box printed without the patch falls back to the control's. Env: RFX_GPU_SUITE_REF (the branch or ref this job measures), EXPECT (the commit, placeholder FILL_BEFORE_SUBMIT refuses), DX (cell size in metres, exact literal), CONFIGS. GPU lane, remilab-c0."
tags: [rfx, crossval, sheen-lpf, box-probe, diagnostic, one-off]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  MPLBACKEND: "Agg"
  # The ref the working tree is exported from, as scripts/vessl_gpu_suite.yaml
  # does it: git archive of a ref, not a checkout of the shared clone.
  RFX_GPU_SUITE_REF: "origin/crossval/sheen-lpf-test"
  # REQUIRED. The commit this job measures. A tree whose HEAD does not start
  # with this string exits 3 rather than measuring the wrong one; the
  # placeholder refuses too.
  EXPECT: "FILL_BEFORE_SUBMIT"
  # The rung, in metres, as an EXACT literal. h_sub/7 = 0.794e-3/7. A rounded
  # dx puts the substrate top off the node plane and the case refuses the
  # board, which is the check working, not a failure to work around.
  DX: "1.1342857142857143e-4"
  CONFIGS: "A0,A1,A2,A3,A4"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== The Sheen low-pass filter: rfx box probe ==="
  date
  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }

  if [ "$EXPECT" = "FILL_BEFORE_SUBMIT" ]; then
    echo "FATAL: EXPECT still holds the FILL_BEFORE_SUBMIT placeholder -- pin the commit before submitting"
    exit 3
  fi

  primary=/root/workspace/byungkwan-workspace/research/rfx
  cd "$primary"
  git config --global --add safe.directory "$primary" || true
  git fetch -q origin
  ref="${RFX_GPU_SUITE_REF:-origin/main}"
  sha=$(git rev-parse "$ref")
  short=$(git rev-parse --short "$ref")
  echo "probe ref: $ref = $sha"
  case "$sha" in
    "$EXPECT"*) echo "provenance: $sha (matches EXPECT=$EXPECT)" ;;
    *) echo "WRONG TREE: $ref is $sha, EXPECT is $EXPECT -- refusing to measure"; exit 3 ;;
  esac

  src="/tmp/rfx-sheen-box-probe-$short"
  rm -rf "$src" && mkdir -p "$src"
  git archive --format=tar "$sha" | tar -xf - -C "$src"
  python -m pip install -q "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7"
  export RFX_REPO_ROOT="$src"
  export PYTHONPATH="$RFX_REPO_ROOT:${PYTHONPATH:-}"
  cd "$src"
  python -c "import jax, rfx; print('probe ok | jax', jax.__version__, '| devices', jax.devices(), '| rfx', getattr(rfx, '__version__', '?'))"

  out="$primary/.omx/sheen-box-probe/$(date -u +%Y%m%dT%H%M%SZ)-$short"
  mkdir -p "$out"
  echo "$sha" > "$out/commit.txt"
  export RFX_CROSSVAL_FIG_DIR="$out"
  echo "artifacts: $out"

  # A killed, evicted or timed-out job still leaves its exit code and a
  # one-line summary. `rc` is unset until the probe runs, hence the default.
  trap 'st=$?; rc_now=${rc:-$st}; echo "$rc_now" > "$out/exit_code"; { echo "sheen_box_probe_rfx_rc=$rc_now"; echo "commit=$sha"; echo "dx=$DX"; echo "configs=$CONFIGS"; echo "json=$out/sheen_box_probe_rfx.json"; echo "figure=$out/sheen_box_probe_rfx.png"; ls -la "$out"; } > "$out/summary.txt" 2>&1; cat "$out/summary.txt"' EXIT INT TERM

  DRV=scripts/diagnostics/sheen_box_probe/rfx_box_probe.py
  test -f "$DRV" || { echo "STALE TREE: the probe is missing at $DRV"; exit 3; }
  CASE=tests/crossval/sheen_lpf/test_sheen_lpf.py
  test -f "$CASE" || { echo "STALE TREE: the Sheen case is missing at $CASE"; exit 3; }

  # The dry run costs seconds and states every box from the constants. A layout
  # bug or a config typo must not burn a GPU hour. POSIX rc capture across a
  # pipe: ${PIPESTATUS[0]} is a bashism and the VESSL runner shell is not bash,
  # so the left side runs in a subshell that writes its own rc to a file.
  ( set +e; python -u "$DRV" --dry-run --dx "$DX" --configs "$CONFIGS"; echo $? > "$out/dry_run.rc" ) | tee "$out/dry_run.log"
  dr_rc=$(cat "$out/dry_run.rc")
  if [ "$dr_rc" != "0" ]; then
    echo "FATAL: --dry-run exited $dr_rc -- see $out/dry_run.log. Not starting the solver."
    exit 3
  fi

  echo "=== solve ==="
  ( set +e
    timeout 3600 python -u "$DRV" --dx "$DX" --configs "$CONFIGS" --out "$out" 2>&1
    echo $? > "$out/exit_code"
  ) | tee "$out/probe.log"
  rc=$(cat "$out/exit_code")
  echo "sheen_box_probe_rfx_rc=$rc"

  echo "=== summary ==="
  sed -n '/READING 1/,$p' "$out/probe.log" | head -n 80 || true
  ls -la "$out"

  echo "=== verdict ==="
  case "$rc" in
    0) echo "RAN: every requested box solved and its numbers are in $out/sheen_box_probe_rfx.json. Check A0 against the ladder's own null for this rung BEFORE reading any residual: a control that does not reproduce stops the reading." ;;
    1) echo "A BOX WAS REFUSED: the case's own realized-board, ring-down or passivity check fired, or the probe raised. The log names which; no number from that box is usable." ;;
    3) echo "CONFIG ERROR: a wrong tree, an unknown config id or a failed dry run -- not a physics finding" ;;
    124) echo "TIMEOUT: the 3600 s budget was exhausted -- report the wall clock, do NOT drop a box or coarsen the rung to fit" ;;
    *) echo "ERROR: unexpected exit code $rc" ;;
  esac
  exit "$rc"
