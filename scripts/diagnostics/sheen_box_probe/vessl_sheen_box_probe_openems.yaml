name: rfx-sheen-box-probe-openems
description: "The Sheen stepped-impedance low-pass filter: does the transverse domain wall reach the stopband, on the openEMS side? Two 2.413 mm wide 50 ohm microstrip feeds on 0.794 mm of lossless RT/Duroid (eps_r 2.2) are joined by one wide 20.320 x 2.540 mm low-impedance section. The section is a shunt capacitance, so |S21| is flat to about 5.5 GHz and then falls into a stopband whose transmission zeros near 7 and 8 GHz come from the transverse resonance of that wide section -- they are set by the field at its two transverse (y) edges, and the reference's domain wall sits 3.0 mm, 3.8 substrate thicknesses, beyond each of those edges. The frozen record puts the deepest 5-10 GHz minimum at 7.9939 GHz on its coarse rung and 8.0379 GHz on its fine rung, still rising 0.2 percent per refinement, while its box energy sits flat at about -31 dB from 10 to 20 ns and meets no end criterion -- which is why the record is a declared 10 ns length. The two transverse faces of that box are MUR; the maker's boundary list is PML_8 PML_8 MUR MUR PEC MUR, absorbing on the two x faces only. A first-order Mur wall is written for a wave arriving along the wall normal, and the substrate carries its field along the board, across that wall at a grazing angle. ASSUMPTION this job measures, and it is an assumption: that the transverse wall enters the record's stopband features at all. This job decides nothing about it, and nothing about what the -31 dB plateau is made of. It solves the record's own coarse rung (resolution_factor 1.0 = 198.5 um, about 417,000 cells, 232 s per 60,000 steps in the reference job) in four boxes -- B0 the control at Y_CLEAR 3 mm with MUR y faces, B1 at Y_CLEAR 12 mm with MUR, B2 at Y_CLEAR 3 mm with PML_8 y faces, B3 with both -- the same way the reference ran them (--real-nrts 60000, --real-end-criteria 1e-4, truncation accepted), and prints per box the realized mesh, the box energy openEMS reported at the end of the record with its whole progress trace, the deepest 5-10 GHz minimum, the passband mean and the -3 dB corner through the maker's own estimator, and the wall time; then the residual of each null against B0's, the max |S21| difference in dB against B0 over 2-12 GHz where both curves are above -20 dB, and one figure. THE CONTROL IS THE FALSIFIER: B0 must reproduce the frozen record's stage_b_coarse null of 7.99387 GHz, whose Stage A run-to-run spread is 1e-5; a control that does not reproduce stops the reading. STAGE A IS NOT RUN HERE. The reproduce gate -- openEMS's own MSL_NotchFilter tutorial, verbatim, judged against the analytic quarter-wave frequency -- passed in the three jobs that produced the frozen record: VESSL 369367263406, 369367263407 and 369367263408. THIS IS A PROBE, NOT A REFERENCE. It writes nothing under tests/crossval/sheen_lpf/reference/, commits no record and gates nothing of its own; every per-run sanity gate the shared runner applies is kept, so a box with unused primitives, off-mesh ports, no excitation energy, a non-finite |S| or a passivity excess still fires and produces no number. The probe imports the reference maker by path and leaves it unedited: it re-derives the maker's y-derived globals per box, and for the PML boxes it hands the maker's own builder a subclass of the runner's openEMS class whose SetBoundaryCond substitutes this box's list, because that list is a literal inside the builder. The script's --dry-run proves the substitution with stub openEMS and CSXCAD classes and needs no solver; its --mutate-skip-boundary-override check shows that a box printed without the wrapper falls back to MUR. Env: EXPECT (the commit, placeholder FILL_BEFORE_SUBMIT refuses), CONFIGS, REAL_NRTS, REAL_END_CRITERIA, THREADS. CPU lane, remilab-c0. Submit with scripts/vessl_submit.sh so the run id is recorded -- VESSL does not export it into the pod."
tags: [rfx, crossval, sheen-lpf, box-probe, openems, diagnostic, one-off]
resources:
  cluster: remilab-c0
  cpu: 8
  memory: 16Gi
# The image is pinned by DIGEST, not by the tag 5b423bdfe0c8: one remilab-c0 node
# caches an older build under that tag with no RFX_OPENEMS_COMMIT stamp, and a job
# landing there refuses in its first second (VESSL 369367263390, 703, 705). The
# digest is the registry's current build of the tag (created 2026-09-21T17:45Z,
# RFX_OPENEMS_COMMIT=5b423bdfe0c84064cf9028167bb759007c33b182); run 706 pulled it
# onto that node and passed.
image: ghcr.io/bk-squared/rfx-openems@sha256:ea8df42dbf1bdcbc93479cfe0618c33695dc5266363b4873d392d10f813264ff
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  # OMP_NUM_THREADS=1: openEMS's own numThreads (passed explicitly as
  # --threads below, matching resources.cpu) does the parallelism.
  OMP_NUM_THREADS: "1"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  MPLBACKEND: "Agg"
  # REQUIRED. The commit this job measures. A clone whose HEAD does not start
  # with this string exits 3 rather than measuring the wrong tree; the
  # placeholder refuses too.
  EXPECT: "FILL_BEFORE_SUBMIT"
  # Keep equal to `image:` above; the run block prints both beside the openEMS
  # build commit the image stamps into RFX_OPENEMS_COMMIT.
  RFX_OPENEMS_IMAGE: "ghcr.io/bk-squared/rfx-openems@sha256:ea8df42dbf1bdcbc93479cfe0618c33695dc5266363b4873d392d10f813264ff"
  # Which boxes this job solves. B0 is the control and every residual is read
  # against it, so a job that leaves it out reports no residual at all.
  CONFIGS: "B0,B1,B2,B3"
  # The record's own declared length and stop level. A step count is not a
  # record length -- dt shrinks with the cell -- but every box here is on the
  # SAME rung, so one N is one record length across the four.
  REAL_NRTS: "60000"
  REAL_END_CRITERIA: "1e-4"
  THREADS: "8"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== The Sheen low-pass filter: openEMS box probe ==="
  date

  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" --version
  if [ -z "${RFX_OPENEMS_COMMIT:-}" ]; then
    echo "FATAL: RFX_OPENEMS_COMMIT is empty -- this image does not stamp its openEMS build, so no number could name the solver that produced it. Refusing to measure."
    exit 3
  fi
  echo "RFX_OPENEMS_COMMIT=$RFX_OPENEMS_COMMIT"
  echo "RFX_OPENEMS_IMAGE=${RFX_OPENEMS_IMAGE:-unset}"
  "$PY" -c "from openEMS.openEMS import openEMS; print('openEMS from image: OK')"
  "$PY" -c "from CSXCAD.CSXCAD import ContinuousStructure; from openEMS.ports import MSLPort; print('CSXCAD + MSLPort: OK')"

  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }

  if [ "$EXPECT" = "FILL_BEFORE_SUBMIT" ]; then
    echo "FATAL: EXPECT still holds the FILL_BEFORE_SUBMIT placeholder -- pin the commit before submitting"
    exit 3
  fi

  SRC=/tmp/rfx-sheen-box-probe
  rm -rf "$SRC"
  # Clone the DEFAULT branch and fetch the pinned commit by its sha. Naming the
  # topic branch here would make the job die once that branch is merged and
  # deleted, which is exactly when someone wants to re-run the probe.
  git clone -q https://github.com/bk-squared/rfx.git "$SRC"
  git config --global --add safe.directory "$SRC" || true
  git -C "$SRC" fetch -q origin "$EXPECT"
  git -C "$SRC" checkout -q "$EXPECT"
  sha=$(git -C "$SRC" rev-parse HEAD)
  short=$(git -C "$SRC" rev-parse --short HEAD)
  case "$sha" in
    "$EXPECT"*) echo "provenance: $sha (matches EXPECT=$EXPECT)" ;;
    *) echo "WRONG TREE: clone HEAD is $sha, EXPECT is $EXPECT -- refusing to measure"; exit 3 ;;
  esac
  cd "$SRC"
  export RFX_REPO_ROOT="$SRC"
  git status --short || true

  if ! "$PY" -c "import numpy, h5py" >/dev/null 2>&1; then
    "$PY" -m pip install -q "numpy<2" "h5py>=3.8"
  fi
  "$PY" -c "import numpy; print('numpy', numpy.__version__)"
  "$PY" -c "import matplotlib" >/dev/null 2>&1 || "$PY" -m pip install -q "matplotlib>=3.7"

  primary=/root/workspace/byungkwan-workspace/research/rfx
  out="$primary/.omx/sheen-box-probe-openems/$(date -u +%Y%m%dT%H%M%SZ)-$short"
  mkdir -p "$out"
  echo "$sha" > "$out/commit.txt"
  echo "artifacts: $out"

  trap 'st=$?; rc_now=${rc:-$st}; echo "$rc_now" > "$out/exit_code"; { echo "sheen_box_probe_openems_rc=$rc_now"; echo "commit=$sha"; echo "image=${RFX_OPENEMS_IMAGE:-unset}"; echo "openems_build=$RFX_OPENEMS_COMMIT"; echo "configs=$CONFIGS"; echo "json=$out/sheen_box_probe_openems.json"; echo "figure=$out/sheen_box_probe_openems.png"; ls -la "$out"; } > "$out/summary.txt" 2>&1; cat "$out/summary.txt"' EXIT INT TERM

  DRV=scripts/diagnostics/sheen_box_probe/openems_box_probe.py
  test -f "$DRV" || { echo "STALE CLONE: the probe is missing at $DRV"; exit 3; }
  MAKER=tests/crossval/sheen_lpf/reference/make_openems_reference.py
  test -f "$MAKER" || { echo "STALE CLONE: the reference maker is missing at $MAKER"; exit 3; }
  GATE=tests/crossval/_openems_tutorial_gate.py
  test -f "$GATE" || { echo "STALE CLONE: the shared tutorial gate is missing at $GATE"; exit 3; }

  # Pure-numpy first, seconds: the dry run prints the boundary and the mesh
  # every box would set. A typo must not burn four solves. POSIX rc capture
  # across a pipe -- ${PIPESTATUS[0]} is a bashism and the VESSL runner shell
  # is not bash, so the left side runs in a subshell that writes its own rc.
  ( set +e; "$PY" -u "$DRV" --dry-run --configs "$CONFIGS" --real-nrts "$REAL_NRTS" --real-end-criteria "$REAL_END_CRITERIA"; echo $? > "$out/dry_run.rc" ) | tee "$out/dry_run.log"
  dr_rc=$(cat "$out/dry_run.rc")
  if [ "$dr_rc" != "0" ]; then
    echo "FATAL: --dry-run exited $dr_rc -- see $out/dry_run.log. Not starting the solver."
    exit 3
  fi

  echo "=== solve ==="
  ( set +e
    timeout 21600 "$PY" -u "$DRV" --configs "$CONFIGS" \
      --real-nrts "$REAL_NRTS" --real-end-criteria "$REAL_END_CRITERIA" \
      --sim-root /tmp/sheen_box_probe_openems --threads "$THREADS" \
      --out "$out" 2>&1
    echo $? > "$out/exit_code"
  ) | tee "$out/probe.log"
  rc=$(cat "$out/exit_code")
  echo "sheen_box_probe_openems_rc=$rc"

  # The solver's stdout is the only place the timestep, the energy trace and
  # openEMS's own warnings exist, and /tmp goes away with the pod.
  echo "===== persisting the solver logs ====="
  for d in /tmp/sheen_box_probe_openems/*/; do
    [ -d "$d" ] || continue
    stage=$(basename "$d")
    src="${d}_openems_stdout.log"
    if [ -f "$src" ]; then
      case "$stage" in
        *_smoke) dest="$out/${stage%_smoke}_smoke_openems_stdout.log" ;;
        *)       dest="$out/${stage}_real_openems_stdout.log" ;;
      esac
      cp "$src" "$dest" && echo "  $src -> $dest ($(wc -c < "$dest") bytes)"
    else
      echo "  (no log at $src)"
    fi
  done
  ls -la "$out"/*_openems_stdout.log 2>/dev/null || echo "  (no solver logs were persisted)"

  # Settling positive control, as a CHECK. openEMS's own max-timesteps warning
  # must appear in EVERY smoke pass's log (200 steps at EndCriteria 0.0 can
  # never converge), which is what shows the phrase the truncation gate greps
  # for is still the phrase openEMS prints. Every real pass here declares its
  # length with --real-nrts, so a real log that carries the warning stopped at
  # its cap as asked and one that does not decayed early -- shorter than
  # declared, not wrong. Only the smoke side can turn the verdict.
  echo "===== settling positive control ====="
  PHRASE="reached before the end-criteria of"
  settling_rc=0
  smoke_logs=$(find /tmp/sheen_box_probe_openems -name "_openems_stdout.log" -path "*_smoke/*" 2>/dev/null || true)
  real_logs=$(find /tmp/sheen_box_probe_openems -name "_openems_stdout.log" -not -path "*_smoke/*" 2>/dev/null || true)
  if [ -z "$smoke_logs" ]; then
    echo "SETTLING CONTROL: no smoke-pass log found -- the control cannot speak"
    settling_rc=4
  fi
  for f in $smoke_logs; do
    if grep -q "$PHRASE" "$f"; then
      echo "  ok   smoke   $f carries the max-timesteps warning"
    else
      echo "  RED  smoke   $f does NOT carry it -- a 200-step pass that reported convergence means the phrase this gate greps for has changed"
      settling_rc=4
    fi
  done
  for f in $real_logs; do
    if grep -q "$PHRASE" "$f"; then
      echo "  ok   real    $f was stopped by its declared cap, which is what the probe asked for"
    else
      echo "  note real    $f reached its end criterion BEFORE the cap -- that box's record is SHORTER than declared, not wrong. Read its record_length_steps_basis and record_length_s."
    fi
  done
  echo "settling_positive_control_rc=$settling_rc"
  echo "$settling_rc" > "$out/settling_control.rc"

  echo "=== summary ==="
  sed -n '/READING 1/,$p' "$out/probe.log" | head -n 60 || true
  ls -la "$out"

  # Evidence first: the json and the figure are already written. Only now does
  # the settling control get to change the verdict.
  if [ "$rc" = "0" ] && [ "$settling_rc" != "0" ]; then
    echo "SETTLING POSITIVE CONTROL FAILED: the boxes ran and the numbers were written, but the control did not hold, so no record-length statement in them is supported."
    rc=4
  fi

  echo "=== verdict ==="
  case "$rc" in
    0) echo "RAN: every requested box solved and its numbers are in $out/sheen_box_probe_openems.json. Check B0 against the frozen record's stage_b_coarse null of 7.99387 GHz BEFORE reading any residual: a control that does not reproduce stops the reading." ;;
    1) echo "A BOX WAS REFUSED: a shared sanity gate fired -- unused primitives, an off-mesh port, no excitation energy, a non-finite |S| or a passivity excess. The log names which; no number from that box is usable." ;;
    2) echo "openEMS NOT IMPORTABLE despite the image probes passing -- investigate the bindings" ;;
    3) echo "CONFIG ERROR: a missing solver stamp, a wrong tree, an unknown config id or a failed dry run -- not a physics finding" ;;
    4) echo "SETTLING POSITIVE CONTROL FAILED: read $out/settling_control.rc and the per-log lines above. The numbers exist; their record-length statements do not stand up." ;;
    124) echo "TIMEOUT: the 21600 s budget was exhausted -- report the wall clock, do NOT drop a box or shorten the record to fit" ;;
    *) echo "ERROR: unexpected exit code $rc" ;;
  esac
  exit "$rc"
