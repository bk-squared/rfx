name: rfx-sheen-identical-grid-openems-h12
description: "The Sheen stepped-impedance low-pass filter solved by openEMS on rfx's own lattice -- the h/12 rung alone (dx 66.167 um, 433 x 415 x 67 node lines, 11.8 M openEMS cells), in its own job because it is the one rung whose cost is not negligible. Estimate on 8 threads, from the dry run: openEMS's default timestep on this uniform cube is dx / (c sqrt 3) = 1.2743e-13 s; the box probe's B2 box (PML on x and y) rang down to -43.5 dB in 1.384 ns, which is 10862 steps here, 0.10-0.33 h at the measured 3.62e8 / 1.08e8 cell-steps per second of the frozen record's fine and coarse rungs; a 10 ns ring-down would be 78477 steps, 0.71-2.38 h. The job timeout is 6 h. Two 2.413 mm wide 50 ohm microstrip feeds on 0.794 mm of lossless RT/Duroid (eps_r 2.2) are joined by one wide 20.320 x 2.540 mm low-impedance section, and the section's transverse resonance puts a double transmission zero near 7 and 8 GHz into |S21|. Two FDTD codes that solve the same discrete structure -- the same cells, the same metal edges, the same substrate cells, the absorbers in the same places -- should put those zeros at the same frequencies. rfx's uniform ladder reads the upper zero at 8.38113 / 8.36112 / 8.29750 / 8.29781 GHz (h/3, h/5, h/7, h/12), openEMS on its own smoothed mesh reads 7.9939 / 8.0204 / 8.0379 GHz and Palace 8.0482 GHz; moving or changing the domain wall moved the zero by 0.18 percent in rfx and 0.24-0.33 percent in openEMS (VESSL 369367263565). This job hands openEMS rfx's lattice for each requested rung dx = h_sub/n and nothing else: every rfx node line, the 8-cell absorber pad included, as an openEMS mesh line with no SmoothMeshLines and no thirds rule; PML_8 on x_lo, x_hi, y_lo, y_hi and z_hi, occupying exactly rfx's 8 pad cells; PEC on z_lo; the substrate in cells k = 0 .. n_sub-1 over the whole lateral extent, pad included; and the metal on the nodes rfx's rasterizer put it on at that rung -- the rfx rungs are not one board, the section's length along the line realizes 2.117 / 2.382 / 2.495 / 2.448 mm against a drawn 2.540 mm. Each feed joins the section through one extra openEMS box, because rfx unions the sheets before its edge rule and openEMS sets PEC per box. By default both strips continue through the absorber cells (LINE_ENDS pml), because the shared runner forms S21 = b2/a1 from one drive and the ports carry no load; LINE_ENDS rfx keeps rfx's metal exactly, and the passive port's incident wave |a2/a1| is recorded either way. CONTROL 1 runs first and stops the job: --self-check rebuilds rfx's realized board node for node from the integers the rfx ladder log printed (grid shape with the pad, substrate cells, sheet plane, every sheet's node columns and rows, both joints) and requires the metal edges openEMS will set to equal rfx's realized PEC edges. CONTROL 2: every openEMS pass must end on its own energy criterion, 1e-4 (-40 dB), under a 400000-step ceiling; truncation is NOT accepted, so a pass that reaches the ceiling fires the shared runner's gate and leaves no number. The runner's other gates stay on: unused primitives, off-mesh ports, excitation energy, finite |S| <= 2, passivity over 2-12 GHz. Per rung it reports both zeros (the |S21| minimum in 6.5-7.6 GHz and in 7.6-9.5 GHz), the -3 dB corner and the passband mean, the box energy and step count openEMS ended at, a table against rfx's ladder and against openEMS's own frozen record, and one figure. STAGE A IS NOT RUN: the reproduce gate passed in VESSL 369367263406/407/408, which made the frozen record. THIS IS A DIAGNOSTIC: it writes nothing under tests/crossval/sheen_lpf/reference/ and commits no record. Env: EXPECT (the commit, placeholder FILL_BEFORE_SUBMIT refuses), RUNGS, LINE_ENDS, NRTS, THREADS. CPU lane, remilab-c0. Submit with scripts/vessl_submit.sh so the run id is recorded."
tags: [rfx, crossval, sheen-lpf, identical-grid, openems, diagnostic, one-off]
resources:
  cluster: remilab-c0
  cpu: 8
  memory: 16Gi
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  # OMP_NUM_THREADS=1: openEMS's own numThreads (passed explicitly as
  # --threads below, matching resources.cpu) does the parallelism.
  OMP_NUM_THREADS: "1"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  MPLBACKEND: "Agg"
  # REQUIRED. The commit this job measures. A clone whose HEAD does not start
  # with this string exits 3 rather than measuring the wrong tree; the
  # placeholder refuses too.
  EXPECT: "FILL_BEFORE_SUBMIT"
  # Keep equal to `image:` above; the run block prints both beside the openEMS
  # build commit the image stamps into RFX_OPENEMS_COMMIT.
  RFX_OPENEMS_IMAGE: "ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8"
  # This job file is the h/12 rung (11.8 M openEMS cells); 3,5,7 run in
  # vessl_sheen_identical_grid_openems.yaml.
  RUNGS: "12"
  # pml: both strips continue through the absorber cells (default). rfx:
  # rfx's metal exactly, both lines end open at the absorber face.
  LINE_ENDS: "pml"
  # A ceiling, not a record length: every pass must end on its 1e-4 energy
  # criterion before it, or the gate fires.
  NRTS: "400000"
  THREADS: "8"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  echo "=== The Sheen low-pass filter: openEMS on rfx's lattice ==="
  date

  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" --version
  if [ -z "${RFX_OPENEMS_COMMIT:-}" ]; then
    echo "FATAL: RFX_OPENEMS_COMMIT is empty -- this image does not stamp its openEMS build, so no number could name the solver that produced it. Refusing to measure."
    exit 3
  fi
  echo "RFX_OPENEMS_COMMIT=$RFX_OPENEMS_COMMIT"
  echo "RFX_OPENEMS_IMAGE=${RFX_OPENEMS_IMAGE:-unset}"
  "$PY" -c "from openEMS.openEMS import openEMS; print('openEMS from image: OK')"
  "$PY" -c "from CSXCAD.CSXCAD import ContinuousStructure; from openEMS.ports import MSLPort; print('CSXCAD + MSLPort: OK')"

  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }

  if [ "$EXPECT" = "FILL_BEFORE_SUBMIT" ]; then
    echo "FATAL: EXPECT still holds the FILL_BEFORE_SUBMIT placeholder -- pin the commit before submitting"
    exit 3
  fi

  SRC=/tmp/rfx-sheen-identical-grid
  rm -rf "$SRC"
  # Clone the DEFAULT branch and fetch the pinned commit by its sha, so the job
  # still runs after the topic branch is merged and deleted.
  git clone -q https://github.com/bk-squared/rfx.git "$SRC"
  git config --global --add safe.directory "$SRC" || true
  git -C "$SRC" fetch -q origin "$EXPECT"
  git -C "$SRC" checkout -q "$EXPECT"
  sha=$(git -C "$SRC" rev-parse HEAD)
  short=$(git -C "$SRC" rev-parse --short HEAD)
  case "$sha" in
    "$EXPECT"*) echo "provenance: $sha (matches EXPECT=$EXPECT)" ;;
    *) echo "WRONG TREE: clone HEAD is $sha, EXPECT is $EXPECT -- refusing to measure"; exit 3 ;;
  esac
  cd "$SRC"
  export RFX_REPO_ROOT="$SRC"
  git status --short || true

  if ! "$PY" -c "import numpy, h5py" >/dev/null 2>&1; then
    "$PY" -m pip install -q "numpy<2" "h5py>=3.8"
  fi
  "$PY" -c "import numpy; print('numpy', numpy.__version__)"
  "$PY" -c "import matplotlib" >/dev/null 2>&1 || "$PY" -m pip install -q "matplotlib>=3.7"

  primary=/root/workspace/byungkwan-workspace/research/rfx
  RUNG_TAG=$(echo "$RUNGS" | tr ',' '-')
  out="$primary/.omx/sheen-identical-grid-openems/$(date -u +%Y%m%dT%H%M%SZ)-$short-h$RUNG_TAG"
  mkdir -p "$out"
  echo "$sha" > "$out/commit.txt"
  echo "artifacts: $out"

  trap 'st=$?; rc_now=${rc:-$st}; echo "$rc_now" > "$out/exit_code"; { echo "sheen_identical_grid_openems_rc=$rc_now"; echo "commit=$sha"; echo "image=${RFX_OPENEMS_IMAGE:-unset}"; echo "openems_build=$RFX_OPENEMS_COMMIT"; echo "rungs=$RUNGS"; echo "line_ends=$LINE_ENDS"; echo "json=$out/sheen_identical_grid_openems.json"; echo "figure=$out/sheen_identical_grid_openems.png"; ls -la "$out"; } > "$out/summary.txt" 2>&1; cat "$out/summary.txt"' EXIT INT TERM

  DRV=scripts/diagnostics/sheen_box_probe/openems_identical_grid_probe.py
  test -f "$DRV" || { echo "STALE CLONE: the probe is missing at $DRV"; exit 3; }
  MAKER=tests/crossval/sheen_lpf/reference/make_openems_reference.py
  test -f "$MAKER" || { echo "STALE CLONE: the reference maker is missing at $MAKER"; exit 3; }
  GATE=tests/crossval/_openems_tutorial_gate.py
  test -f "$GATE" || { echo "STALE CLONE: the shared tutorial gate is missing at $GATE"; exit 3; }

  # CONTROL 1, pure numpy, seconds: the lattice must rebuild rfx's logged board
  # node for node, and openEMS's metal edges must equal rfx's. A board that is
  # not rfx's must not reach the solver. POSIX rc capture across a pipe: the
  # left side runs in a subshell that writes its own rc to a file.
  ( set +e; "$PY" -u "$DRV" --self-check --rungs "$RUNGS" --line-ends "$LINE_ENDS"; echo $? > "$out/self_check.rc" ) | tee "$out/self_check.log"
  sc_rc=$(cat "$out/self_check.rc")
  if [ "$sc_rc" != "0" ]; then
    echo "FATAL: control 1 (--self-check) exited $sc_rc -- see $out/self_check.log. The lattice is not rfx's board; not starting the solver."
    exit 3
  fi
  ( set +e; "$PY" -u "$DRV" --dry-run --rungs "$RUNGS" --line-ends "$LINE_ENDS" --nrts "$NRTS"; echo $? > "$out/dry_run.rc" ) | tee "$out/dry_run.log"
  dr_rc=$(cat "$out/dry_run.rc")
  if [ "$dr_rc" != "0" ]; then
    echo "FATAL: --dry-run exited $dr_rc -- see $out/dry_run.log. Not starting the solver."
    exit 3
  fi

  echo "=== solve ==="
  ( set +e
    timeout 21600 "$PY" -u "$DRV" --rungs "$RUNGS" --line-ends "$LINE_ENDS" \
      --nrts "$NRTS" --sim-root /tmp/sheen_identical_grid_openems \
      --threads "$THREADS" --out "$out" 2>&1
    echo $? > "$out/exit_code"
  ) | tee "$out/probe.log"
  rc=$(cat "$out/exit_code")
  echo "sheen_identical_grid_openems_rc=$rc"

  # The solver's stdout is the only place the timestep, the energy trace and
  # openEMS's own warnings exist, and /tmp goes away with the pod.
  echo "===== persisting the solver logs ====="
  for d in /tmp/sheen_identical_grid_openems/*/; do
    [ -d "$d" ] || continue
    stage=$(basename "$d")
    src="${d}_openems_stdout.log"
    if [ -f "$src" ]; then
      case "$stage" in
        *_smoke) dest="$out/${stage%_smoke}_smoke_openems_stdout.log" ;;
        *)       dest="$out/${stage}_real_openems_stdout.log" ;;
      esac
      cp "$src" "$dest" && echo "  $src -> $dest ($(wc -c < "$dest") bytes)"
    else
      echo "  (no log at $src)"
    fi
  done
  ls -la "$out"/*_openems_stdout.log 2>/dev/null || echo "  (no solver logs were persisted)"

  # CONTROL 2 as a check on the logs. openEMS's max-timesteps warning must be
  # in EVERY smoke pass's log (200 steps at EndCriteria 0.0 can never converge)
  # and in NO real pass's: a real pass here must end on its own 1e-4 energy
  # criterion. Same binary, same stream; only the smoke/real split differs.
  echo "===== settling positive control ====="
  PHRASE="reached before the end-criteria of"
  settling_rc=0
  smoke_logs=$(find /tmp/sheen_identical_grid_openems -name "_openems_stdout.log" -path "*_smoke/*" 2>/dev/null || true)
  real_logs=$(find /tmp/sheen_identical_grid_openems -name "_openems_stdout.log" -not -path "*_smoke/*" 2>/dev/null || true)
  if [ -z "$smoke_logs" ]; then
    echo "SETTLING CONTROL: no smoke-pass log found -- the control cannot speak"
    settling_rc=4
  fi
  for f in $smoke_logs; do
    if grep -q "$PHRASE" "$f"; then
      echo "  ok   smoke   $f carries the max-timesteps warning"
    else
      echo "  RED  smoke   $f does NOT carry it -- a 200-step pass that reported convergence means the phrase this control greps for has changed"
      settling_rc=4
    fi
  done
  for f in $real_logs; do
    if grep -q "$PHRASE" "$f"; then
      echo "  RED  real    $f carries the max-timesteps warning -- that pass stopped at its ceiling, not on its energy criterion"
      settling_rc=4
    else
      echo "  ok   real    $f ended on its energy criterion"
    fi
  done
  echo "settling_positive_control_rc=$settling_rc"
  echo "$settling_rc" > "$out/settling_control.rc"

  echo "=== summary ==="
  sed -n '/READING 1/,$p' "$out/probe.log" | head -n 60 || true
  ls -la "$out"

  # Evidence first: the json and the figure are already written. Only now does
  # the settling control get to change the verdict.
  if [ "$rc" = "0" ] && [ "$settling_rc" != "0" ]; then
    echo "SETTLING POSITIVE CONTROL FAILED: the rungs ran and the numbers were written, but the control did not hold, so no number in them has a supported end of record."
    rc=4
  fi

  echo "=== verdict ==="
  case "$rc" in
    0) echo "RAN: every requested rung passed control 1, ended on its energy criterion and wrote its numbers to $out/sheen_identical_grid_openems.json. READING 1 is the table against rfx's ladder." ;;
    1) echo "A RUNG WAS REFUSED: control 1 failed or a shared sanity gate fired -- a truncated pass, unused primitives, an off-mesh port, no excitation energy, a non-finite |S| or a passivity excess. The log names which; no number from that rung is usable." ;;
    2) echo "openEMS NOT IMPORTABLE despite the image probes passing -- investigate the bindings" ;;
    3) echo "CONFIG ERROR: a missing solver stamp, a wrong tree, a failed control 1 or dry run -- not a physics finding" ;;
    4) echo "SETTLING POSITIVE CONTROL FAILED: read $out/settling_control.rc and the per-log lines above." ;;
    124) echo "TIMEOUT: the 21600 s budget was exhausted -- report the wall clock, do NOT drop a rung or cap the record to fit" ;;
    *) echo "ERROR: unexpected exit code $rc" ;;
  esac
  exit "$rc"
