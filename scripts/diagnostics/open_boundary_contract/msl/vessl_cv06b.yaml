name: rfx-801-msl-trace-cv06b
description: "#801 cv06b trace x bounds: baseline and continued."
tags: [rfx, issue-801, diagnostic]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  JAX_ENABLE_X64: "0"
  PYTHONDONTWRITEBYTECODE: "1"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  base=/root/workspace/bk-workspace/.801-measure
  cat "$base/PROVENANCE.txt"
  sha256sum "$base/msl/measure.py" "$base/src-main/validation/crossval/06b_msl_notch_filter_uniform.py" "$base/src-main/rfx/boundaries/cpml.py"
  python -m pip install -q "scipy>=1.11" pytest
  python -B "$base/msl/measure.py" cv06b --require-gpu
