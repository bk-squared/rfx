name: rfx-rt5880-patch-width-probe
description: "RT/Duroid 5880 patch antenna, a diagnostic (archive/rt5880-patch-width-probe, not the cross-validation case): scripts/diagnostics/rt5880_patch_width_probe.py at the ref in RFX_GPU_SUITE_REF, exported with git archive (the patch ladder job's harness). Arm A solves the case's board at h/4; arm B the same board with the patch width 49.2125 mm and the ground width 65.0875 mm (node-aligned) at h/4, h/8 and h/12. The log, its exit code, per-rung Zin arrays, summary.json and the figure go to research/rfx/.omx/rt5880-patch-width-probe/<UTC>-<sha>/ on the lab share. Launched by the crossval lane leader."
tags: [rfx, crossval, rt5880-patch, diagnostic, one-off]
resources:
  cluster: remilab-c0
  preset: gpu-24gb
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  MPLBACKEND: "Agg"
  RFX_GPU_SUITE_REF: "origin/archive/rt5880-patch-width-probe"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  # POSIX sh only: no arrays, no [[ ]], no pipefail, no heredocs (VESSL
  # re-indents this block and a heredoc terminator then never closes).
  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }
  primary=/root/workspace/byungkwan-workspace/research/rfx
  cd "$primary"
  git config --global --add safe.directory "$primary" || true
  echo "=== RT5880 patch antenna width probe (one-off diagnostic) ==="
  git fetch -q origin
  ref="${RFX_GPU_SUITE_REF:-origin/main}"
  sha=$(git rev-parse "$ref")
  short=$(git rev-parse --short "$ref")
  echo "suite ref: $ref = $sha"
  src="/tmp/rfx-rt5880-width-probe-$short"
  rm -rf "$src" && mkdir -p "$src"
  git archive --format=tar "$sha" | tar -xf - -C "$src"
  python -m pip install -q "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7" pytest
  # The JAX the product is tested on (vessl-jobs rule, PI 2026-09-24), before
  # the first import of jax.
  python -m pip install -q "jax[cuda12]==0.6.2"
  export RFX_REPO_ROOT="$src"
  export PYTHONPATH="$RFX_REPO_ROOT:${PYTHONPATH:-}"
  cd "$src"
  python -c "import jax, rfx; print('probe ok | jax', jax.__version__, '| devices', jax.devices(), '| rfx', getattr(rfx, '__version__', '?'))"
  out="$primary/.omx/rt5880-patch-width-probe/$(date -u +%Y%m%dT%H%M%SZ)-$short"
  mkdir -p "$out"
  echo "$sha" > "$out/commit.txt"
  echo "=== run ==="
  # The script's status has to come out of the pipeline, and a bare rc=$? after
  # "| tee" reads tee's. The brace group writes it to a file and its stdout
  # still reaches tee (the pattern of scripts/vessl_rt5880_patch_ladder.yaml).
  set +e
  { timeout 5400 python scripts/diagnostics/rt5880_patch_width_probe.py --out "$out" 2>&1
    echo "$?" > "$out/probe.rc"
  } | tee "$out/probe.log"
  set -e
  rc=$(cat "$out/probe.rc")
  echo "=== summary ==="
  tail -n 25 "$out/probe.log"
  ls -la "$out"
  echo "probe_rc=$rc"
  echo "artifacts: $out"
  exit "$rc"
