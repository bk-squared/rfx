name: rfx-nu-cost-gpu-bench
description: "NU cost-reduction lane: GPU forward-throughput baseline/after on RTX 4090 (bare vs nu-z, scripts/diagnostics/gpu_throughput_bench.py, same harness as docs/agent/gpu-throughput.mdx 2026-08-25). Launch from OUTSIDE any git worktree: vessl run create -f scripts/vessl_nu_cost_gpu_bench.yaml --project byungkwan. Code staged by rsync to claude-workspace/rfx/checkouts/nu-cost (.staged-commit records the sha). Harvest: ~/Documents/vessl-run-logs/harvest.sh RUN_ID rfx-nu-cost-gpu-bench"
tags: [rfx, nu-cost, gpu-throughput, gpu]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -euo pipefail
  SRC=/root/workspace/claude-workspace/rfx/checkouts/nu-cost
  STAMP="$(date -u +%Y%m%dT%H%M%SZ)-$(cat "$SRC/.staged-commit" 2>/dev/null | cut -c1-8 || echo unknown)"
  OUT=/root/workspace/claude-workspace/rfx/runs/nu-cost-gpu-bench/$STAMP
  mkdir -p "$OUT"
  cd "$SRC"
  echo "=== NU cost lane: GPU throughput bench (bare vs nu-z) ==="
  date
  python -m pip install -q "scipy>=1.11"
  export PYTHONPATH="$SRC:${PYTHONPATH:-}"
  echo "staged commit: $(cat "$SRC/.staged-commit" 2>/dev/null || echo unknown)"
  python -c "import jax, rfx; print('backend', jax.default_backend(), jax.devices(), '| rfx', rfx.__file__)"
  nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv || true
  # The bench writes its JSON next to itself; the rsync-staged checkout is
  # not writable by the container (PermissionError on the baseline run
  # 369367259061 — numbers were in the log, JSON lost), so run a copy of
  # the script from $OUT and let it write there.
  cp scripts/diagnostics/gpu_throughput_bench.py "$OUT/gpu_throughput_bench.py"
  python "$OUT/gpu_throughput_bench.py" 2>&1 | tee "$OUT/gpu_throughput_bench.log"
  cat "$SRC/.staged-commit" > "$OUT/staged-commit" 2>/dev/null || true
  echo "artifacts: $OUT"
  echo "=== DONE ==="
  date
