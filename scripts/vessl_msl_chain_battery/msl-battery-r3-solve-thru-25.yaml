name: rfx-msl-battery-r3-solve-thru-25
description: "MSL chain battery: one S-matrix solve for one device at one cell size."
tags: [rfx, msl-chain-battery, solve]
resources:
  cluster: remilab-c0
  preset: gpu-a6000-1
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  MPLBACKEND: "Agg"
  XLA_PYTHON_CLIENT_MEM_FRACTION: "0.92"
  RFX_SHA: "2078ba2a0bc1b0dfc0ffe2fe5f7507e741022f37"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }
  SRC=/root/workspace/byungkwan-workspace/research/rfx-wt-msl-battery
  git config --global --add safe.directory "*"
  git config --global --add safe.directory "$SRC"
  git config --global --add safe.directory "$(git -C "$SRC" rev-parse --absolute-git-dir)"
  SHA=$(git -C "$SRC" rev-parse HEAD)
  test "$SHA" = "$RFX_SHA" || { echo "FATAL: worktree moved: $SHA"; exit 3; }
  test -z "$(git -C "$SRC" status --porcelain)" || { echo "FATAL: dirty worktree"; exit 3; }
  RUNS=/root/workspace/claude-workspace/rfx/runs
  OUT=$RUNS/msl-battery-r3-solve-thru-25-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$SHA" > "$OUT/commit.txt"
  echo "$OUT" > "$RUNS/msl-battery-r3-solve-thru-25.latest"
  WORK=/root/work/msl-battery-r3-solve-thru-25
  trap 'rc=$?; echo "$rc" > "$OUT/job.rc"; cp -pr "$WORK/battery_out" "$OUT/" 2>/dev/null || true; chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  rm -rf "$WORK"; mkdir -p "$WORK"; cp -a "$SRC/." "$WORK/"; cd "$WORK"
  "$PY" -m pip install -q "jax[cuda12]==0.6.2" "numpy>=2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7" pytest pytest-split optax
  export PYTHONPATH="$WORK"
  git config --global --add safe.directory "*"
  "$PY" -c "import rfx, os; print('rfx from', os.path.dirname(rfx.__file__))"
  mkdir -p "$WORK/battery_out"
  { timeout 80000 "$PY" scripts/diagnostics/msl_chain_battery_measure.py \
      --stage solve --dut thru --rung 25 --num-periods 20 \
      --drive wide --report-every 2000 --out "$WORK/battery_out" --run-id "$OUT" 2>&1; echo "rc=$?"; } \
    | tee "$OUT/run.log" | tail -60
  echo BATTERY_STAGE_DONE
