name: rfx-i729-fd-step
description: Predeclared h=1e-4,1e-5,1e-6 FD contraction with actual f64 fields, original20period
  geometry; compare retained f64 AD, change no gate.
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
  XLA_FLAGS: --xla_force_host_platform_device_count=2
  HDF5_USE_FILE_LOCKING: 'FALSE'
  RFX_CHECKOUT: /root/workspace/claude-workspace/rfx/checkouts/codex-729-f8402512
  RFX_SHA: f8402512dc5aa524c543168fa67f338400fbb370
  RFX_OUT: /root/workspace/claude-workspace/rfx/runs/codex-i729-fd-step-v8l7og1w
  RFX_DRIVER: /root/workspace/claude-workspace/rfx/runs/codex-i729-fd-step-v8l7og1w/driver.py
  RFX_FD_OUT: /root/workspace/claude-workspace/rfx/runs/codex-i729-true-f64-reference-4k51x8kg
  RFX_AD_OUT: /root/workspace/claude-workspace/rfx/runs/codex-i729-f64-ad-control-rjx4xgwi
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: 'set -eu

  RFX_WORK=/tmp/rfx-i729-consumers

  git config --global --add safe.directory "$RFX_CHECKOUT"

  git config --global --add safe.directory "$RFX_CHECKOUT/.git"

  git clone --quiet --no-checkout "$RFX_CHECKOUT" "$RFX_WORK"

  git -C "$RFX_WORK" checkout --quiet --detach "$RFX_SHA"

  cd "$RFX_WORK"

  python -m pip install -q "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7" pyyaml
  pytest

  export PYTHONPATH="$RFX_WORK"

  export MPLBACKEND=Agg

  python -u "$RFX_DRIVER"

  '
