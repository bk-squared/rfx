name: rfx-cv05-native-constructor
description: "Build-only native openEMS geometry/XML verification of cv05 and its sheet-plane falsifier; no FDTD or MSL run."
tags: [rfx, issue-959, cv05, geometry]
resources:
  cluster: remilab-c0
  cpu: 4
  memory: 8Gi
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  JAX_PLATFORMS: cpu
  MPLBACKEND: Agg
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  COMMIT=5979748c04c77ccfdcacea596949442f287e6273
  REPO=/tmp/rfx-cv05-$COMMIT
  OUT=/root/workspace/byungkwan-workspace/research/rfx-cv05-native/$COMMIT
  mkdir -p "$REPO" "$OUT"
  git -C "$REPO" init -q
  git -C "$REPO" remote add origin https://github.com/bk-squared/rfx.git
  git -C "$REPO" fetch -q --depth 1 origin "$COMMIT"
  git -C "$REPO" checkout -q --detach FETCH_HEAD
  cd "$REPO"
  git rev-parse HEAD | tee "$OUT/commit.txt"
  python -m pip install -q 'jax[cpu]==0.6.2' 'numpy<2' 'scipy>=1.11' 'h5py>=3.8' 'matplotlib>=3.7' pytest
  export PYTHONPATH="$REPO"
  export RFX_CV05_NATIVE_DIR="$OUT"
  python -c 'import jax, openEMS, CSXCAD; from openEMS.openEMS import openEMS as Solver; from CSXCAD.CSXCAD import ContinuousStructure; print("jax",jax.__version__,jax.default_backend(),"openEMS",getattr(openEMS,"__version__",None),"CSXCAD",getattr(CSXCAD,"__version__",None))' | tee "$OUT/runtime.txt"
  python -m pip freeze > "$OUT/pip-freeze.txt"
  set +e
  timeout 900 python -m pytest tests/crossval/test_cv05_realized_sheet_planes.py::test_native_openems_keeps_the_transferred_board -q -ra --junitxml="$OUT/junit.xml" > "$OUT/native-tests.log" 2>&1
  RC=$?
  set -e
  cat "$OUT/native-tests.log"
  echo "$RC" > "$OUT/rc.txt"
  if [ "$RC" -eq 0 ]; then
    python -c 'import os,xml.etree.ElementTree as E; from pathlib import Path; p=Path(os.environ["RFX_CV05_NATIVE_DIR"]); t=E.parse(p/"junit.xml"); cases=t.findall(".//testcase"); assert len(cases)==2 and not t.findall(".//skipped") and not t.findall(".//failure") and not t.findall(".//error"); print("NATIVE_GEOMETRY_TESTS=2 PASS; NO FDTD")'
  fi
  exit "$RC"
