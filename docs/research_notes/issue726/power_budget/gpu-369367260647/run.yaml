name: rfx-i726-continued-absorbing-lead
description: 'Sequential causal comparison to633: only trace continuation through
  x CPML changes; source-to-source PEC, all materials, sources, observations/time/frequencies
  fixed; no calibration or accuracy PASS.'
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
  JAX_ENABLE_X64: '0'
  HDF5_USE_FILE_LOCKING: 'FALSE'
  RFX_OUT: /root/workspace/claude-workspace/rfx/runs/codex-i726-continued-lead-9hac_q0t
  RFX_SHA: 87927064131a1df44133117304c746a0e9e9f4bc
  RFX_ARCHIVE_SHA256: fe826065cdff23172a23d78889ac784c7aad5667480edfefeea9a8672f94de73
  RFX_DRIVER_SHA256: 65e0406ed1e6abb2e44f2f9a9af56ac32c47e0ba2ae35483747533a8b024e6fa
  RFX_BASELINE_ENV_SHA256: fec67e6d18e38cc90687457d87a0afdcdea0e1fa8f2ab07c31f9683995cf1553
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: 'set -eu

  RFX_WORK=$(mktemp -d /tmp/rfx-i726-power.XXXXXX)

  export RFX_WORK

  python -c ''import os,hashlib; from pathlib import Path; p=Path(os.environ["RFX_OUT"]);
  assert hashlib.sha256((p/"source.tar").read_bytes()).hexdigest()==os.environ["RFX_ARCHIVE_SHA256"];
  assert hashlib.sha256((p/"field_power.py").read_bytes()).hexdigest()==os.environ["RFX_DRIVER_SHA256"]''

  tar -xf "$RFX_OUT/source.tar" -C "$RFX_WORK"

  cd "$RFX_WORK"

  python -m pip install -q "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7" pyyaml
  pytest

  export PYTHONPATH="$RFX_WORK"

  export MPLBACKEND=Agg

  python -c ''import jax,numpy,scipy,rfx,json,os; from pathlib import Path; m=dict(source_sha=os.environ["RFX_SHA"],source_archive_sha256=os.environ["RFX_ARCHIVE_SHA256"],driver_sha256=os.environ["RFX_DRIVER_SHA256"],jax=jax.__version__,numpy=numpy.__version__,scipy=scipy.__version__,rfx_path=rfx.__file__,backend=jax.default_backend(),x64=bool(jax.config.jax_enable_x64),devices=[str(x)
  for x in jax.devices()]); print(json.dumps(m)); assert m["backend"]=="gpu"; Path(os.environ["RFX_OUT"],"environment.json").write_text(json.dumps(m,indent=2))''

  python -c ''import os,json,hashlib; from pathlib import Path; p=Path(os.environ["RFX_OUT"]);
  b=(p/"baseline-environment.json").read_bytes(); assert hashlib.sha256(b).hexdigest()==os.environ["RFX_BASELINE_ENV_SHA256"];
  old=json.loads(b); new=json.loads((p/"environment.json").read_text()); keys=("jax","numpy","scipy","backend","x64");
  assert all(old[k]==new[k] for k in keys), (old,new); print("Baseline software and
  precision match verified")''

  set +e

  timeout --kill-after=30s 7200s python -u "$RFX_OUT/field_power.py" --lead-through-cpml
  --out "$RFX_OUT/artifacts" > "$RFX_OUT/run.log" 2>&1

  RFX_RC=$?

  set -e

  printf ''%s\n'' "$RFX_RC" > "$RFX_OUT/exit-code.txt"

  tail -n 80 "$RFX_OUT/run.log"

  exit "$RFX_RC"

  '
