name: rfx-i726-collocation-cv06b
description: Same cv06b source/DUT and fixed observation pair after H-to-E interpolation;
  retain both H-side currents for unprojected same-field comparison. Then exercise
  a single aligned-coupon x-grading case sequentially with unequal H weights.
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
  XLA_FLAGS: --xla_force_host_platform_device_count=2
  HDF5_USE_FILE_LOCKING: 'FALSE'
  RFX_CHECKOUT: /root/workspace/claude-workspace/rfx/checkouts/codex-726-ec3bedfe
  RFX_SHA: ec3bedfe2fc1a8c8be12ebd2b7054562a5fcf096
  RFX_OUT: /root/workspace/claude-workspace/rfx/runs/codex-i726-collocation-cv06b-eifgcivp
  JAX_ENABLE_X64: '0'
  RFX_GRADED_DRIVER: /root/workspace/claude-workspace/rfx/runs/codex-i726-collocation-cv06b-eifgcivp/graded_thru.py
  RFX_GRADED_SHA256: 2f5b497ba978e591f32ba464e3d31daf32ddeba2577934034b1a37879aed7c54
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: 'set -eu

  RFX_WORK=/tmp/rfx-i726-cv06b

  git config --global --add safe.directory "$RFX_CHECKOUT"

  git config --global --add safe.directory "$RFX_CHECKOUT/.git"

  git clone --quiet --no-checkout "$RFX_CHECKOUT" "$RFX_WORK"

  git -C "$RFX_WORK" checkout --quiet --detach "$RFX_SHA"

  cd "$RFX_WORK"

  python -m pip install -q "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7" pyyaml
  pytest

  export PYTHONPATH="$RFX_WORK"

  export MPLBACKEND=Agg

  python -c ''import jax,numpy,scipy,rfx,json,os; from pathlib import Path; m=dict(source_sha=os.environ["RFX_SHA"],jax=jax.__version__,numpy=numpy.__version__,scipy=scipy.__version__,rfx_path=rfx.__file__,backend=jax.default_backend(),x64=bool(jax.config.jax_enable_x64),devices=[str(x)
  for x in jax.devices()]); print(json.dumps(m)); assert m["backend"]=="gpu"; Path(os.environ["RFX_OUT"],"environment.json").write_text(json.dumps(m,indent=2))''

  set +e

  timeout --kill-after=30s 7200s python -u scripts/diagnostics/msl_probe_clearance_bias.py
  --num-periods 100 --out-dir "$RFX_OUT/artifacts" > "$RFX_OUT/run.log" 2>&1

  RFX_RC=$?

  set -e

  printf ''%s\n'' "$RFX_RC" > "$RFX_OUT/exit-code.txt"

  tail -n 100 "$RFX_OUT/run.log"

  if [ "$RFX_RC" -ne 0 ] && [ "$RFX_RC" -ne 2 ]; then exit "$RFX_RC"; fi

  python -c ''import hashlib,os; from pathlib import Path; assert hashlib.sha256(Path(os.environ["RFX_GRADED_DRIVER"]).read_bytes()).hexdigest()==os.environ["RFX_GRADED_SHA256"]''

  set +e

  python -u "$RFX_GRADED_DRIVER" --out "$RFX_OUT/graded" > "$RFX_OUT/graded.log" 2>&1

  RFX_GRADED_RC=$?

  set -e

  printf ''%s\n'' "$RFX_GRADED_RC" > "$RFX_OUT/graded-exit-code.txt"

  tail -n 60 "$RFX_OUT/graded.log"

  if [ "$RFX_GRADED_RC" -ne 0 ]; then exit "$RFX_GRADED_RC"; fi

  exit "$RFX_RC"

  '
