name: rfx-fdfd-gpu-p0
description: "P0 probe of study P (level-invariant spiral fixture): cuDSS plan-only memory estimates of the jointly refined levels, the level-2 wall ladder (margins 10/20/40/80 W), gate P6 (old fixture with walls / short standard / vertical grid made physical one at a time, W/1 and W/2), the uniform-current sigma plateau at level 3 plus the 10 MHz RC twin, and value_and_grad at levels 1-2. Submit: bash validation/vessl/submit.sh p0"
tags: [rfx, fdfd, gpu, cudss, p0]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: "noninteractive"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "16"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
  RFX_FDFD_BACKEND: "cudss"
  RFX_P_BLOCKS: "plans walls p6 plateau ladder bigplans"
  RFX_P_PLANS: "10:2:3 20:2:3 10:2:4 20:2:4 10:1:4"
  RFX_P_WALLS: "10 20 40 80"
  RFX_P_P6_LEVELS: "1 2"
  RFX_P_PLATEAU_LEVEL: "3"
  RFX_P_PLATEAU_WALL: "10"
  RFX_P_LEVELS: "1 2"
  RFX_P_BIGPLANS: "10:2:5 10:1:5 10:1:6"
  RFX_P_FACTOR_CACHE: "1"
  RFX_P_DEADLINE_S: "4200"
  RFX_FDFD_CUDSS_HYBRID: "0"
  RFX_FDFD_CUDSS_FREE_FORWARD: "1"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
import:
  /root/upload/: volume://vessl-storage/rfx-fdfd-gpu-p-20260915
run: |-
  set -eu
  echo "=== rfx fdfd GPU lane p0 (lane_p0_probe.py, sha256 10ab8e8c75fee949) ==="
  date -u
  nvidia-smi || echo "nvidia-smi FAILED"
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" -V
  OUT=/root/workspace/claude-workspace/rfx/runs/fdfd-gpu-p0-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > /root/workspace/claude-workspace/rfx/runs/fdfd-gpu-p0.latest
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  export RFX_OUT="$OUT"
  WORK=/root/work/rfx-fdfd-gpu-p0
  rm -rf "$WORK"; mkdir -p "$WORK"
  echo "=== source: the uploaded tarball, imported at /root/upload/rfx-src-p.tgz ==="
  ls -la /root/upload/ || true
  test -f /root/upload/rfx-src-p.tgz || { echo "ERROR: import did not deliver /root/upload/rfx-src-p.tgz"; exit 3; }
  tar xzf /root/upload/rfx-src-p.tgz -C "$WORK"
  cd "$WORK"
  test -f "$WORK/rfx/fdfd/_cudss.py" || { echo "ERROR: payload did not unpack"; ls -la "$WORK"; exit 3; }
  echo "=== pip install (PyPI at job start) ==="
  "$PY" -m pip install -q jax[cpu]==0.6.2 "numpy<2.3" "scipy>=1.14" shapely pytest 2>&1 | tail -5
  set +e
  "$PY" -m pip install -q "nvmath-python[cu12]" cupy-cuda12x 2>&1 | tail -10
  gpu_pip=$?
  set -e
  echo "gpu_pip_rc=$gpu_pip" | tee "$OUT/pip.rc"
  "$PY" -m pip freeze > "$OUT/pip-freeze.txt" 2>/dev/null || true
  export PYTHONPATH="$WORK"
  export RFX_REPO_ROOT="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, rfx.fdfd.linear_solve as ls; print('probe ok | jax', jax.__version__, '| jax backend', jax.default_backend(), '| default_backend', ls.get_default_backend())"
  "$PY" -c "from rfx.fdfd import _cudss; import json; print('backends:', json.dumps(_cudss.availability(), indent=1))" | tee "$OUT/backends.txt"
  echo "=== lane p0 ==="
  set +x
  echo  | base64 -d > "$WORK/validation/vessl/_lane_embedded.py"
  set -x
  cmp -s "$WORK/validation/vessl/_lane_embedded.py" "$WORK/validation/vessl/lane_p0_probe.py" && echo "embedded lane == repo lane" || echo "NOTE: embedded lane differs from the tarball copy"
  set +e
  ( timeout 4800 "$PY" -u "$WORK/validation/vessl/_lane_embedded.py"; echo $? > "$OUT/p0.rc" ) 2>&1 | tee "$OUT/p0.log"
  set -e
  rc=$(cat "$OUT/p0.rc" 2>/dev/null || echo 99)
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "LANE=p0 RC=$rc"
  exit "$rc"
