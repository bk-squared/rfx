name: rfx-fdfd-gpu-p3
description: "P3, study P's hybrid-memory lane on the 48 GB card: cuDSS hybrid (host+device) memory mode with an EXPLICIT device-memory limit (RFX_FDFD_CUDSS_HYBRID_LIMIT, which the m = 5 attempt of run 369367261252 ran WITHOUT). Gate H1 at level 3 (11.37 GB factor by cuDSS's in-core plan): hybrid with a 6 GiB limit -- below the factor -- against the in-memory run, L and the gradient to 1e-9, each with its in-core-vs-in-core CONTROL (the solution vector's and the value_and_grad's), the slowdown and the sampled device peak; then the container's host-memory limit (cgroup, not /proc/meminfo) against what a level-5 factor (91.87 GB) needs in host memory, and the level-5 forward + value_and_grad only if it fits. The plan estimates carry hybrid_limit_applied=constructor: the limit reaches cuDSS at DirectSolver construction and nowhere else. Submit: bash validation/vessl/submit.sh p3"
tags: [rfx, fdfd, gpu, cudss, p3]
resources:
  cluster: remilab-c0
  preset: gpu-a6000-1
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: "noninteractive"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "16"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
  RFX_FDFD_BACKEND: "cudss"
  RFX_P_LANE_NAME: "P3"
  RFX_P_JSON: "p3_ladder.json"
  RFX_P_WALL: "10"
  RFX_P3_BLOCKS: "host h1 m5"
  RFX_P3_H1_LEVEL: "3"
  RFX_P3_H1_LIMIT: "6GiB"
  RFX_P3_M5_LEVEL: "5"
  RFX_P3_M5_LIMIT: "40GiB"
  RFX_P3_HOST_MARGIN_GB: "4"
  RFX_P3_PROBE_CONTROL: "1"
  RFX_P3_CONTROL: "1"
  RFX_P_DEADLINE_S: "5400"
  RFX_FDFD_CUDSS_HYBRID: "0"
  RFX_FDFD_CUDSS_FREE_FORWARD: "1"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
import:
  /root/upload/: volume://vessl-storage/rfx-fdfd-gpu-p3b-20260916
run: |-
  set -eu
  echo "=== rfx fdfd GPU lane p3 (lane_p3_hybrid.py, sha256 72e028fc73e1b340) ==="
  date -u
  nvidia-smi || echo "nvidia-smi FAILED"
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" -V
  OUT=/root/workspace/claude-workspace/rfx/runs/fdfd-gpu-p3-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > /root/workspace/claude-workspace/rfx/runs/fdfd-gpu-p3.latest
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  export RFX_OUT="$OUT"
  WORK=/root/work/rfx-fdfd-gpu-p3
  rm -rf "$WORK"; mkdir -p "$WORK"
  echo "=== source: the uploaded tarball, imported at /root/upload/rfx-src-p3.tgz ==="
  ls -la /root/upload/ || true
  test -f /root/upload/rfx-src-p3.tgz || { echo "ERROR: import did not deliver /root/upload/rfx-src-p3.tgz"; exit 3; }
  tar xzf /root/upload/rfx-src-p3.tgz -C "$WORK"
  cd "$WORK"
  test -f "$WORK/rfx/fdfd/_cudss.py" || { echo "ERROR: payload did not unpack"; ls -la "$WORK"; exit 3; }
  echo "=== pip install (PyPI at job start) ==="
  "$PY" -m pip install -q jax[cpu]==0.6.2 "numpy<2.3" "scipy>=1.14" shapely pytest 2>&1 | tail -5
  set +e
  "$PY" -m pip install -q "nvmath-python[cu12]" cupy-cuda12x 2>&1 | tail -10
  gpu_pip=$?
  set -e
  echo "gpu_pip_rc=$gpu_pip" | tee "$OUT/pip.rc"
  "$PY" -m pip freeze > "$OUT/pip-freeze.txt" 2>/dev/null || true
  export PYTHONPATH="$WORK"
  export RFX_REPO_ROOT="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, rfx.fdfd.linear_solve as ls; print('probe ok | jax', jax.__version__, '| jax backend', jax.default_backend(), '| default_backend', ls.get_default_backend())"
  "$PY" -c "from rfx.fdfd import _cudss; import json; print('backends:', json.dumps(_cudss.availability(), indent=1))" | tee "$OUT/backends.txt"
  echo "=== pytest: the hybrid-memory option, on the GPU ==="
  set +e
  RFX_FDFD_BACKEND=cudss timeout 900 "$PY" -m pytest tests/unit/fdfd/test_fdfd_linear_solve.py -q -rs -p no:cacheprovider -k "hybrid" > "$OUT/pytest-hybrid.log" 2>&1
  echo "$?" > "$OUT/pytest-hybrid.rc"
  tail -n 15 "$OUT/pytest-hybrid.log"
  set -e
  echo "pytest rc: hybrid=$(cat "$OUT/pytest-hybrid.rc")"
  echo "=== lane p3 ==="
  set +x
  echo  | base64 -d > "$WORK/validation/vessl/_lane_embedded.py"
  set -x
  cmp -s "$WORK/validation/vessl/_lane_embedded.py" "$WORK/validation/vessl/lane_p3_hybrid.py" && echo "embedded lane == repo lane" || echo "NOTE: embedded lane differs from the tarball copy"
  set +e
  ( timeout 5700 "$PY" -u "$WORK/validation/vessl/_lane_embedded.py"; echo $? > "$OUT/p3.rc" ) 2>&1 | tee "$OUT/p3.log"
  set -e
  rc=$(cat "$OUT/p3.rc" 2>/dev/null || echo 99)
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "LANE=p3 RC=$rc"
  exit "$rc"
