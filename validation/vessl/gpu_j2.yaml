name: rfx-fdfd-gpu-j2
description: "J2 paper geometry (only after J1): the 2.4 GHz LC-VCO paper's 3-turn square spiral (r_out 218 um, W 30 um, S 14 um, TopMetal2 3 um) on study H's own SmallStack conventions (validation/fdfd/rfic_spiral.py), L at 100 MHz uniform-current against the bridge-corrected referee, plus cuDSS plan-only memory estimates for the W/3 grid study H built but could not solve (N=509580). Submit: bash validation/vessl/submit.sh j2"
tags: [rfx, fdfd, gpu, cudss, j2]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: "noninteractive"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "16"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
  RFX_FDFD_BACKEND: "cudss"
  RFX_LANE_DIVS: "1 3"
  RFX_LANE_PLAN_DIVS: "3"
  RFX_LANE_FACTOR_CACHE: "1"
  RFX_LANE_DEADLINE_S: "5400"
  RFX_FDFD_CUDSS_FREE_FORWARD: "1"
  RFX_LANE_CUSOLVER_DIV: "1"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
import:
  /root/upload/: volume://vessl-storage/rfx-fdfd-gpu-v-20260915
run: |-
  set -eu
  echo "=== rfx fdfd GPU lane j2 (lane_j2_paper.py, sha256 e6a247ac590530cd) ==="
  date -u
  nvidia-smi || echo "nvidia-smi FAILED"
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" -V
  OUT=/root/workspace/claude-workspace/rfx/runs/fdfd-gpu-j2-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > /root/workspace/claude-workspace/rfx/runs/fdfd-gpu-j2.latest
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  export RFX_OUT="$OUT"
  WORK=/root/work/rfx-fdfd-gpu-j2
  rm -rf "$WORK"; mkdir -p "$WORK"
  echo "=== source: the uploaded tarball, imported at /root/upload/rfx-src.tgz ==="
  ls -la /root/upload/ || true
  test -f /root/upload/rfx-src.tgz || { echo "ERROR: import did not deliver /root/upload/rfx-src.tgz"; exit 3; }
  tar xzf /root/upload/rfx-src.tgz -C "$WORK"
  cd "$WORK"
  test -f "$WORK/rfx/fdfd/_cudss.py" || { echo "ERROR: payload did not unpack"; ls -la "$WORK"; exit 3; }
  echo "=== pip install (PyPI at job start) ==="
  "$PY" -m pip install -q jax[cpu]==0.6.2 "numpy<2.3" "scipy>=1.14" shapely pytest 2>&1 | tail -5
  set +e
  "$PY" -m pip install -q "nvmath-python[cu12]" cupy-cuda12x 2>&1 | tail -10
  gpu_pip=$?
  set -e
  echo "gpu_pip_rc=$gpu_pip" | tee "$OUT/pip.rc"
  "$PY" -m pip freeze > "$OUT/pip-freeze.txt" 2>/dev/null || true
  export PYTHONPATH="$WORK"
  export RFX_REPO_ROOT="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, rfx.fdfd.linear_solve as ls; print('probe ok | jax', jax.__version__, '| jax backend', jax.default_backend(), '| default_backend', ls.get_default_backend())"
  "$PY" -c "from rfx.fdfd import _cudss; import json; print('backends:', json.dumps(_cudss.availability(), indent=1))" | tee "$OUT/backends.txt"
  echo "=== lane j2 ==="
  set +x
  echo  | base64 -d > "$WORK/validation/vessl/_lane_embedded.py"
  set -x
  cmp -s "$WORK/validation/vessl/_lane_embedded.py" "$WORK/validation/vessl/lane_j2_paper.py" && echo "embedded lane == repo lane" || echo "NOTE: embedded lane differs from the tarball copy"
  set +e
  ( timeout 6600 "$PY" -u "$WORK/validation/vessl/_lane_embedded.py"; echo $? > "$OUT/j2.rc" ) 2>&1 | tee "$OUT/j2.log"
  set -e
  rc=$(cat "$OUT/j2.rc" 2>/dev/null || echo 99)
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "LANE=j2 RC=$rc"
  exit "$rc"
