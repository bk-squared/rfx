name: rfx-fdfd-gpu-r4
description: "R4, study R part C on the 48 GB card (the finest grids only): the design optimum one level finer -- in-plane (6 cells across W, z at level 2, walls 3 W) and vertically (z at level 3, 4 cells across W, walls 10 W) -- with their same-box references and the level-1/2 checks that the level shift does not depend on the box and that the two directions add. The full level 3 is a 106.71 GB factor and does not fit this preset (48 GB device, 32 GiB host). Submit: bash validation/vessl/submit.sh r4"
tags: [rfx, fdfd, gpu, cudss, r4]
resources:
  cluster: remilab-c0
  preset: gpu-a6000-1
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: "noninteractive"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "16"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
  RFX_FDFD_BACKEND: "cudss"
  RFX_R_FACTOR_CACHE: "0"
  RFX_FDFD_CUDSS_HYBRID: "0"
  RFX_FDFD_CUDSS_FREE_FORWARD: "1"
  RFX_R_LANE: "R4"
  RFX_R_JSON: "r4_fine.json"
  RFX_R_BLOCKS: "fine"
  RFX_R_THETA_OPT: "0.00020017717250242226 1.18316461480054e-05 2.2e-05"
  RFX_R_FINE_CASES: "opt_m3z2_w3:3:2:3:opt opt_m2_w3:2:0:3:opt opt_m2z3_w10:2:3:10:opt opt_m1_w10:1:0:10:opt nom_m1_w3:1:0:3:nom nom_m2_w3:2:0:3:nom nom_m1z2_w10:1:2:10:nom nom_m2z1_w10:2:1:10:nom nom_m2z3_w10:2:3:10:nom nom_m3z2_w3:3:2:3:nom"
  RFX_R_INCORE_MAX_GB: "44"
  RFX_R_DEADLINE_S: "4700"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
import:
  /root/upload/: volume://vessl-storage/rfx-fdfd-gpu-r-20260916
run: |-
  set -eu
  echo "=== rfx fdfd GPU lane r4 (lane_r_rfic.py, sha256 37f11e53e2bd248d) ==="
  date -u
  nvidia-smi || echo "nvidia-smi FAILED"
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" -V
  OUT=/root/workspace/claude-workspace/rfx/runs/fdfd-gpu-r4-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > /root/workspace/claude-workspace/rfx/runs/fdfd-gpu-r4.latest
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  export RFX_OUT="$OUT"
  WORK=/root/work/rfx-fdfd-gpu-r4
  rm -rf "$WORK"; mkdir -p "$WORK"
  echo "=== source: the uploaded tarball, imported at /root/upload/rfx-src-r.tgz ==="
  ls -la /root/upload/ || true
  test -f /root/upload/rfx-src-r.tgz || { echo "ERROR: import did not deliver /root/upload/rfx-src-r.tgz"; exit 3; }
  tar xzf /root/upload/rfx-src-r.tgz -C "$WORK"
  cd "$WORK"
  test -f "$WORK/rfx/fdfd/_cudss.py" || { echo "ERROR: payload did not unpack"; ls -la "$WORK"; exit 3; }
  echo "=== pip install (PyPI at job start) ==="
  "$PY" -m pip install -q jax[cpu]==0.6.2 "numpy<2.3" "scipy>=1.14" shapely pytest 2>&1 | tail -5
  set +e
  "$PY" -m pip install -q "nvmath-python[cu12]" cupy-cuda12x 2>&1 | tail -10
  gpu_pip=$?
  set -e
  echo "gpu_pip_rc=$gpu_pip" | tee "$OUT/pip.rc"
  "$PY" -m pip freeze > "$OUT/pip-freeze.txt" 2>/dev/null || true
  export PYTHONPATH="$WORK"
  export RFX_REPO_ROOT="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, rfx.fdfd.linear_solve as ls; print('probe ok | jax', jax.__version__, '| jax backend', jax.default_backend(), '| default_backend', ls.get_default_backend())"
  "$PY" -c "from rfx.fdfd import _cudss; import json; print('backends:', json.dumps(_cudss.availability(), indent=1))" | tee "$OUT/backends.txt"
  echo "=== lane r4 ==="
  set +x
  echo  | base64 -d > "$WORK/validation/vessl/_lane_embedded.py"
  set -x
  cmp -s "$WORK/validation/vessl/_lane_embedded.py" "$WORK/validation/vessl/lane_r_rfic.py" && echo "embedded lane == repo lane" || echo "NOTE: embedded lane differs from the tarball copy"
  set +e
  ( timeout 5100 "$PY" -u "$WORK/validation/vessl/_lane_embedded.py"; echo $? > "$OUT/r4.rc" ) 2>&1 | tee "$OUT/r4.log"
  set -e
  rc=$(cat "$OUT/r4.rc" 2>/dev/null || echo 99)
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "LANE=r4 RC=$rc"
  exit "$rc"
