name: rfx-fdfd-gpu-j0
description: "J0 probe: cuDSS/cuSOLVER availability, the linear_solve and hplane pytest suites with RFX_FDFD_BACKEND forced both ways, _cudss.selftest, gate G1 on the real W/3 spiral DUT fixture (N=108898: residuals, solution difference, factor/solve wall times, device memory, LU nnz), cuDSS plan-only memory estimates at W/3-W/4-W/6, and value_and_grad of L_dut at W/3 with both backends (equality 1e-8, plus the cuDSS gradient against the CPU study's recorded FD4). Submit: bash validation/vessl/submit.sh j0"
tags: [rfx, fdfd, gpu, cudss, j0]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: "noninteractive"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "16"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
  RFX_FDFD_BACKEND: "superlu"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
import:
  /root/upload/: volume://vessl-storage/rfx-fdfd-gpu-v-20260915
run: |-
  set -eu
  echo "=== rfx fdfd GPU lane j0 (lane_j0_probe.py, sha256 1e5128e0710605ad) ==="
  date -u
  nvidia-smi || echo "nvidia-smi FAILED"
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" -V
  OUT=/root/workspace/claude-workspace/rfx/runs/fdfd-gpu-j0-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > /root/workspace/claude-workspace/rfx/runs/fdfd-gpu-j0.latest
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  export RFX_OUT="$OUT"
  WORK=/root/work/rfx-fdfd-gpu-j0
  rm -rf "$WORK"; mkdir -p "$WORK"
  echo "=== source: the uploaded tarball, imported at /root/upload/rfx-src.tgz ==="
  ls -la /root/upload/ || true
  test -f /root/upload/rfx-src.tgz || { echo "ERROR: import did not deliver /root/upload/rfx-src.tgz"; exit 3; }
  tar xzf /root/upload/rfx-src.tgz -C "$WORK"
  cd "$WORK"
  test -f "$WORK/rfx/fdfd/_cudss.py" || { echo "ERROR: payload did not unpack"; ls -la "$WORK"; exit 3; }
  echo "=== pip install (PyPI at job start) ==="
  "$PY" -m pip install -q jax[cpu]==0.6.2 "numpy<2.3" "scipy>=1.14" shapely pytest 2>&1 | tail -5
  set +e
  "$PY" -m pip install -q "nvmath-python[cu12]" cupy-cuda12x 2>&1 | tail -10
  gpu_pip=$?
  set -e
  echo "gpu_pip_rc=$gpu_pip" | tee "$OUT/pip.rc"
  "$PY" -m pip freeze > "$OUT/pip-freeze.txt" 2>/dev/null || true
  export PYTHONPATH="$WORK"
  export RFX_REPO_ROOT="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, rfx.fdfd.linear_solve as ls; print('probe ok | jax', jax.__version__, '| jax backend', jax.default_backend(), '| default_backend', ls.get_default_backend())"
  "$PY" -c "from rfx.fdfd import _cudss; import json; print('backends:', json.dumps(_cudss.availability(), indent=1))" | tee "$OUT/backends.txt"
  echo "=== pytest: linear_solve + hplane, backend forced BOTH ways ==="
  set +e
  RFX_FDFD_BACKEND=superlu timeout 1800 "$PY" -m pytest tests/unit/fdfd/test_fdfd_linear_solve.py tests/unit/fdfd/test_fdfd_hplane.py -q -rs -p no:cacheprovider > "$OUT/pytest-superlu.log" 2>&1
  echo "$?" > "$OUT/pytest-superlu.rc"
  tail -n 15 "$OUT/pytest-superlu.log"
  RFX_FDFD_BACKEND=cudss timeout 1800 "$PY" -m pytest tests/unit/fdfd/test_fdfd_linear_solve.py tests/unit/fdfd/test_fdfd_hplane.py -q -rs -p no:cacheprovider > "$OUT/pytest-cudss.log" 2>&1
  echo "$?" > "$OUT/pytest-cudss.rc"
  tail -n 15 "$OUT/pytest-cudss.log"
  set -e
  echo "pytest rcs: superlu=$(cat "$OUT/pytest-superlu.rc") cudss=$(cat "$OUT/pytest-cudss.rc")"
  echo "=== lane j0 ==="
  set +x
  echo  | base64 -d > "$WORK/validation/vessl/_lane_embedded.py"
  set -x
  cmp -s "$WORK/validation/vessl/_lane_embedded.py" "$WORK/validation/vessl/lane_j0_probe.py" && echo "embedded lane == repo lane" || echo "NOTE: embedded lane differs from the tarball copy"
  set +e
  ( timeout 2400 "$PY" -u "$WORK/validation/vessl/_lane_embedded.py"; echo $? > "$OUT/j0.rc" ) 2>&1 | tee "$OUT/j0.log"
  set -e
  rc=$(cat "$OUT/j0.rc" 2>/dev/null || echo 99)
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "LANE=j0 RC=$rc"
  exit "$rc"
