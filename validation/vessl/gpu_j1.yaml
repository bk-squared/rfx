name: rfx-fdfd-gpu-j1
description: "J1 scale: the spiral levels the Mac cannot reach -- W/4 (N=172747) and W/6 (N=352536) of the SAME fixture as the CPU study, value_and_grad of L_dut through cuDSS, written as level blocks in spiral_convergence.json's structure plus the referee, and the extended 5-level Richardson. Submit: bash validation/vessl/submit.sh j1"
tags: [rfx, fdfd, gpu, cudss, j1]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: "noninteractive"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "16"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
  RFX_FDFD_BACKEND: "cudss"
  RFX_LANE_DIVS: "4 6"
  RFX_LANE_GRAD: "1"
  RFX_LANE_FD_DIV: "4"
  RFX_LANE_FD_PARAM: "2"
  RFX_LANE_FACTOR_CACHE: "1"
  RFX_LANE_DEADLINE_S: "5400"
  RFX_FDFD_CUDSS_HYBRID: "0"
  RFX_FDFD_CUDSS_FREE_FORWARD: "1"
  RFX_LANE_PEC: "1"
  RFX_LANE_IR_DIV: "3"
  RFX_LANE_IR_SWEEP: "0 1 2 4"
  RFX_LANE_IR_PHYSICS: "0 2 4"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
import:
  /root/upload/: volume://vessl-storage/rfx-fdfd-gpu-v-20260915
run: |-
  set -eu
  echo "=== rfx fdfd GPU lane j1 (lane_j1_scale.py, sha256 ee1e0ee7f0699889) ==="
  date -u
  nvidia-smi || echo "nvidia-smi FAILED"
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  "$PY" -V
  OUT=/root/workspace/claude-workspace/rfx/runs/fdfd-gpu-j1-$(date -u +%Y%m%dT%H%M%SZ)
  mkdir -p "$OUT"
  echo "$OUT" > /root/workspace/claude-workspace/rfx/runs/fdfd-gpu-j1.latest
  trap 'chmod -R a+rX "$OUT" 2>/dev/null || true' EXIT
  echo "artifacts: $OUT"
  export RFX_OUT="$OUT"
  WORK=/root/work/rfx-fdfd-gpu-j1
  rm -rf "$WORK"; mkdir -p "$WORK"
  echo "=== source: the uploaded tarball, imported at /root/upload/rfx-src.tgz ==="
  ls -la /root/upload/ || true
  test -f /root/upload/rfx-src.tgz || { echo "ERROR: import did not deliver /root/upload/rfx-src.tgz"; exit 3; }
  tar xzf /root/upload/rfx-src.tgz -C "$WORK"
  cd "$WORK"
  test -f "$WORK/rfx/fdfd/_cudss.py" || { echo "ERROR: payload did not unpack"; ls -la "$WORK"; exit 3; }
  echo "=== pip install (PyPI at job start) ==="
  "$PY" -m pip install -q jax[cpu]==0.6.2 "numpy<2.3" "scipy>=1.14" shapely pytest 2>&1 | tail -5
  set +e
  "$PY" -m pip install -q "nvmath-python[cu12]" cupy-cuda12x 2>&1 | tail -10
  gpu_pip=$?
  set -e
  echo "gpu_pip_rc=$gpu_pip" | tee "$OUT/pip.rc"
  "$PY" -m pip freeze > "$OUT/pip-freeze.txt" 2>/dev/null || true
  export PYTHONPATH="$WORK"
  export RFX_REPO_ROOT="$WORK"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx, rfx.fdfd.linear_solve as ls; print('probe ok | jax', jax.__version__, '| jax backend', jax.default_backend(), '| default_backend', ls.get_default_backend())"
  "$PY" -c "from rfx.fdfd import _cudss; import json; print('backends:', json.dumps(_cudss.availability(), indent=1))" | tee "$OUT/backends.txt"
  echo "=== lane j1 ==="
  set +x
  echo  | base64 -d > "$WORK/validation/vessl/_lane_embedded.py"
  set -x
  cmp -s "$WORK/validation/vessl/_lane_embedded.py" "$WORK/validation/vessl/lane_j1_scale.py" && echo "embedded lane == repo lane" || echo "NOTE: embedded lane differs from the tarball copy"
  set +e
  ( timeout 6600 "$PY" -u "$WORK/validation/vessl/_lane_embedded.py"; echo $? > "$OUT/j1.rc" ) 2>&1 | tee "$OUT/j1.log"
  set -e
  rc=$(cat "$OUT/j1.rc" 2>/dev/null || echo 99)
  ls -la "$OUT"
  chmod -R a+rX "$OUT" 2>/dev/null || true
  echo "LANE=j1 RC=$rc"
  exit "$rc"
