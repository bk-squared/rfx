# thru-deembed follow-up PROPOSAL (attempt-3 scale) — DO NOT RUN until a
# fresh pre-declaration (falsifiers committed first) exists for it.
#
# Standing after attempt 2 (branch agent/thru-deembed-r2, design note
# docs/design_notes/thru_feedpost_joint_extraction_predeclaration.md
# sections 8-9):
#   - attempt 1 STOPped on F-L1 (per-bin L decline under ASSUMED line
#     constants); attempt 2's joint (L, Zc, l_eff) inversion CONFIRMED
#     that mechanism experimentally (measured constants flatten L to 1%:
#     L* = 0.3819 +- 0.0326 nH, Zc* = 47.33 +- 0.38 ohm) but STOPped on
#     F-J2: fitted l_eff = 18.211 +- 0.197 mm vs the frozen [15, 18] mm
#     window — the excess (~7.8 ps) is quantitatively the two 1 mm
#     posts' own transit, which the window's trace-only derivation
#     omitted. Deterministic fixture data cannot be honestly re-fit
#     under a re-derived window, so the follow-up needs INDEPENDENT
#     information:
#   (a) dedicated single-post 1-port fixture (post + matched line into
#       CPML, no far post): separates the post's L and electrical
#       height from the line; dx sweep {0.5, 0.25, 0.125} mm splits
#       rasterization from physics (0.125 mm is GPU-scale).
#   (b) in-situ #313 two-plane Zc(f)/beta(f) measurement AT the
#       extraction bins: removes l_eff from the joint fit entirely.
# Gates for both arms MUST be pre-declared in a fresh design note
# BEFORE this job is launched; the B(L*) budget formula of the
# attempt-2 note section 5 remains valid for that lane.
name: thru-feedpost-singlepost-extraction
description: >
  rfx thru-deembed attempt-3: single-post 1-port L/height extraction
  (fine-dx sweep) + in-situ two-plane Zc/beta at the out-of-band bins;
  gates to be pre-declared in a fresh design note BEFORE launch.
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/jax:24.10-py3
import:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run:
  - workdir: /root/workspace/byungkwan-workspace/research/rfx/worktrees/thru-deembed-r2
    command: |
      pip install -e . --no-deps
      # Attempt-3 harness to be written together with its fresh
      # pre-declaration; planned arms (names reserved, not yet
      # implemented): --singlepost-dx-sweep and --insitu-zc on
      # validation/research/thru_feedpost_singlepost.py.
      # Apparatus regression first (attempt-2 instrument, exists today):
      PYTHONPATH=$PWD python validation/research/thru_feedpost_joint_extraction.py --verify \
        2>&1 | tee /root/workspace/byungkwan-workspace/research/rfx/logs/thru_feedpost_singlepost.log
