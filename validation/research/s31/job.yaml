name: rfx-s31-grouped-source-injection
description: 'S3-1 origin/main versus grouped injection HEAD; MSL arm A and A3-d G-wire 0.25 mm; warmed marginal
  ms/step. Resource choice: scope/cluster=remilab/remilab-c0 | needs=1 A6000, 64 GiB host RAM, JAX 0.10.2 | observed=2026-10-05T08:23:05.430845+00:00
  | candidates=gpu-a6000-1 (32 GiB), gpu-a6000-1-hi-mem (64 GiB) | selected=gpu-a6000-1-hi-mem | reason=user-pinned
  A6000 comparability and compilation headroom | unavailable=none in resource catalog; live free capacity not measured'
resources:
  cluster: remilab-c0
  preset: gpu-a6000-1-hi-mem
image: nvcr.io/nvidia/jax:24.10-py3
env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
  HDF5_USE_FILE_LOCKING: 'FALSE'
  MPLBACKEND: Agg
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: bash /root/workspace/claude-workspace/rfx/runs/s31/job.sh
