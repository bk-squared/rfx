# Microstrip through-line on FR4 — a small, fast config-CLI example.
#
# A 1.35 x 8.35 mm PEC trace on a 1 mm FR4 substrate over a PEC ground plane, fed by
# a 50 ohm lumped wire port at each end (port 1 excited, port 2 passive
# matched load) for a 2-port S-parameter sweep.
#
# FOIL IS A SHEET, A PLATE IS A VOLUME (lattice ownership contract, #931).
# Etched copper is declared under `thin_conductors:` as a Box with lo == hi on
# its normal axis — a footprint on ONE node plane, zero thickness, owning no
# cell, zeroing the two in-plane E components on its plane and leaving the E
# through it live. A `geometry:` entry with `material: pec` is the other
# declaration, a VOLUME: walls on both drawn faces with the cells between them
# shorted, which is what a plate, an iris or a machined wall is. Both
# conductors here used to be `geometry:` boxes drawn 0.5 mm thick, and the
# pre-#931 rule realized each as a single wall on its LOWER face — so the
# ground's wall sat 0.5 mm below the substrate it was supposed to bound.
#
# The grid is intentionally tiny (~57 x 41 x 29 cells, dx = 0.5 mm) so the
# whole run finishes in a few seconds on CPU. This is a structural / API
# smoke example, not a calibrated S-parameter reference. At this coarse mesh
# the 1 mm substrate is only ~2 cells thick. Refine `dx` for a quantitative
# run.
#
# Preflight on this file prints "All checks passed" (checked 2026-10-12 on
# main 50e266bc3). Until the trace was drawn at its solved size it was refused:
# preflight stops a sheet solved more than 1 % off its drawing (#1455).
#
#   rfx run examples/config/microstrip_thru.yaml --output thru.h5
#   rfx plot thru.h5 --quantity s_params --out thru_s11.png
#   rfx export-geometry examples/config/microstrip_thru.yaml --output thru_geo.json

frequency:
  freq_max: 12e9

domain: {x: 0.020, y: 0.012, z: 0.006}

boundary: cpml
cpml_layers: 8
dx: 0.0005

materials:
  fr4: {eps_r: 4.4, sigma: 0.02}   # small loss avoids artificially infinite Q

geometry:
  # FR4 substrate, 1 mm thick, between the two foils.
  - {shape: box, bounds: [[0.0, 0.0, 0.002], [0.020, 0.012, 0.003]], material: fr4}

thin_conductors:
  # Ground plane: copper foil ON the substrate's lower face (z = 2 mm), a
  # node plane of this mesh. sigma_bulk is above the 1e6 S/m PEC threshold,
  # so this is a lossless PEC sheet and `thickness` is not read.
  - {shape: box, bounds: [[0.0, 0.0, 0.002], [0.020, 0.012, 0.002]], sigma_bulk: 5.8e7}
  # Microstrip trace ON the substrate's upper face (z = 3 mm), drawn at the
  # size the solver realizes. A PEC sheet is solved 0.35 cell (0.175 mm here)
  # beyond the last node it covers at each free edge, so on this uniform
  # 0.5 mm mesh a sheet covering k cells is solved (k + 0.7) x 0.5 mm. The
  # trace covers y nodes 5.5 .. 6.5 mm (2 cells) and x nodes 6 .. 14 mm
  # (16 cells), so it is drawn 1.35 mm wide (y 5.325 .. 6.675 mm) and
  # 8.35 mm long (x 5.825 .. 14.175 mm): drawn = solved. A sheet drawn a whole
  # number of cells (1 mm, 8 mm) is solved 0.35 mm larger and preflight
  # refuses it (more than 1 % off its drawing).
  - {shape: box, bounds: [[0.005825, 0.005325, 0.003], [0.014175, 0.006675, 0.003]], sigma_bulk: 5.8e7}

sources:
  # Port 1: excited 50 ohm lumped wire port, seated inside the substrate near
  # the feed end. The wire starts above the ground sheet (z = 0.002) and stops
  # below the trace sheet (z = 0.003), so it drives the substrate without
  # either endpoint sitting on a realized wall plane. Under the ownership
  # contract those two planes ARE the two foils, so the comment now describes
  # the model that runs: before #931 the ground's realized wall was at
  # z = 0.0015 and this clearance was measured against a face that was not
  # there.
  - type: port
    position: [0.006, 0.006, 0.0021]
    component: ez
    impedance: 50.0
    extent: 0.0008
    waveform: {type: gaussian_pulse, f0: 6e9, bandwidth: 0.9, amplitude: 1.0}
  # Port 2: passive matched load (no excitation) for the off-diagonal S entry.
  - type: port
    position: [0.014, 0.006, 0.0021]
    component: ez
    impedance: 50.0
    extent: 0.0008
    excite: false

probes:
  - {position: [0.010, 0.006, 0.0025], component: ez}

execution:
  n_steps: 1200
  compute_s_params: true
  s_param_freq_start: 2e9
  s_param_freq_end: 10e9
  s_param_n_freqs: 81
  s_param_n_steps: 1200
